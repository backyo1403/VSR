<style>
/* ===================================================================
   VIDEO STAGE — overlay chrome and scene choreography.
   Every inner class is v- prefixed: the app already owns .tag, .sub,
   .rule, .num, .nm and .medal, and an unprefixed name silently inherits
   its font and colour.
   =================================================================== */
#vidRoot, .vid-copy, .vid-phone-wrap{font-family:var(--font-body);}
#vidRoot{position:fixed; inset:0; z-index:9000; pointer-events:none;}
.vid-hide{display:none !important;}

/* Page.captureScreenshot waits for a compositor commit. Once the ambient layers were
   frozen for render speed, the phone scenes had nothing animating at all — so no frame
   was produced until something changed, and the first DOM change then deadlocked the
   capture (identical bytes for 60 frames, then a hung socket). Two pixels animating
   forever guarantee a commit every frame and cost nothing. */
#vidHeartbeat{position:fixed; left:0; bottom:0; width:2px; height:2px; z-index:9999;
  pointer-events:none; background:#fff; animation:vidBeat .5s linear infinite;}
@keyframes vidBeat{0%{opacity:.03;} 50%{opacity:.08;} 100%{opacity:.03;}}

.vid-lower{
  position:absolute; left:64px; bottom:96px; max-width:1080px;

  background:linear-gradient(120deg, rgba(0,48,90,.94), rgba(0,91,172,.82));
  border:1px solid rgba(240,214,120,.42);
  box-shadow:0 26px 70px rgba(0,0,0,.5);
  border-left:6px solid var(--vna-gold);
  opacity:0; transform:translateY(26px);
  animation:vidLowerIn .85s cubic-bezier(.16,.84,.34,1) .25s forwards;
}
@keyframes vidLowerIn{to{opacity:1; transform:translateY(0);}}

}

.vid-lower .v-sub{margin-top:12px; font-size:23px; line-height:1.42; color:rgba(255,255,255,.93); font-weight:500; max-width:960px;}

/* ---------- capture cost ----------
   The ambient layers are full-viewport, blurred and drop-shadowed, and they animate
   continuously — which means the compositor re-rasterises them on every single frame,
   on every screen. Freezing the animations keeps the artwork exactly as designed (the
   clouds are still there, still soft, still layered) while letting the layer be cached,
   which is the difference between a render that finishes and one that does not. The
   motion the film actually needs — aircraft, camera, rain, countdown, ticker — is
   untouched. The front fog layer is dropped outright: it drifts over the aircraft, so
   frozen it would read as a smudge parked on the map. */
.cloud{animation:none !important;}
/* map-life is dropped rather than frozen: its clouds are opaque enough that a stopped one
   reads as a grey smear parked on the artwork, which is worse than not having it. The
   page-level .cloud-field behind everything is soft and low-opacity, so frozen it just
   looks like sky. */
#mapLife, #mapFog, .final-round-fx .sun-disc{display:none !important;}

/* a slow cinematic drift, much longer than the app's own 1.8s camera move */
.vid-cam-slow #mapZoomWrap{transition:transform 9s cubic-bezier(.33,0,.35,1) !important;}
.vid-cam-mid  #mapZoomWrap{transition:transform 3.2s cubic-bezier(.3,0,.25,1) !important;}

<script>
/* =====================================================================
   VIDEO SCENE DRIVER

   Runs only with ?scene=… — the page is otherwise the shipped app minus
   the three Firebase CDN tags, so every pin, icon, colour, weather theme
   and question card on screen is the real thing.

   Each scene is a timeline. `steps` returns [msFromSceneStart, fn] pairs
   which are scheduled with setTimeout at __vid.start(). The capture rig
   runs the page on virtual time, so those timers — and every CSS
   animation and the app's own countdown — advance exactly one frame per
   captured frame, however long the capture actually takes.
   ===================================================================== */
(function(){
  const P = new URLSearchParams(location.search);
  const SCENE = P.get('scene');
  if(!SCENE) return;

  const LEAD = parseInt(P.get('lead') || '350', 10);   // narration starts this late
  let CUES = {};
  try{ CUES = JSON.parse(P.get('cues') || '{}'); }catch(e){}
  /* cue time -> ms from scene start; unknown cues fall back so a scene still runs */
  const C = (name, fallback) => (name in CUES) ? (CUES[name] + LEAD)
                                              : (fallback === undefined ? LEAD : fallback);

  try{ FB.mode = 'offline'; }catch(e){}
  /* A modal dialog blocks the renderer, and the capture then hangs on its own socket
     timeout with nothing to show for it. Nothing in the player path should open one, but
     the cost of being sure is three lines. */
  window.alert = function(){}; window.confirm = function(){ return true; };
  window.prompt = function(){ return ''; };
  try{ window.toast = function(){}; }catch(e){}
  document.documentElement.lang = 'vi';
  try{ setLang('vi'); }catch(e){}

  const $ = id => document.getElementById(id);
  const R = code => ROUTE.findIndex(n => n.code === code);
  const FIN = () => ROUTE.length - 1;

  /* The one demo question the film uses, so the viewer reads the same card every time
     it appears instead of a different real question in each scene. */
  const DEMO_Q = {id:900, q:'Chúng ta đang ở đâu?', opts:['Milan','Amsterdam','Paris','London'], correct:0};
  QUESTIONS_BY_ID[900] = DEMO_Q;

  const NAMES = ['Minh Anh','Thu Hà','Đức Long','Lan Phương','Quốc Việt','Hải Yến',
                 'Bảo Nam','Kim Chi','Trung Kiên','Mỹ Linh','Tuấn Vũ','Ngọc Bích'];

  function seedPlayers(positions){
    const players = {};
    positions.forEach((pos, i) => {
      const id = 'p'+i;
      const answered = Math.max(1, pos + 1 + (i % 3));
      players[id] = {
        id, name: NAMES[i % NAMES.length], avatar: AVATARS[i % AVATARS.length],
        position: pos, correctCount: Math.max(1, Math.min(answered, pos || 1)),
        answeredCount: answered, currentStreak: (i % 4), longestStreak: 2 + (i % 4),
        answers: {}, totalAnswerTime: 41200 + i*8600 + (i%3)*2300,
        turboUsed: false, fiftyUsed: false, seatbeltUsed: false,
        reachedMuc: pos >= R('MUC'), joinedAt: Date.now() - 900000
      };
    });
    return players;
  }
  const FIELD = () => [R('SPC'), R('MOW'), R('MUC'), R('HUI'), R('DAD'),
                       R('HAN'), R('HAN'), R('AMS'), R('AMS'), R('CDG'), R('CDG'), 0];

  function baseState(){
    const s = defaultState();
    s.gameState = 'lobby';
    s.currentQ = 3;
    s.players = seedPlayers(FIELD());
    s.revealedLegs = {0:true, 1:true, 2:true};
    s.legBrief = {leg:2, total:12, correctCount:8, fastestName:'Minh Anh',
                  fastestTime:4820, avgTime:9640, turbo:2};
    return s;
  }

  // ---- actions -----------------------------------------------------------
  function move(id, delta){
    const p = state.players[id];
    if(!p) return;
    p.position = Math.max(0, Math.min(FIN(), p.position + delta));
    renderAll();
  }
  function moveMany(pairs){
    pairs.forEach(([id, d]) => {
      const p = state.players[id];
      if(p) p.position = Math.max(0, Math.min(FIN(), p.position + d));
    });
    renderAll();
  }
  function hotPin(code, ms){
    const idx = R(code);
    const el = document.querySelectorAll('#airportLayer .airport-node')[idx];
    if(!el) return;
    el.classList.remove('vid-hot');
    void el.offsetWidth;              // restart the keyframes for a repeat highlight
    el.classList.add('vid-hot');
    if(ms) setTimeout(()=>el.classList.remove('vid-hot'), ms);
  }
  /* Take the camera off the app: applyCamera() runs on every presenter tick and would
     undo any transform written from here on the very next second. */
  function camTo(x, y, scale, cls){
    document.body.classList.remove('vid-cam-slow','vid-cam-mid');
    if(cls) document.body.classList.add(cls);
    window.applyCamera = function(){
      const zw = $('mapZoomWrap');
      if(!zw) return;
      zw.style.transformOrigin = (x/MAP_W*100)+'% '+(y/MAP_H*100)+'%';
      zw.style.transform = 'scale('+scale+')';
    };
    window.applyCamera();
  }
  const camStop = (code, scale, cls) => camTo(ROUTE[R(code)].x, ROUTE[R(code)].y, scale, cls);

  /* the app seeds 26 raindrops for a wall; double them for the camera */
  function thickenRain(){
    document.querySelectorAll('.storm-fx').forEach(fx=>{
      const drops = fx.querySelectorAll('.rain-drop');
      if(!drops.length || fx.dataset.thick) return;
      fx.dataset.thick = '1';
      const proto = drops[0];
      for(let i=0;i<drops.length;i++){
        const d = proto.cloneNode(true);
        d.style.left = (Math.random()*100)+'%';
        d.style.animationDelay = (Math.random()*1.2).toFixed(2)+'s';
        fx.appendChild(d);

    });

          '<div class="vid-prize-row" id="vp3"><div class="v-medal">🥈</div><div class="v-rk">HẠNG 3</div>' +
            '<div class="v-pz">1 vé máy bay hạng Phổ thông</div></div>' +
          '<div class="vid-prize-row" id="vp4"><div class="v-medal">🥉</div><div class="v-rk">HẠNG 4 &amp; 5</div>' +
            '<div class="v-pz">Voucher 1 kiện hành lý (đồng hạng)</div></div>' +
          '<div class="vid-prize-note" id="vp5">Cùng rất nhiều phần quà nhỏ hấp dẫn khác</div>' +
        '</div><div class="vid-rule"></div>';
    },
    steps(){ return [
      [C('P1'), ()=>hot('#vp1')],
      [C('P2'), ()=>hot('#vp2')],
      [C('P3'), ()=>hot('#vp3')],
      [C('P4'), ()=>hot('#vp4')],
      [C('P5'), ()=>hot('#vp5')],
    ];}
  },

  /* ---------- 14 · sign-off ---------- */
  '14_loichuc': {
    build(){
      state = baseState();
      const F = FIN();
      state.players = seedPlayers([F, F, F, F, F, R('FRA'), R('PQC'), R('CXR'),
                                   R('SGN'), R('CPH'), R('MXP'), R('LHR')]);
      state.gameState = 'finished';
      goPresenter(); camStop('FINISH', 1.35, 'vid-cam-slow');
      overlay.innerHTML =
        '<div class="vid-out">' +
          '<img class="v-logo" src="vendor/vna-logo.png" alt="">' +
          '<div class="v-big">Chúc Quý đại lý<br><em>một đường bay thuận lợi</em></div>' +
          '<div class="v-small">và thật nhiều may mắn trên đường đua</div>' +
          '<div class="v-rule"></div>' +
          '<div class="v-qr">Hẹn gặp trên đường đua · Vietnam Airlines</div>' +
        '</div>';
    },
    steps(){ return [
      [1200, ()=>{ try{ confetti({particleCount:120, spread:82, origin:{y:.62},
                                  colors:['#D4AF37','#F0D678','#ffffff','#0B71C7']}); }catch(e){} }],
      [3000, ()=>{ try{ confetti({particleCount:90, spread:100, origin:{x:.2, y:.55},
                                  colors:['#D4AF37','#F0D678','#ffffff']}); }catch(e){} }],
      [4200, ()=>{ try{ confetti({particleCount:90, spread:100, origin:{x:.8, y:.55},
                                  colors:['#D4AF37','#F0D678','#ffffff']}); }catch(e){} }],
    ];}
  }
  };

  // =====================================================================
  function repaint(){
    try{ renderAll(); }catch(e){ console.error(e); }
    hideChrome(); liveFlag(); thickenRain();
  }

  const scene = SCENES[SCENE];
  if(!scene){ document.title = 'NO SUCH SCENE: ' + SCENE; return; }

  function boot(){
    const hb = document.createElement('div');
    hb.id = 'vidHeartbeat';
    document.body.appendChild(hb);
    hideChrome();
    try{ window.paintTickerFlag = liveFlag; }catch(e){}
    scene.build();
    repaint();
    try{ refreshEventFeed(true); }catch(e){}
    setTimeout(repaint, 400);
    window.__vidReady = true;
  }

  window.__vidStart = function(){
    (scene.steps ? scene.steps() : []).forEach(([ms, fn])=>{
      setTimeout(()=>{ try{ fn(); }catch(e){ console.error('step', ms, e); } }, Math.max(0, ms));
    });
    return true;
  };

  if(document.readyState === 'complete') setTimeout(boot, 200);
  else window.addEventListener('load', ()=>setTimeout(boot, 200));
})();
</script>
