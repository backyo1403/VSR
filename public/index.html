}
/* ============================================================
   SYNC LAYER
   ONLINE  — Firebase Realtime Database. One authoritative copy in the cloud that
             every phone and screen subscribes to. Writers own disjoint paths, so
             two clients can never overwrite each other's data:
               rooms/{ROOM}/admin           <- only the admin client writes
               rooms/{ROOM}/progress/{uid}  <- only the admin client writes
               rooms/{ROOM}/profiles/{uid}  <- only that player writes
               rooms/{ROOM}/answers/{leg}/{uid} <- only that player writes, once
             database.rules.json — not client discipline — is what actually stops
             a player writing another player's score or reading the answer key
             (answers/ as a whole is admin-read-only; a player never subscribes
             to it, it just keeps a local echo of its own writes).
   OFFLINE — falls back to the original localStorage + BroadcastChannel mode so a
             single-laptop game still runs if there is no network at the venue.
   ============================================================ */
let ROOM = (new URLSearchParams(location.search).get('room') || localStorage.getItem('vna_my_room') || 'SKY01').toUpperCase();
const MAX_PLAYERS_PER_ROOM = 200;

// Every top-level `state` key except `players` (that's synced separately, per-uid,
// via profiles/progress below) — this is the admin-owned "game state" slice.
const ADMIN_KEYS = ['gameState','currentQ','currentQuestionIndex','currentCorrectIndex',
  'questionIndexByLeg','powerQuestionActive','powerQuestionUsed','questionOpenedAt','deadline',
  'revealedLegs','undoSnapshot','paused','winnerId','milestones','awardShown','congratsShown',
  'stormClearedIds','stormRevealAt','revealAt','legAnnouncedAt','firstFinishAt','firstFinishId','finishSeq','legBrief'];

const FB = { mode:'init', role:'player', uid:null };
let db = null;            // the Realtime Database handle, created once firebase.initializeApp() runs
let roomRefs = null;      // {admin,profiles,progress,answers} refs currently subscribed, for cleanup on room switch
let _profiles = {};       // uid -> {name,avatar,joinedAt}
let _progress = {};       // uid -> {position,correctCount,totalAnswerTime,turboUsed,finishRank,currentStreak,longestStreak,answeredCount}
let _answers = {};        // leg -> uid -> {choice,turbo,submitted,timeTaken} — only ever populated for the admin

function pickAdminSlice(){
  const o = {};
  ADMIN_KEYS.forEach(k=>{ o[k] = (state[k]===undefined ? null : state[k]); });
  return o;
}
function applyAdminSlice(v){
  if(!v) return;
  ADMIN_KEYS.forEach(k=>{ if(v[k]!==undefined) state[k] = v[k]; });
  state.revealedLegs = state.revealedLegs || {};
  state.milestones = state.milestones || { HAN:null, SPC:null, SGN:null };
  state.questionIndexByLeg = state.questionIndexByLeg || {};
}
function rebuildPlayers(){
  const out = {};
  Object.keys(_profiles).forEach(id=>{
    const pr = _progress[id] || {};
    const ans = {};
    Object.keys(_answers).forEach(leg=>{
      if(_answers[leg] && _answers[leg][id]) ans[leg] = _answers[leg][id];
    });
    out[id] = {
      id,
      name: _profiles[id].name,
      avatar: _profiles[id].avatar,
      position: pr.position || 0,
      correctCount: pr.correctCount || 0,
      totalAnswerTime: pr.totalAnswerTime || 0,
      turboUsed: !!pr.turboUsed,
      fiftyUsed: !!pr.fiftyUsed,
      seatbeltUsed: !!pr.seatbeltUsed,
      finishRank: pr.finishRank || null,
      currentStreak: pr.currentStreak || 0,
      longestStreak: pr.longestStreak || 0,
      answeredCount: pr.answeredCount || 0,
      joinedAt: _profiles[id].joinedAt || Date.now(),
      answers: ans,
    };
  });
  state.players = out;
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  if(FB.mode==='online'){
    if(FB.role==='admin') fbWriteAdmin();
    if(myPlayerId) fbWriteMine();
  } else if(bc){
    // note: BroadcastChannel never delivers to the sender, so the acting tab
    // must repaint itself — otherwise the admin's own dashboard freezes offline
    bc.postMessage({type:'state', state});
  }
  renderAll();
}
function fbWriteAdmin(){
  if(FB.mode!=='online' || FB.role!=='admin') return;
  const u = {};
  u['rooms/'+ROOM+'/admin'] = pickAdminSlice();
  Object.values(state.players).forEach(p=>{
    u['rooms/'+ROOM+'/progress/'+p.id] = {
      position: p.position||0, correctCount: p.correctCount||0,
      totalAnswerTime: p.totalAnswerTime||0, turboUsed: !!p.turboUsed,
      fiftyUsed: !!p.fiftyUsed, seatbeltUsed: !!p.seatbeltUsed,
      finishRank: p.finishRank||null, currentStreak: p.currentStreak||0,
      longestStreak: p.longestStreak||0, answeredCount: p.answeredCount||0,
    };
  });
  db.ref().update(u).catch(e=>{ console.warn('[sync] admin write failed', e); toast(t('sync.errAdmin')); });
}
function fbWriteMine(){
  if(FB.mode!=='online' || !myPlayerId) return;
  const me = state.players[myPlayerId];
  if(!me) return;
  const u = {};
  u['rooms/'+ROOM+'/profiles/'+myPlayerId] = { name: me.name, avatar: me.avatar, joinedAt: me.joinedAt || Date.now() };
  const a = me.answers[state.currentQ];
  if(a && a.choice!==null && a.choice!==undefined){
    const row = { choice:a.choice, turbo:!!a.turbo, fifty:!!a.fifty, seatbelt:!!a.seatbelt, submitted:!!a.submitted, timeTaken: (typeof a.timeTaken==='number') ? a.timeTaken : null };
    u['rooms/'+ROOM+'/answers/'+state.currentQ+'/'+myPlayerId] = row;
    // keep a local echo so the option immediately re-renders as picked/locked
    // (a player is never subscribed to the answers tree — see database.rules.json)
    _answers[state.currentQ] = _answers[state.currentQ] || {};
    _answers[state.currentQ][myPlayerId] = row;
  }
  db.ref().update(u).catch(e=>{ console.warn('[sync] player write failed', e); toast(t('sync.errSend')); });
}
/* the admin client creates a progress node for anyone who has just joined */
function reconcileProgress(){
  if(FB.mode!=='online' || FB.role!=='admin') return;
  const u = {};
  Object.keys(_profiles).forEach(id=>{
    if(!_progress[id]) u['rooms/'+ROOM+'/progress/'+id] = {position:0,correctCount:0,totalAnswerTime:0,turboUsed:false,fiftyUsed:false,seatbeltUsed:false,finishRank:null,currentStreak:0,longestStreak:0,answeredCount:0};
  });
  if(Object.keys(u).length) db.ref().update(u).catch(()=>{});
}

function goOffline(why){

function fbDetachRoom(){
  if(!roomRefs) return;
  roomRefs.admin.off();
  roomRefs.profiles.off();
  roomRefs.progress.off();
  if(roomRefs.answers) roomRefs.answers.off();
  roomRefs = null;
}
/* admin/profiles/progress are readable by any signed-in client (see database.rules.json);
   answers is admin-only and subscribed separately once the admin gate succeeds. Firebase
   RTDB fires 'value' immediately with whatever is already there and again on every change,
   so there's no separate "fetch initial state" step the way Supabase's REST+realtime split needed. */
function fbSubscribeRoom(){
  fbDetachRoom();
  const base = db.ref('rooms/'+ROOM);
  const adminRef = base.child('admin');
  const profilesRef = base.child('profiles');
  const progressRef = base.child('progress');
  adminRef.on('value', s=>{ applyAdminSlice(s.val()); renderAll(); });
  profilesRef.on('value', s=>{ _profiles = s.val()||{}; reconcileProgress(); rebuildPlayers(); renderAll(); });
  progressRef.on('value', s=>{ _progress = s.val()||{}; rebuildPlayers(); renderAll(); });
  roomRefs = { admin:adminRef, profiles:profilesRef, progress:progressRef, answers:null };
  if(FB.role==='admin') fbSubscribeAnswers();
}
/* admin subscribes to the answer feed only after signing in (rules block it otherwise) */
function fbSubscribeAnswers(){
  if(FB.mode!=='online' || !roomRefs) return;
  const answersRef = db.ref('rooms/'+ROOM+'/answers');
  answersRef.on('value', s=>{ _answers = s.val()||{}; rebuildPlayers(); renderAll(); });
  roomRefs.answers = answersRef;
}

async function fbInit(){
  setSyncBadge();
  const cfgMissing = (typeof FIREBASE_CONFIG==='undefined') || !FIREBASE_CONFIG.apiKey ||
                     !FIREBASE_CONFIG.databaseURL || String(FIREBASE_CONFIG.databaseURL).indexOf('PASTE')===0;
  if(typeof firebase==='undefined'){ return goOffline('Firebase SDK not loaded'); }
  if(cfgMissing){ return goOffline('FIREBASE_CONFIG not filled in'); }

  const timer = setTimeout(()=>goOffline('no connection within 8s'), 8000);
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    const cred = await firebase.auth().signInAnonymously();
    FB.uid = cred.user.uid;
    clearTimeout(timer);
    FB.mode = 'online';

    // a player's identity is their Firebase uid, so a refresh never loses their aircraft
    if(location.hash.replace('#','')==='player') myPlayerId = FB.uid;

    fbSubscribeRoom();
    db.ref('.info/connected').on('value', s=>{
      if(FB.mode==='online') setSyncBadge();
      if(s.val()===false) console.warn('[sync] disconnected — RTDB will retry automatically');
    });
    setSyncBadge();
  }catch(e){
    clearTimeout(timer);
    goOffline(e && e.message ? e.message : e);
  }
}
/* switches the client to a different room the player typed at the join screen —
   only players do this; presenter/admin stay on the ?room= (or default) room.
   There's no "is this room open" catalog in Firebase (there was never an admin UI
   control for it even under Supabase) — any code is joinable, capped at
   MAX_PLAYERS_PER_ROOM so one room can't be overloaded by mistake. */
async function fbValidateRoom(code){
  try{
    const snap = await db.ref('rooms/'+code+'/profiles').once('value');
    if(snap.numChildren() >= MAX_PLAYERS_PER_ROOM) return { ok:false, reason:t('p.join.roomFull') };
    return { ok:true };
  }catch(e){
    return { ok:false, reason:t('p.join.roomUnreachable') };
  }
}
function fbSwitchRoom(code){
  ROOM = code;
  state = defaultState();
  fbSubscribeRoom();
  setSyncBadge();
}

/* ---------- admin gate ----------
   Single fixed password, "738B", both online and offline — a deliberate
   tradeoff: whoever reads this file's source (open to anyone, e.g. via
   browser DevTools) can find it and sign in as admin. Firebase requires
   real Auth passwords to be >=6 characters, so ADMIN_PASSWORD (what's typed
   at the gate) and ADMIN_FIREBASE_PASSWORD (the real Firebase Auth password
   used behind the scenes so admin writes actually pass database.rules.json)
   are two different constants. The admin@vna-sky-race.local account's
   Firebase password MUST be set to match ADMIN_FIREBASE_PASSWORD exactly
   (Firebase console -> Authentication -> Users) for online admin login to
   work — if they ever drift apart, admin sign-in will fail online. */
const ADMIN_PASSWORD = '738B';
const ADMIN_FIREBASE_PASSWORD = 'VNA-SkyRace-738B';
function openAdminGate(){

const RULES_PAGES = 5;

function rulesGoPage(n){
  rulesPage = Math.max(1, Math.min(RULES_PAGES, n));
  document.querySelectorAll('.rules-page').forEach(p=>{
    p.classList.toggle('active', +p.dataset.page === rulesPage);
  });
  const dots = document.getElementById('rulesDots');
  dots.innerHTML = '';

    const b = document.createElement('button');
    b.className = 'rules-dot' + (i===rulesPage?' on':'');
    b.title = 'Page '+i;
    b.onclick = ()=>rulesGoPage(i);
    dots.appendChild(b);
  }
  document.getElementById('rulesPrevBtn').style.visibility = rulesPage===1 ? 'hidden' : 'visible';
  const nextBtn = document.getElementById('rulesNextBtn');
  if(rulesPage===RULES_PAGES){ nextBtn.textContent = t('rules.close'); nextBtn.onclick = closeRulesModal; }
  else { nextBtn.textContent = t('rules.next'); nextBtn.onclick = ()=>rulesGoPage(rulesPage+1); }
  document.querySelector('.rules-modal-card').scrollTop = 0;
}
/* A static drawing of the whole route for the guide — same S-curve and the same ROUTE
   coordinates the presenter map uses, so what players study here is exactly the board
   they'll race on. Purely illustrative: no aircraft, no live state. */
function buildRulesRouteMap(){
  const wrap = document.getElementById('rulesMapWrap');
  if(!wrap) return;
  const pts = ROUTE.map(a=>`${a.x},${a.y}`).join(' ');
  const nodes = ROUTE.map((a,i)=>{
    const r = a.checkpoint ? 19 : 12;
    const fill = a.checkpoint ? 'var(--vna-gold)' : 'rgba(11,113,199,.95)';
    const stroke = a.checkpoint ? '#F0D678' : 'rgba(255,255,255,.75)';
    // labels alternate above/below the node so neighbouring codes never collide
    const labelY = a.y + (i % 2 ? -(r + 12) : (r + 26));
    return `<circle cx="${a.x}" cy="${a.y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="3"/>
      <text x="${a.x}" y="${labelY}" text-anchor="middle" class="${a.checkpoint?'rm-cp':'rm-code'}">${a.code}</text>`;
  }).join('');
  // Fit the viewBox to the points themselves. The S-curve only occupies the middle ~60% of
  // the presenter's 1000-wide canvas, so reusing that canvas here left big empty margins
  // and shrank the drawing to an unreadable strip inside the narrow guide modal.
  const xs = ROUTE.map(a=>a.x), ys = ROUTE.map(a=>a.y);
  const padX = 52, padTop = 46, padBottom = 62; // room for the node rings and the code labels
  const x0 = Math.min(...xs) - padX, x1 = Math.max(...xs) + padX;
  const y0 = Math.min(...ys) - padTop, y1 = Math.max(...ys) + padBottom;
  wrap.innerHTML = `<svg viewBox="${x0} ${y0} ${x1-x0} ${y1-y0}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sky Race route">
    <polyline points="${pts}" fill="none" stroke="#D4AF37" stroke-width="4" stroke-dasharray="4 14"
      stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
    ${nodes}
  </svg>`;
}

async function submitAdminGate(){
  const v = document.getElementById('adminPassInput').value.trim();
  const err = document.getElementById('adminGateError');
  if(!v) return;

  if(v.toUpperCase() !== ADMIN_PASSWORD){ err.textContent = t('gate.wrong'); return; }

  if(FB.mode!=='online'){
    FB.role='admin'; closeAdminGate(); go('admin');
    return;
  }

  err.textContent = t('gate.signing');
  try{
    // the admin typed ADMIN_PASSWORD above; ADMIN_FIREBASE_PASSWORD (a different,
    // Firebase-valid constant — see the comment above ADMIN_PASSWORD) is what
    // actually authenticates against Firebase so database.rules.json admin writes work
    const cred = await firebase.auth().signInWithEmailAndPassword(ADMIN_EMAIL, ADMIN_FIREBASE_PASSWORD);
    FB.uid = cred.user.uid;
    FB.role = 'admin';
    myPlayerId = null;               // the admin is not a racer
    fbSubscribeAnswers();            // answer feed is admin-only under the rules
    reconcileProgress();
    closeAdminGate();
    go('admin');
    toast(t('gate.signedIn',{room:ROOM}));
  }catch(e){
    err.textContent = (e && e.code==='auth/too-many-requests')
      ? t('gate.tooMany')
      : t('gate.fbFail');
  }
}
document.addEventListener('keydown', (e)=>{

    d.className = 'avatar-opt' + (selectedAvatar===av ? ' selected':'');
    d.innerHTML = avatarHTML(av, '1.3em');
    d.onclick = ()=>{ selectedAvatar = av; initPlayerAvatarGrid(); };
    grid.appendChild(d);
  });
}
initPlayerAvatarGrid();
document.getElementById('pRoomCode').value = ROOM;

async function playerJoin(){
  const roomInput = document.getElementById('pRoomCode').value.trim().toUpperCase();
  const name = document.getElementById('pName').value.trim();
  if(!roomInput){ toast(t('p.join.needRoom')); return; }
  if(!name){ toast(t('p.join.needName')); return; }
  if(!selectedAvatar){ toast(t('p.join.needAvatar')); return; }

  const joinBtn = document.getElementById('pJoinBtn');
  joinBtn.disabled = true;
  try{
    if(FB.mode==='online' && roomInput!==ROOM){
      const check = await fbValidateRoom(roomInput);
      if(!check.ok){ toast('⚠️ '+check.reason); return; }
      fbSwitchRoom(roomInput);
    }

    // Online, the player's identity IS their Firebase uid — it survives a refresh,
    // a dead battery, or the phone locking, so nobody loses their aircraft mid-race.
    myPlayerId = (FB.mode==='online' && FB.uid) ? FB.uid : uid();

    localStorage.setItem('vna_my_player_id', myPlayerId);
    localStorage.setItem('vna_my_room', ROOM);
    state.players[myPlayerId] = {
      id: myPlayerId, name, avatar: selectedAvatar, position: 0, correctCount:0, answers:{}, totalAnswerTime:0, turboUsed:false, fiftyUsed:false, seatbeltUsed:false, finishRank:null, currentStreak:0, longestStreak:0, answeredCount:0, joinedAt: Date.now()
    };
    saveState();
    document.getElementById('pRegistration').classList.add('hidden');
    document.getElementById('pGame').classList.remove('hidden');
    renderPlayer();
    toast(t('p.join.welcome',{name:name}));
  } finally {
    joinBtn.disabled = false;
  }
}

// Client-side companion to the server-enforced deadline (the answers RLS policy checks
// `deadline > now()` for online games): once a player's own countdown reaches 0, their UI stops
// taking picks/submits too, rather than staying interactive until admin clicks Close.
function myTimeUp(){
  return state.gameState==='question' && !!state.questionOpenedAt && (Date.now()-state.questionOpenedAt) >= TIMER_SECONDS*1000;
}
// seconds left on the current question, or null if no question is running — shared by the
// player countdown, the presenter countdown and the admin dashboard clock so all three agree
function secondsRemaining(){
  if(!state.questionOpenedAt) return null;
  return Math.max(0, TIMER_SECONDS - Math.floor((Date.now()-state.questionOpenedAt)/1000));
}

/* One painter for all three clocks (player phone, presenter wall, admin dashboard).
   They used to be written inside each view's own render, and each view repaints on its
   own 1-second interval — so depending where in the second a given screen happened to
   tick, two screens could sit a full second apart. This is called from a fast 200ms tick
   as well as from the renders, so every clock lands on the same number within 200ms.
   It only touches the three text nodes, never a full re-render. */
function paintCountdowns(){
  const remain = secondsRemaining();
  const running = state.gameState==='question' && remain!==null;
  const urgent = running && remain<=URGENT_SECONDS;
  const idle = state.gameState==='locked' ? t('a.locked')
             : state.gameState==='reveal' ? t('a.revealed') : '--';

  const p = document.getElementById('pTimer');
  if(p){
    p.textContent = running ? remain+'s' : idle;
    p.classList.toggle('urgent', urgent);
  }
  const a = document.getElementById('adminTimer');
  if(a){
    a.textContent = running ? remain+'s' : idle;
    a.classList.toggle('urgent', urgent);
  }
  // the presenter clock lives inside an overlay that only exists while a question is up
  const pq = document.querySelector('#presQuestionOverlay .pq-timer');
  if(pq && state.gameState!=='reveal'){
    pq.textContent = running ? remain : '--';
    pq.classList.toggle('urgent', urgent);
  }
}
function playerSubmitAnswer(choiceIdx){
  const me = state.players[myPlayerId];
  if(!me) return;
  if(state.gameState !== 'question') return;
  if(myTimeUp()){ toast(t('p.timeUpToast')); return; }
  const existing = me.answers[state.currentQ];
  if(existing && existing.submitted) return;
  me.answers[state.currentQ] = { choice: choiceIdx, submitted:false, turbo: existing ? !!existing.turbo : false, fifty: existing ? !!existing.fifty : false, seatbelt: existing ? !!existing.seatbelt : false };
  saveState();
  renderPlayer();
}
/* The three help icons. Drawn as inline SVG (and a text glyph for 50%) rather than emoji:
   emoji carry their own fixed palette, so ✂️ ⚡ 🔒 sat side by side in three different
   colours. These inherit `currentColor`, so all three always match whatever the button
   sets — including the gold business-class skin. */
const HELP_ICONS = {
  fifty: '<span class="fifty-glyph">50%</span>',
  turbo: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.6 2 5 13.4h5.3L9.5 22l8.9-11.9h-5.5z"/></svg>',
  // the aircraft "fasten seat belt" pictogram: two straps down into a solid buckle body
  // with the tongue plugged into its right-hand side
  seatbelt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">'
    + '<path d="M3.4 3.6 9.4 10.9" stroke-width="2.5"/><path d="M20.6 3.6 14.6 10.9" stroke-width="2.5"/>'
    + '<rect x="2.6" y="12" width="10.9" height="9.1" rx="2.4" fill="currentColor" stroke="none"/>'
    + '<path d="M12.4 14.1H18.3a2.1 2.1 0 0 1 2.1 2.1v0.8a2.1 2.1 0 0 1-2.1 2.1H12.4" stroke-width="2.2"/></svg>',
};

/* ---------- the three helps ----------
   All three unlock per player the moment THEIR OWN aircraft reaches MUC — not when the
   race reaches MUC — and each is usable once per game. 50:50 and Turbo are "boosts" and
   are locked during turbulence/storm/power question; Fasten Seatbelt is the mirror image,
   usable only during turbulence.
   The used-flags live on the progress node (admin-owned), so they survive a refresh and a
   player cannot hand themselves a fresh set of helps by reloading. */
function me_turbulenceActive(){ return isTurbulenceLeg(state.currentQ); }
function me_stormActive(){ return isStormLeg(state.currentQ); }
function helpsUnlocked(){
  const me = state.players[myPlayerId];
  return !!me && me.position >= TURBO_MIN_LEG;
}
function boostsBlocked(){
  return me_turbulenceActive() || me_stormActive() || !!state.powerQuestionActive;
}
function boostBlockedReason(what){
  if(me_turbulenceActive()) return t('h.blockTurb',{what:what});
  if(me_stormActive()) return t('h.blockStorm',{what:what});
  if(state.powerQuestionActive) return t('h.blockPower',{what:what});
  return t('h.blockLocked',{what:what});
}
// true while the player can still change their mind about this leg
function canActNow(){
  const me = state.players[myPlayerId];
  if(!me) return false;
  const a = me.answers[state.currentQ];
  return state.gameState==='question' && !myTimeUp() && !(a && a.submitted);
}
function myAnswerDraft(){
  const me = state.players[myPlayerId];
  return me.answers[state.currentQ] || { choice:null, submitted:false };
}
function isTurboEligibleNow(){
  return helpsUnlocked() && !boostsBlocked();
}
function playerToggleTurbo(){
  const me = state.players[myPlayerId];
  if(!me) return;
  if(me.turboUsed){ toast(t('h.turboUsed')); return; }
  if(myTimeUp()){ toast(t('p.timeUpToast')); return; }
  if(!isTurboEligibleNow()){ toast(boostBlockedReason(t('h.nameTurbo'))); return; }
  const existing = myAnswerDraft();
  if(existing.submitted) return;
  existing.turbo = !existing.turbo;
  me.answers[state.currentQ] = existing;
  saveState();
  renderPlayer();
}
function playerUseFifty(){
  const me = state.players[myPlayerId];
  if(!me) return;
  if(me.fiftyUsed){ toast(t('h.fiftyUsed')); return; }
  if(myTimeUp()){ toast(t('p.timeUpToast')); return; }
  if(!helpsUnlocked() || boostsBlocked()){ toast(boostBlockedReason(t('h.nameFifty'))); return; }
  const existing = myAnswerDraft();
  if(existing.submitted || existing.fifty) return;
  existing.fifty = true;
  me.answers[state.currentQ] = existing;
  saveState();
  renderPlayer();
  toast(t('h.fiftyDone'));
}
function playerToggleSeatbelt(){
  const me = state.players[myPlayerId];
  if(!me) return;
  if(me.seatbeltUsed){ toast(t('h.beltUsed')); return; }
  if(myTimeUp()){ toast(t('p.timeUpToast')); return; }
  if(!helpsUnlocked()){ toast(t('h.beltNeedMuc')); return; }
  if(!me_turbulenceActive()){ toast(t('h.beltOnlyTurb')); return; }
  const existing = myAnswerDraft();
  if(existing.submitted) return;
  existing.seatbelt = !existing.seatbelt;
  me.answers[state.currentQ] = existing;
  saveState();
  renderPlayer();
}
/* Which two options 50:50 struck out. Derived, not stored: seeded by this player's id and
   the question id so the same two stay struck out across every re-render and a refresh,
   without needing another synced field. */
function hashString(s){
  let h = 2166136261;
  for(let i=0;i<String(s).length;i++){ h ^= String(s).charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function eliminatedOptions(){
  const me = state.players[myPlayerId];
  if(!me) return null;
  const a = me.answers[state.currentQ];
  if(!a || !a.fifty) return null;
  const qd = QUESTIONS_BY_ID[state.currentQuestionIndex];
  if(!qd) return null;
  const wrong = qd.opts.map((_,i)=>i).filter(i=>i!==qd.correct);
  const rand = seededRandom((hashString(myPlayerId) ^ (qd.id*2654435761)) >>> 0);
  const survivor = wrong[Math.floor(rand()*wrong.length)];
  return wrong.filter(i=>i!==survivor);
}
function playerConfirmSubmit(){
  const me = state.players[myPlayerId];
  if(!me) return;
  if(myTimeUp()){ toast(t('p.timeUpToast')); renderPlayer(); return; }
  const a = me.answers[state.currentQ];
  if(!a || a.choice===null || a.choice===undefined){ toast(t('p.pickFirst')); return; }
  a.submitted = true;
  a.timeTaken = state.questionOpenedAt ? (Date.now() - state.questionOpenedAt) : 0;
  // NB: totalAnswerTime is NOT accumulated here. It lives on the admin-owned progress node,
  // so a write from the player is discarded online and the leaderboard clock stayed at 0.
  // adminRevealAnswer sums it from each submitted answer's timeTaken instead.
  // local echo so the help buttons grey out instantly; the durable copy is written by the
  // admin client at reveal (progress is admin-owned — see database.rules.json)
  if(a.turbo) me.turboUsed = true;
  if(a.fifty) me.fiftyUsed = true;
  if(a.seatbelt) me.seatbeltUsed = true;
  saveState();
  renderPlayer();
}

/* The player's phone mirrors the weather on the presenter wall — same tint, same rain or
   sun rays — so the room and the handset tell one story. The FX layer is only mounted while
   the player view is actually on screen (renderPlayer runs on every client, presenter included). */
function applyPlayerWeatherSkin(){
  const view = document.getElementById('view-player');
  const visible = !view.classList.contains('hidden');
  const turbulent = isTurbulenceLeg(state.currentQ);
  const stormy = isStormLeg(state.currentQ) && !turbulent;
  const powerOn = !!state.powerQuestionActive && !turbulent && !stormy;
  // "live" covers both the lobby announcement and the question itself
  const live = state.gameState==='question' || state.gameState==='locked' || state.gameState==='reveal' || !!wxAnnounceFor();
  view.classList.toggle('wx-turbulence', turbulent && live);
  view.classList.toggle('wx-storm', stormy && live);
  view.classList.toggle('wx-power', powerOn && live);

  // the phone mirrors the wall's FINAL ROUND sunshine too
  const finalRound = finalRoundActive() && !turbulent && !stormy;
  view.classList.toggle('final-round-theme', finalRound);

  const want = !visible ? null
    : (turbulent && live) ? 'rain'
    : (stormy && live) ? 'heavyrain'
    : ((powerOn && live) || finalRound) ? 'sun' : null;
  let fx = document.getElementById('playerFx');
  if(!want){ if(fx) fx.remove(); return; }
  if(fx && fx.dataset.kind===want) return; // already showing — don't respawn the drops each tick
  if(fx) fx.remove();
  fx = document.createElement('div');
  fx.id = 'playerFx';
  fx.className = 'player-fx';
  fx.dataset.kind = want;
  if(want==='sun'){
    fx.innerHTML = '<div class="sunny-fx"><div class="sun-ray"></div></div>';
  } else {
    const heavy = want==='heavyrain';
    fx.innerHTML = '<div class="lightning-flash'+(heavy?' thunder-flash':'')+'"></div>' +
      Array.from({length: heavy?24:15}).map(()=>`<div class="rain-drop${heavy?' thunder-drop':''}" style="left:${Math.random()*100}%; animation-delay:${(Math.random()*1.2).toFixed(2)}s; animation-duration:${(0.45+Math.random()*0.4).toFixed(2)}s;"></div>`).join('');
  }
  document.body.appendChild(fx);
}

/* The whole route laid out across the top of the phone instead of a bar of anonymous dots:
   the stop you're parked at is lit up and named, everything else fades back. Stops already
   behind you stay slightly brighter than the ones still ahead, so progress reads at a glance. */
function renderPlayerRouteStrip(me){
  const strip = document.getElementById('pRouteStrip');
  if(!strip) return;
  const pos = me.position;
  strip.innerHTML = ROUTE.map((node,i)=>{
    const cls = i===pos ? 'here' : (i<pos ? 'done' : 'ahead');
    return `<div class="rs-stop ${cls}${node.checkpoint?' cp':''}">
      <div class="rs-slot"><div class="rs-dot">${node.icon}</div></div>
      <div class="rs-code">${node.code}</div>
    </div>`;
  }).join('');
  // keep the lit stop in view once the route runs wider than the phone
  const here = strip.querySelector('.rs-stop.here');
  if(here && strip.scrollWidth > strip.clientWidth){
    strip.scrollLeft = here.offsetLeft - strip.clientWidth/2 + here.offsetWidth/2;
  }
}

/* Top 3 fly business class: the whole phone turns Vietnam Airlines gold, and they're told
   who is breathing down their neck — the point being that a lead is something to defend. */
function renderBizRibbon(me){
  const wrap = document.getElementById('pBizRibbon');
  const view = document.getElementById('view-player');
  const ranked = rankedPlayers();
  const idx = ranked.findIndex(p=>p.id===myPlayerId);
  // Cabin upgrade by standing: the leader flies Business (gold), 2nd flies Premium Economy
  // (the jade green of that cabin), everyone from 3rd down sits in the normal skin.
  const enoughPlayers = ranked.length >= 2;
  const tier = !enoughPlayers ? null : (idx===0 ? 'biz' : (idx===1 ? 'prem' : null));
  view.classList.toggle('biz-gold', tier==='biz');
  view.classList.toggle('cabin-premium', tier==='prem');
  if(!tier){ wrap.innerHTML = ''; return; }
  const medal = RANK_TROPHY[idx];
  const place = t('biz.place'+(idx+1));
  const chaser = ranked[idx+1];
  let sub;
  if(chaser){
    const gap = (me.position||0) - (chaser.position||0);
    const gapTxt = gap<=0 ? t('biz.level') : (gap===1 ? t('biz.oneLeg') : t('biz.nLegs',{n:gap}));
    sub = t('biz.chasing',{name:escapeHtml(chaser.name), gap:gapTxt});
  } else {
    sub = t('biz.alone');
  }
  wrap.innerHTML = `<div class="biz-ribbon ${tier==='prem'?'prem-ribbon':''}">
    <div class="medal">${medal}</div>
    <div><div class="tt">${t(tier==='prem'?'prem.title':'biz.title',{n:place})}</div><div class="sb">${sub}</div></div>
  </div>`;
}

/* The three round help buttons, sitting right under "Select an answer above". */
function renderHelps(me, myAns){
  const wrap = document.getElementById('pHelpsWrap');
  if(!wrap) return;
  const rankHelps = helpsUnlocked();
  const live = canActNow();
  const armedTurbo = !!(myAns && myAns.turbo);
  const armedBelt = !!(myAns && myAns.seatbelt);
  const fiftyGone = !!me.fiftyUsed || !!(myAns && myAns.fifty);
  const boostOk = live && !boostsBlocked();
  const beltOk = live && rankHelps && me_turbulenceActive();
  const btn = (ic, lb, spent, armed, disabled, title, fn)=>
    `<button class="help-btn${spent?' spent':(armed?' armed':'')}" ${disabled?'disabled':''} title="${title}" onclick="${fn}"><span class="ic">${ic}</span><span class="lb">${lb}</span></button>`;
  wrap.innerHTML = `<div class="help-row">
    ${btn(HELP_ICONS.fifty,t('h.fifty'), fiftyGone, false, fiftyGone || !rankHelps || !boostOk,
        fiftyGone?t('h.fiftyUsed'):t('h.fiftyTip'), 'playerUseFifty()')}
    ${btn(HELP_ICONS.turbo,t('h.turbo'), !!me.turboUsed, armedTurbo, !!me.turboUsed || !rankHelps || !boostOk,
        me.turboUsed?t('h.turboUsed'):t('h.turboTip'), 'playerToggleTurbo()')}
    ${btn(HELP_ICONS.seatbelt,t('h.belt'), !!me.seatbeltUsed, armedBelt, !!me.seatbeltUsed || !beltOk,
        me.seatbeltUsed?t('h.beltUsed'):t('h.beltTip'), 'playerToggleSeatbelt()')}
  </div>`;
  let hint = '';
  if(armedTurbo) hint = t('h.armedTurbo');
  else if(armedBelt) hint = t('h.armedBelt');
  else if(me_turbulenceActive()) hint = t('h.turbOnly');
  else if(me_stormActive()) hint = t('h.stormAll');
  else if(state.powerQuestionActive) hint = t('h.powerAll');
  else if(!rankHelps) hint = t('h.locked',{code:ROUTE[TURBO_MIN_LEG].code});
  if(hint) wrap.innerHTML += `<div class="help-hint">${hint}</div>`;
}

function renderPlayer(){
  const badge = document.getElementById('pStateBadge');
  badge.textContent = t('st.'+state.gameState);

  if(!myPlayerId || !state.players[myPlayerId]){
    document.getElementById('pRegistration').classList.remove('hidden');
    document.getElementById('pGame').classList.add('hidden');
    // drop any skin left over from a previous session, otherwise a reset or a removed
    // player leaves the join screen wearing the gold business-class background
    document.getElementById('view-player').classList.remove('biz-gold','cabin-premium','wx-turbulence','wx-storm','wx-power','final-round-theme');
    const fx = document.getElementById('playerFx'); if(fx) fx.remove();
    return;
  }
  document.getElementById('pRegistration').classList.add('hidden');
  document.getElementById('pGame').classList.remove('hidden');
  const me = state.players[myPlayerId];
  document.getElementById('pAvatarShown').innerHTML = avatarHTML(me.avatar, '1.2em');

  // where you are in the field, and where you physically are on the map
  const ranked = rankedPlayers();
  const myRankIdx = ranked.findIndex(p=>p.id===myPlayerId);
  const myRank = myRankIdx>=0 ? (myRankIdx+1) : '—';
  const here = ROUTE[me.position];
  document.getElementById('pDest').innerHTML = `#${myRank} <span style="font-size:11px; opacity:.6;">${t('p.of',{n:ranked.length})}</span>`;
  document.getElementById('pLocation').innerHTML = `${here.code} <span style="font-size:10.5px; opacity:.6; font-family:var(--font-body);">${escapeHtml(here.city)}</span>`;
  // total answer time — the tie-break when several aircraft land on the same reveal
  document.getElementById('pTotalTime').textContent = formatTime(me.totalAnswerTime);

  renderBizRibbon(me);
  applyPlayerWeatherSkin();

  // the big turbulence/storm/power card between questions — same copy as the presenter wall
  const wxa = wxAnnounceFor();
  const wxWrap = document.getElementById('pWxAnnounce');
  wxWrap.innerHTML = wxa
    ? `<div class="wx-announce ${wxa.cls}"><div class="ic">${wxa.icon}</div><div class="tt">${wxa.title}</div><div class="rl">${wxa.rule}</div></div>`
    : '';

  renderPlayerRouteStrip(me);

  const timerEl = document.getElementById('pTimer');
  const bannerEl = document.getElementById('pStatusBanner');
  const optsEl = document.getElementById('pOptions');
  const eyebrow = document.getElementById('pQEyebrow');
  const qText = document.getElementById('pQText');
  const powerNoteEl = document.getElementById('pPowerNote');
  const stormNoteEl = document.getElementById('pStormNote');
  const helpsWrap = document.getElementById('pHelpsWrap');
  const clearTimer = ()=>{ timerEl.textContent = '--'; timerEl.classList.remove('urgent'); };

  // Once the race is decided, EVERY player gets their own final standing and a sign-off —
  // not just the four who landed. Handled before the finishRank branch so finishers get
  // this version rather than the mid-race "you landed" one.
  if(state.gameState==='finished'){
    const rankedAll = rankedPlayers();
    const idx = rankedAll.findIndex(p=>p.id===myPlayerId);
    const place = idx>=0 ? idx+1 : null;
    const onPodium = place && place<=FINISHERS_TO_END;
    const medal = onPodium ? RANK_TROPHY[place-1] : '✈️';
    eyebrow.textContent = t('p.raceComplete');
    qText.innerHTML = `
      <div style="font-size:40px; line-height:1; margin-bottom:8px;">${medal}</div>
      <div style="font-size:22px; font-weight:800; margin-bottom:4px;">${place ? t('p.placeN',{n:ordinal(place)}) : t('p.raceOver')}</div>
      <div style="font-size:13px; font-weight:600; color:var(--vna-gold-light); margin-bottom:12px;">
        ${onPodium ? t('p.prize'+place) : (place ? t('p.outOf',{n:rankedAll.length}) : '')}
      </div>
      <div style="font-size:14px; font-weight:400; color:rgba(255,255,255,.85); line-height:1.6;">
        ${onPodium ? t('p.congratsPodium') : t('p.congratsOther')}
        <br><br>${t('p.wish')}
      </div>`;
    optsEl.innerHTML=''; bannerEl.classList.add('hidden'); clearTimer();
    if(powerNoteEl) powerNoteEl.classList.add('hidden');
    if(stormNoteEl) stormNoteEl.classList.add('hidden');
    if(helpsWrap) helpsWrap.innerHTML='';
    return;
  }

  // Reaching FINISH is a personal milestone shown the moment it happens — the race
  // itself keeps going for everyone else until at least 4 aircraft have landed.
  if(me.finishRank){
    const medal = RANK_TROPHY[me.finishRank-1] || '🏅';
    eyebrow.textContent = t('p.finished');
    qText.innerHTML = `<div style="font-size:21px; font-weight:800; margin-bottom:12px;">${t('p.finishedPlace',{medal:medal, n:ordinal(me.finishRank)})}</div><div style="font-size:14px; font-weight:400; color:rgba(255,255,255,.82); line-height:1.55;">${t('p.finishedMsg')}</div>`;
    optsEl.innerHTML=''; bannerEl.classList.add('hidden'); clearTimer();
    if(powerNoteEl) powerNoteEl.classList.add('hidden');
    if(stormNoteEl) stormNoteEl.classList.add('hidden');
    if(helpsWrap) helpsWrap.innerHTML='';
    return;
  }

  if(state.gameState === 'lobby'){
    // Staged but not opened: everyone reads the question first, with no options and no
    // clock, until the host opens the answers. During the 10s weather card, the card
    // above is the whole message and the question stays hidden.
    const staged = state.currentQuestionIndex!==null && state.currentQuestionIndex!==undefined
                   && QUESTIONS_BY_ID[state.currentQuestionIndex] && questionPreviewReady();
    if(staged){
      eyebrow.textContent = roundLabel(state.currentQ);
      qText.textContent = QUESTIONS_BY_ID[state.currentQuestionIndex].q;
      optsEl.innerHTML = `<div class="p-await">${t('p.awaitAnswers')}</div>`;
    } else {
      const waiting = !!state.legAnnouncedAt;
      eyebrow.textContent = waiting ? roundLabel(state.currentQ) : t('p.waitStart');
      qText.textContent = wxAnnounceActive()
        ? t('p.readWarning')
        : (waiting ? t('p.waitNext') : t('p.waitStartMsg'));
      optsEl.innerHTML = '';
    }
    bannerEl.classList.add('hidden'); clearTimer();
    if(powerNoteEl) powerNoteEl.classList.add('hidden');
    if(stormNoteEl) stormNoteEl.classList.add('hidden');
    if(helpsWrap) helpsWrap.innerHTML='';
    return;
  }
  if(state.currentQuestionIndex===null || state.currentQuestionIndex===undefined){
    eyebrow.textContent = roundLabel(state.currentQ);
    qText.textContent = t('p.waitOpen');
    optsEl.innerHTML=''; bannerEl.classList.add('hidden'); clearTimer();
    if(powerNoteEl) powerNoteEl.classList.add('hidden');
    if(stormNoteEl) stormNoteEl.classList.add('hidden');
    if(helpsWrap) helpsWrap.innerHTML='';
    return;
  }
  const qData = QUESTIONS_BY_ID[state.currentQuestionIndex];
  const powerNow = !!state.powerQuestionActive;
  const stormNow = isStormLeg(state.currentQ);
  eyebrow.innerHTML = roundLabel(state.currentQ) + (powerNow ? ' &nbsp;☀️ '+t('wx.powerTag')+'' : '') + (stormNow ? ' &nbsp;⛈ '+t('wx.stormTag') : '');
  qText.textContent = qData.q;
  if(powerNoteEl) powerNoteEl.classList.toggle('hidden', !powerNow);
  if(stormNoteEl) stormNoteEl.classList.toggle('hidden', !stormNow);

  const myAns = me.answers[state.currentQ];
  const revealed = state.gameState==='reveal';
  // Once the player's own countdown hits 0, no more picks or submits — an unsubmitted
  // answer already scores the same as a wrong one in every leg type (see adminRevealAnswer).
  const timeUp = myTimeUp();
  const struckOut = eliminatedOptions();
  optsEl.innerHTML = '';
  qData.opts.forEach((opt,i)=>{
    const gone = !!(struckOut && struckOut.includes(i));
    const b = document.createElement('button');
    let cls = 'opt-btn';
    if(revealed){
      if(state.currentCorrectIndex!==null && state.currentCorrectIndex!==undefined && i===state.currentCorrectIndex) cls+=' correct';
      else if(myAns && myAns.choice===i) cls+=' wrong';
    } else if(myAns && myAns.choice===i){
      cls+=' picked';
    }
    if(gone && !revealed) cls+=' eliminated';
    b.className = cls;
    const locked = state.gameState!=='question' || (myAns && myAns.submitted) || timeUp || (gone && !revealed);
    b.disabled = locked;
    b.innerHTML = `<span class="k">${String.fromCharCode(65+i)}</span><span>${opt}</span>`;
    b.onclick = ()=> playerSubmitAnswer(i);
    optsEl.appendChild(b);
  });

  paintCountdowns(); // shared clock painter — see paintCountdowns()

  renderHelps(me, myAns);

  // banner + submit button
  bannerEl.classList.remove('hidden','wait','locked','correct','wrong');
  if(state.gameState==='question'){
    if(myAns && myAns.submitted){
      bannerEl.classList.add('locked');
      bannerEl.innerHTML = t('p.locked') + (myAns.turbo?t('p.lockedTurbo'):'') + (myAns.seatbelt?t('p.lockedBelt'):'') + t('p.lockedWait');
    } else if(timeUp){
      bannerEl.classList.add('locked');
      // a pick that was never submitted is locked in automatically at reveal, so say so
      bannerEl.innerHTML = (myAns && myAns.choice!==null && myAns.choice!==undefined)
        ? t('p.timeUpAuto')
        : t('p.timeUpNone');
    } else if(myAns && myAns.choice!==null && myAns.choice!==undefined){
      bannerEl.classList.add('wait');
      bannerEl.innerHTML = `<button class="btn btn-primary btn-block" onclick="playerConfirmSubmit()">Submit answer →</button>
        <div style="font-size:11px; color:rgba(255,255,255,.55); margin-top:7px;">Submit now to bank a faster time — if you don't, this answer locks in when the clock runs out.</div>`;
    } else {
      bannerEl.classList.add('wait');
      bannerEl.innerHTML = t('p.selectAnswer');
    }
  } else if(state.gameState==='locked'){
    bannerEl.classList.add('locked');
    bannerEl.innerHTML = t('p.answersLocked');
  } else if(revealed){
    const correct = myAns && myAns.choice===state.currentCorrectIndex;
    const turbulent = isTurbulenceLeg(state.currentQ);
    let msg;
    if(turbulent){
      if(correct) msg = t('p.rv.turbOk');
      else if(myAns && myAns.seatbelt) msg = t('p.rv.turbBelt');
      else msg = t('p.rv.turbBad');
    } else if(isStormLeg(state.currentQ)){
      const cleared = !!(state.stormClearedIds && state.stormClearedIds.includes(myPlayerId));
      msg = cleared ? t('p.rv.stormOk') : (correct ? t('p.rv.stormSlow') : t('p.rv.stormBad'));
    } else if(state.powerQuestionActive){
      msg = correct ? t('p.rv.powerOk') : t('p.rv.powerBad');
    } else if(myAns && myAns.turbo){
      msg = correct ? t('p.rv.turboOk') : t('p.rv.turboBad');
    } else {
      msg = correct ? t('p.rv.ok') : (myAns ? t('p.rv.bad') : t('p.rv.none'));
    }
    bannerEl.classList.add(correct ? 'correct':'wrong');
    bannerEl.innerHTML = msg;
  }
}

buildRouteSvg();
// which leg's checkpoint the mouse is currently over on the presenter map — filters the
// live leaderboard down to just the players parked there until the mouse moves away
let presHoveredLeg = null;

// bucket) and reused across renders, so the CSS left/top transition on .plane-token can
// actually animate a glide to the new spot on reveal — a token that never changes its
// key keeps its element, so an unmoved aircraft has nothing to transition and stays put.
// Stylised gradient + floating watermark per stop, keyed to whoever currently leads —

  SPC:    {cls:'scene-spc',   icon:'⭐'},
  LHR:    {cls:'scene-lhr',   icon:'🎡'},
  MXP:    {cls:'scene-mxp',   icon:'⛪'},
  CPH:    {cls:'scene-cph',   icon:'🧜‍♀️'},
  SGN:    {cls:'scene-sgn',   icon:'🛵'},
  FRA:    {cls:'scene-fra',   icon:'🏦'},
  FINISH: {cls:'scene-finish',icon:'🏁'},
};
const ALL_SCENE_CLASSES = Object.values(LOCATION_THEMES).map(t=>t.cls).filter(Boolean);
let lastLeaderLocationCode = null;
function updateLocationScene(){
  const mapPanel = document.getElementById('mapPanel');

  if(!mapPanel || !watermark) return;

// Finish-moment cinematic: fires once, the instant the race is decided (3rd finisher
// lands) — zooms the map into FINISH, gives the top-3 tokens a landing swoop, and cheers.
let finishFlourishIds = new Set();
let finishCinematicPlayed = false;
function triggerFinishCinematic(){
  const finishers = Object.values(state.players).filter(p=>p.finishRank && p.finishRank<=FINISHERS_TO_END)
    .sort((a,b)=>a.finishRank-b.finishRank);
  finishFlourishIds = new Set(finishers.map(p=>p.id));
  const zoomWrap = document.getElementById('mapZoomWrap');
  const finishNode = ROUTE[ROUTE.length-1];
  if(zoomWrap){
    zoomWrap.style.transformOrigin = (finishNode.x/1000*100)+'% '+(finishNode.y/560*100)+'%';
    zoomWrap.style.transform = 'scale(2.1)';
  }
  playApplause(2800);
  renderPresenterPlanes(); // apply the landing flourish now, don't wait for the 1s tick
  setTimeout(()=>{
    finishFlourishIds = new Set();
    if(zoomWrap) zoomWrap.style.transform = 'scale(1)';
    renderPresenterPlanes();
  }, 7000);
}

const presenterPlaneEls = {};
let lastLeaderId = null;              // who was #1 as of the previous render, to detect a change
let cinematicOvertakeId = null;       // player id growing during the New Leader cinematic
let cinematicFallenId = null;         // player id shrinking during the New Leader cinematic
let leaderCinematicUntil = 0;         // Date.now() timestamp the transient classes above expire

function triggerLeaderChangeCinematic(oldId, newId){
  cinematicOvertakeId = newId;
  cinematicFallenId = oldId;
  leaderCinematicUntil = Date.now() + 2200;
  playApplause(1800);
  const p = state.players[newId];
  showNewLeaderBanner(p ? p.name : '');
}
function showNewLeaderBanner(name){
  const presenterEl = document.getElementById('view-presenter');
  let el = document.getElementById('newLeaderBanner');
  if(!el){
    el = document.createElement('div');
    el.id = 'newLeaderBanner';
    el.className = 'new-leader-banner';
    presenterEl.appendChild(el);
  }
  el.innerHTML = `<div class="tag">${t('pres.newLeader')}</div><div class="who">${escapeHtml(name)}</div>`;
  // reflow so re-adding "show" retriggers the transition even if a banner is already up
  el.classList.remove('show'); void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(()=>{ el.classList.remove('show'); }, 3000);
}

/* While the presenter is holding the correct answer on screen, the aircraft must stay
   where they were — they only start gliding once that card clears. Scoring itself already
   happened, so the pre-reveal positions are read back out of the undo snapshot (which
   adminRevealAnswer writes for exactly this leg before it moves anybody). */
function haveSnapshotForThisLeg(){
  return !!state.undoSnapshot && state.undoSnapshot.leg === state.currentQ && !!state.undoSnapshot.players;
}
function planesFrozen(){
  return state.gameState==='reveal'
    && !!state.revealAt && (Date.now() - state.revealAt) < ANSWER_CARD_MS
    && haveSnapshotForThisLeg();
}
/* The beat straight after the answer card, on the leg where the first aircraft landed:
   the map is zoomed into FINISH and only the champion is released, so the room watches
   one aircraft come in to land. Everyone else is held for another FIRST_FINISH_SOLO_MS. */
function firstFinishSolo(){
  if(!state.firstFinishAt || !state.firstFinishId) return false;
  const t = Date.now() - state.firstFinishAt;
  return t >= ANSWER_CARD_MS && t < (ANSWER_CARD_MS + FIRST_FINISH_SOLO_MS) && haveSnapshotForThisLeg();
}
function snapshotPosition(p){
  const before = state.undoSnapshot.players[p.id];
  return before ? before.position : p.position;
}
function displayPosition(p){
  if(planesFrozen()) return snapshotPosition(p);
  if(firstFinishSolo() && p.id !== state.firstFinishId) return snapshotPosition(p);
  return p.position;
}

/* Drives the map zoom for the solo landing. Kept separate from triggerFinishCinematic()
   (which fires at the END of the race, when the 4th aircraft lands) — this one is the
   FIRST landing, and it has to zoom in and back out on its own timer. */
let _soloZoomOn = false;
function updateFirstFinishZoom(){
  const zoomWrap = document.getElementById('mapZoomWrap');
  if(!zoomWrap) return;
  const want = firstFinishSolo();
  if(want === _soloZoomOn) return;
  _soloZoomOn = want;
  if(want){
    const finishNode = ROUTE[ROUTE.length-1];
    zoomWrap.style.transformOrigin = (finishNode.x/1000*100)+'% '+(finishNode.y/560*100)+'%';
    zoomWrap.style.transform = 'scale(1.9)';
    playApplause(2200);
  } else if(state.gameState!=='finished'){
    // the end-of-race cinematic owns the zoom once the race is decided; don't fight it
    zoomWrap.style.transform = 'scale(1)';
  }
}

function renderPresenterPlanes(){
  const layer = document.getElementById('planeLayer');
  const ranked = rankedPlayers();
  const leaderId = ranked.length ? ranked[0].id : null;
  updateFirstFinishZoom();
  // A change of #1 (once there was already a leader, and the race isn't already decided)
  // gets the slow overtake animation + "New Leader" banner + applause.
  if(lastLeaderId!==null && leaderId!==null && leaderId!==lastLeaderId && state.gameState!=='finished'){
    triggerLeaderChangeCinematic(lastLeaderId, leaderId);
  }
  lastLeaderId = leaderId;
  if(leaderCinematicUntil && Date.now() > leaderCinematicUntil){
    cinematicOvertakeId = null; cinematicFallenId = null; leaderCinematicUntil = 0;
  }
  const top5Ids = new Set(ranked.slice(0,5).map(p=>p.id));
  const byPos = {};
  Object.values(state.players).forEach(p=>{
    const pos = displayPosition(p);
    byPos[pos] = byPos[pos] || [];
    byPos[pos].push(p);
  });
  const seenKeys = new Set();
  function tokenFor(key){
    let tok = presenterPlaneEls[key];
    if(!tok){
      tok = document.createElement('div');
      tok.className = 'plane-token';
      layer.appendChild(tok);
      presenterPlaneEls[key] = tok;
    }
    seenKeys.add(key);
    return tok;
  }
  Object.entries(byPos).forEach(([pos, plist])=>{
    const node = ROUTE[+pos];
    const topHere = plist.filter(p=>top5Ids.has(p.id));
    const othersHere = plist.filter(p=>!top5Ids.has(p.id));
    let stackIdx = 0;
    topHere.forEach(p=>{
      const onFire = (p.currentStreak||0) >= 5;
      const tok = tokenFor('p-'+p.id);
      tok.className = 'plane-token'
        + (p.id===leaderId ? ' leader' : '')
        + (onFire ? ' on-fire' : '')
        + (p.id===cinematicOvertakeId ? ' overtaking' : '')
        + (p.id===cinematicFallenId ? ' falling-behind' : '')
        + (finishFlourishIds.has(p.id) ? ' landing-flourish' : '');
      tok.style.left = (node.x/1000*100)+'%';
      tok.style.top = ((node.y/560*100) - stackIdx*4.2)+'%';
      tok.innerHTML = `<div class="stack"><div class="icon">${avatarHTML(p.avatar,'1em','#FFFFFF')}</div><div class="pname">${escapeHtml(p.name)}</div></div><div class="flame-trail">🔥</div>`;
      stackIdx++;
    });
    if(othersHere.length>0){
      const tok = tokenFor('agg-'+pos);
      tok.style.left = (node.x/1000*100)+'%';
      tok.style.top = ((node.y/560*100) - stackIdx*4.2)+'%';
      tok.innerHTML = `<div class="stack"><div class="icon">${planeSvg('#FFFFFF')}</div><div class="pname">+${othersHere.length}</div></div>`;
    }
  });
  // drop tokens for players who left the top 5 or position buckets that emptied out
  Object.keys(presenterPlaneEls).forEach(key=>{
    if(!seenKeys.has(key)){ presenterPlaneEls[key].remove(); delete presenterPlaneEls[key]; }
  });
}

// Rows are kept and reused (keyed by player id) instead of rebuilt from scratch, so a
// rank swap can FLIP-animate: the row's DOM position moves instantly, then a translateY
// inverts it back to where it visually was and releases into the CSS transition on
// .lead-row (transform .3s ease), producing a smooth slide into its new spot.
const presenterLeaderRowEls = {};
function renderPresenterLeaderboard(){
  const el = document.getElementById('presLeaderboard');
  const titleEl = document.getElementById('presLeaderboardTitle');
  if(presHoveredLeg!==null){
    const node = ROUTE[presHoveredLeg];
    const here = Object.values(state.players).filter(p=>p.position===presHoveredLeg)
      .sort((a,b)=>(a.totalAnswerTime||0)-(b.totalAnswerTime||0));
    if(titleEl) titleEl.textContent = `📍 ${node.code} · ${node.city}`;
    el.innerHTML = here.length===0
      ? `<p style="color:rgba(255,255,255,.5); font-size:13px;">${t('pres.noneHere')}</p>`
      : here.map(p=>`
        <div class="lead-row">
          <div class="av">${avatarHTML(p.avatar,'1em','#FFFFFF')}</div>
          <div class="nm">${escapeHtml(p.name)}${milestoneDotsFor(p.id)}<div style="font-size:10.5px; color:rgba(255,255,255,.5); font-weight:400;">⏱ ${formatTime(p.totalAnswerTime)}</div></div>
        </div>
      `).join('');
    return; // the hover view wipes the DOM, so the row cache below is rebuilt fresh next time
  }
  if(titleEl) titleEl.textContent = t('pres.leaderboard');
  const ranked = rankedPlayers();
  if(ranked.length===0){
    el.innerHTML = `<p style="color:rgba(255,255,255,.5); font-size:13px;">${t('pres.noPlayers')}</p>`;
    Object.keys(presenterLeaderRowEls).forEach(k=>delete presenterLeaderRowEls[k]);
    return;
  }
  const totalLegs = ROUTE.length - 1;
  // The leaderboard lists EVERY player (the panel scrolls). The route map is unaffected —
  // it still draws named tokens for the top 5 and a "+N" pile for everyone else.
  if(titleEl) titleEl.textContent = t('pres.leaderboardN',{n:ranked.length});

  // Drop anything in the panel that isn't one of our tracked rows — e.g. the "No players
  // yet" placeholder left over from the empty state above, the first time players join.
  const trackedEls = new Set(Object.values(presenterLeaderRowEls));
  [...el.children].forEach(child=>{ if(!trackedEls.has(child)) child.remove(); });

  // FLIP step 1 ("First"): note where every currently-attached row sits before reordering.
  const firstTop = {};
  Object.keys(presenterLeaderRowEls).forEach(key=>{
    const row = presenterLeaderRowEls[key];
    if(row.isConnected) firstTop[key] = row.getBoundingClientRect().top;
  });

  const seenKeys = new Set();
  ranked.forEach((p,i)=>{
    const key = 'p-'+p.id;
    seenKeys.add(key);
    let row = presenterLeaderRowEls[key];
    if(!row){ row = document.createElement('div'); presenterLeaderRowEls[key] = row; }
    const onFire = (p.currentStreak||0) >= 5;
    const accuracy = p.answeredCount ? Math.round((p.correctCount||0)/p.answeredCount*100) : 0;
    row.className = 'lead-row' + (i===0?' top1':'');
    row.innerHTML = `
      <div class="rank">${i<4?RANK_TROPHY[i]:('#'+(i+1))}</div>
      <div class="av">${avatarHTML(p.avatar,'1em','#FFFFFF')}</div>
      <div class="nm">${onFire?'<span class="fire-tag">🔥</span> ':''}${escapeHtml(p.name)}${milestoneDotsFor(p.id)}
        <div class="sub">${ROUTE[p.position].code} · ${ROUTE[p.position].city} · ⏱ ${formatTime(p.totalAnswerTime)}</div>
        <div class="stats">🎯 ${accuracy}% accuracy · 🏆 best streak ${p.longestStreak||0}</div>
      </div>
      <div class="st">${p.position}/${totalLegs}</div>
    `;
    el.appendChild(row); // "Last": (re)places it in rank order — existing nodes just move
  });
  // rows for players who left the race (removed by the admin) get dropped
  Object.keys(presenterLeaderRowEls).forEach(key=>{
    if(!seenKeys.has(key)){ presenterLeaderRowEls[key].remove(); delete presenterLeaderRowEls[key]; }
  });

  // FLIP steps 2-3 ("Invert" + "Play"): snap each moved row back to its old spot with no
  // transition, then release the inline overrides so the CSS transition slides it home.
  seenKeys.forEach(key=>{
    const row = presenterLeaderRowEls[key];
    const first = firstTop[key];
    if(first===undefined) return; // brand-new row — nothing to animate from
    const delta = first - row.getBoundingClientRect().top;
    if(Math.abs(delta) < 1) return;
    row.style.transition = 'none';
    row.style.transform = `translateY(${delta}px)`;
    row.getBoundingClientRect(); // force a reflow so the snapped position takes effect first
    row.style.transition = '';
    row.style.transform = '';
  });
}

/* The cabin bulletin under the leaderboard: a post-question debrief written the way an
   in-flight announcement reads. Everything here describes the LAST SCORED leg, so it holds
   its numbers on screen while the host talks over the next question being staged. */
function lastScoredLeg(){
  const legs = Object.keys(state.revealedLegs||{}).filter(k=>state.revealedLegs[k]).map(Number);
  return legs.length ? Math.max.apply(null, legs) : null;
}
/* Only the admin can read rooms/{ROOM}/answers, so the presenter has no way to work out
   who was quickest or how many got it right. The admin boils the leg down to these few
   numbers at reveal and publishes them in the admin slice, which everyone can read. */
function buildLegBrief(leg, correctIdx){
  const players = Object.values(state.players);
  const submitted = players.map(p=>({p, a:p.answers[leg]})).filter(x=>x.a && x.a.submitted);
  const correct = submitted.filter(x=>x.a.choice===correctIdx);
  const fastest = correct.slice().sort((a,b)=>(a.a.timeTaken||Infinity)-(b.a.timeTaken||Infinity))[0];
  const times = submitted.map(x=>x.a.timeTaken).filter(v=>typeof v==='number');
  return {
    leg,
    total: players.length,
    correctCount: correct.length,
    fastestName: fastest ? fastest.p.name : null,
    fastestTime: fastest && typeof fastest.a.timeTaken==='number' ? fastest.a.timeTaken : null,
    avgTime: times.length ? Math.round(times.reduce((s,v)=>s+v,0)/times.length) : null,
  };
}
function renderPresenterBrief(){
  const legEl = document.getElementById('briefLeg');
  const body = document.getElementById('briefBody');
  if(!body) return;
  const players = Object.values(state.players);
  const leg = lastScoredLeg();
  const brief = (state.legBrief && state.legBrief.leg===leg) ? state.legBrief : null;

  if(leg===null || !brief || players.length===0){
    if(legEl) legEl.textContent = '—';
    body.innerHTML = `<div class="brief-empty brief-item wide">${t('brief.standby')}</div>`;
    return;
  }
  if(legEl) legEl.textContent = legLabel(leg).toUpperCase();

  // everyone who didn't answer counts against the rate — sitting it out is not a pass
  const total = brief.total || players.length;
  const rate = total ? Math.round(brief.correctCount/total*100) : 0;

  const leader = rankedPlayers()[0];
  // busiest stop on the board right now
  const tally = {};
  players.forEach(p=>{ tally[p.position] = (tally[p.position]||0)+1; });
  let busyPos = null, busyN = 0;
  Object.keys(tally).forEach(k=>{ if(tally[k] > busyN){ busyN = tally[k]; busyPos = +k; } });

  // pace, read off how long the room took to answer this one
  const avg = (typeof brief.avgTime==='number') ? brief.avgTime : null;
  let pace, paceCls, paceIcon;
  if(avg===null){ pace=t('brief.paceNone'); paceCls=''; paceIcon='📉'; }
  else if(avg < 7000){ pace=t('brief.paceFast'); paceCls='pace-fast'; paceIcon='🚀'; }
  else if(avg < 14000){ pace=t('brief.paceSteady'); paceCls='pace-med'; paceIcon='🧭'; }
  else { pace=t('brief.paceSlow'); paceCls='pace-slow'; paceIcon='🐢'; }

  const fastestHtml = brief.fastestName
    ? `🥇 ${escapeHtml(brief.fastestName)} <span class="sub">${formatTime(brief.fastestTime)}</span>`
    : ('<span class="sub">'+t('brief.noneCorrect')+'</span>');

  const item = (icon, label, value, wide)=>
    `<div class="brief-item${wide?' wide':''}"><span class="bi">${icon}</span><div><div class="bl">${label}</div><div class="bv">${value}</div></div></div>`;

  body.innerHTML =
    item('⚡',t('brief.fastest'), fastestHtml, true) +
    item('✅',t('brief.correct'), `${brief.correctCount} <span class="sub">${t('brief.ofN',{n:total})}</span>`) +
    item('📊',t('brief.rate'), `${rate}%`) +
    item('👑',t('brief.leaderAt'), leader ? `${ROUTE[leader.position].code} <span class="sub">${escapeHtml(ROUTE[leader.position].city)}</span>` : '—') +
    item('🛬',t('brief.busiest'), busyPos!==null ? `${ROUTE[busyPos].code} <span class="sub">${t('brief.aircraftN',{n:busyN})}</span>` : '—') +
    item(paceIcon,t('brief.pace'), `<span class="${paceCls}">${pace}</span>${avg!==null?` <span class="sub">${t('brief.avg',{t:formatTime(avg)})}</span>`:''}`, true);
}

function rankedPlayers(){
  // Anyone who has actually landed (finishRank set) outranks everyone still racing,
  // ordered by true arrival sequence — not just by who happens to share the FINISH tile.
  return Object.values(state.players).slice().sort((a,b)=>{
    if(a.finishRank && b.finishRank) return a.finishRank - b.finishRank;
    if(a.finishRank) return -1;
    if(b.finishRank) return 1;
    return b.position - a.position || (a.totalAnswerTime||0) - (b.totalAnswerTime||0);
  });
}
const RANK_TROPHY = ['🏆','🥇','🥈','🥉']; // champion's cup, then gold-silver-bronze for 2nd-4th
function formatTime(ms){
  ms = ms || 0;
  return (ms/1000).toFixed(1)+'s';
}
function ordinal(n){
  // Vietnamese has no ordinal suffix — the surrounding string already says "Hạng"/"thứ"
  if(LANG === 'vi') return String(n);
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}
function milestoneDotsFor(playerId){
  let dots = '';
  ['HAN','SPC','SGN'].forEach(code=>{
    if(state.milestones && state.milestones[code]===playerId){
      dots += ` <span title="First to reach ${code}" style="color:var(--vna-gold-light);">●</span>`;
    }
  });
  return dots;
}

/* Fullscreen for the LED wall. Safari still only has the webkit-prefixed API, and the
   request rejects unless it's inside a user gesture — which is why this is wired to the
   button rather than called automatically when the presenter view opens. */
function togglePresenterFullscreen(){
  const el = document.documentElement;
  const isFull = document.fullscreenElement || document.webkitFullscreenElement;
  if(isFull){
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    return;
  }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(!req){ toast(t('pres.fsUnsupported')); return; }
  Promise.resolve(req.call(el)).catch(()=>toast(t('pres.fsBlocked')));
}
function syncFullscreenBtn(){
  const btn = document.getElementById('presFullscreenBtn');
  if(!btn) return;
  const isFull = document.fullscreenElement || document.webkitFullscreenElement;
  btn.textContent = isFull ? t('pres.exitFullscreen') : t('pres.fullscreen');
}
document.addEventListener('fullscreenchange', syncFullscreenBtn);
document.addEventListener('webkitfullscreenchange', syncFullscreenBtn);

function fireConfettiLight(){
  if(typeof confetti !== 'function') return;
  confetti({particleCount:60, spread:100, origin:{y:0.3}, colors:['#D4AF37','#F0D678','#005BAC','#ffffff'], scalar:0.9});
}
function fireConfetti(){
  if(typeof confetti !== 'function') return;
  const duration = 3000;
  const end = Date.now()+duration;
  (function frame(){
    confetti({particleCount:5, angle:60, spread:70, origin:{x:0}, colors:['#D4AF37','#F0D678','#005BAC','#ffffff']});
    confetti({particleCount:5, angle:120, spread:70, origin:{x:1}, colors:['#D4AF37','#F0D678','#005BAC','#ffffff']});
    if(Date.now()<end) requestAnimationFrame(frame);
  })();
}

// Synthesized crowd applause — the app has no bundled audio asset (keeping it fully
// offline-capable, see README), so a burst of short filtered-noise "claps" stands in
// for a real recording. Swap in a <audio> element instead if a real sample is preferred.
let _audioCtx = null;
function getAudioCtx(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!_audioCtx) _audioCtx = new AC();
  if(_audioCtx.state==='suspended') _audioCtx.resume().catch(()=>{});
  return _audioCtx;
}
function playApplause(durationMs){
  const ctx = getAudioCtx();
  if(!ctx) return;
  durationMs = durationMs || 1600;
  const now = ctx.currentTime;
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.0001, now);
  master.gain.linearRampToValueAtTime(0.32, now+0.08);
  master.gain.linearRampToValueAtTime(0.0001, now + durationMs/1000);
  master.connect(ctx.destination);

  const clapCount = Math.round(durationMs/38);
  for(let i=0;i<clapCount;i++){
    const t = now + (i/clapCount) * (durationMs/1000) * (0.85 + Math.random()*0.3);
    const bufLen = Math.max(1, Math.floor(ctx.sampleRate*0.03));
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let j=0;j<bufLen;j++) data[j] = (Math.random()*2-1) * Math.pow(1-j/bufLen, 2);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1800 + Math.random()*2400;
    filter.Q.value = 0.7;
    const g = ctx.createGain();
    g.gain.value = 0.5 + Math.random()*0.5;
    src.connect(filter).connect(g).connect(master);
    src.start(t);
  }
}
