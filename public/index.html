<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vietnam Airlines Sky Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Be Vietnam Pro carries the full Vietnamese character set; Sora does not (Google Fonts
     ships it with latin + latin-ext only), so Vietnamese diacritics fell back per-character
     to a system face and headings/questions rendered visibly uneven. See html[lang=vi] below. -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>

<!-- ============================================================
     FIREBASE — Realtime Database + Auth. Loaded straight from Google's CDN
     (same as canvas-confetti above) — no build step needed, works as-is on
     Vercel's static hosting. If there's ever no internet at the venue, these
     three <script> tags simply fail to load and the app detects that,
     falling back to OFFLINE mode (one device only).
     ============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCYPjEOpCIYH7xZzoP0hsS0ZouPwqLb9F4",
  authDomain: "vietnam-airlines-sky-race.firebaseapp.com",
  databaseURL: "https://vietnam-airlines-sky-race-default-rtdb.firebaseio.com",
  projectId: "vietnam-airlines-sky-race",
  storageBucket: "vietnam-airlines-sky-race.firebasestorage.app",
  messagingSenderId: "483140542955",
  appId: "1:483140542955:web:10e28cc4897dba7a11b9ae",
  measurementId: "G-DFVTV72W35"
};
// The one admin account, created by hand in Firebase console -> Authentication -> Users.
// Its password is never stored in this file — the admin types it at the gate.
const ADMIN_EMAIL = "admin@vna-sky-race.local";
</script>
<style>
:root{
  --vna-blue:#005BAC;
  --vna-blue-deep:#00305A;
  --vna-blue-mid:#0B71C7;
  --vna-gold:#D4AF37;
  --vna-gold-light:#F0D678;
  --sky-1:#003A6B;
  --sky-2:#0B5FA0;
  --sky-3:#4FA8E0;
  --glass:rgba(255,255,255,.10);
  --glass-brd:rgba(255,255,255,.22);
  --ink:#0A2540;
  --good:#2ECC71;
  --bad:#E15252;
  --font-display:'Sora',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
/* Vietnamese swaps the display face to Be Vietnam Pro. Sora ships without the Vietnamese
   subset, so every ế ộ ữ ằ in a heading or a presenter question fell through to whatever
   system font the device happened to pick — the letters sat at different weights and
   widths inside the same word. Be Vietnam Pro covers the whole set in one face. */
html[lang="vi"]{
  --font-display:'Be Vietnam Pro','Inter',sans-serif;
  --font-body:'Be Vietnam Pro','Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  color:#fff;
  background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 55%,var(--sky-3) 100%);
  min-height:100vh;
  overflow-x:hidden;
  overscroll-behavior-y:none;
  position:relative;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.display{font-family:var(--font-display);}
.mono{font-family:var(--font-mono); letter-spacing:.04em;}

/* ambient clouds */
.cloud-field{position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;}
.cloud{position:absolute; opacity:.35; filter:blur(1px); animation:drift linear infinite;}
.cloud svg{display:block;}
@keyframes drift{ from{transform:translateX(-15vw);} to{transform:translateX(115vw);} }
.glow-orb{position:fixed; border-radius:50%; filter:blur(60px); opacity:.35; z-index:0; pointer-events:none;}

.glass{
  background:var(--glass);
  border:1px solid var(--glass-brd);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 8px 32px rgba(0,20,50,.35);
}
.app{position:relative; z-index:1; min-height:100vh;}
.hidden{display:none !important;}

/* ---------- Landing / role select ---------- */
.landing{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px; text-align:center;}
.brand-mark{display:flex; align-items:center; gap:10px; margin-bottom:28px;}
.brand-mark .plane{font-size:26px;}
.brand-mark span{font-family:var(--font-display); font-weight:700; letter-spacing:.06em; font-size:14px; text-transform:uppercase; color:var(--vna-gold-light);}
.brand-logo{height:30px; width:auto; display:block; image-rendering:-webkit-optimize-contrast;}
.landing h1{font-size:clamp(32px,6vw,56px); font-weight:800; margin:0 0 10px; line-height:1.05;}
.landing .gold{color:var(--vna-gold);}
.landing p.sub{color:rgba(255,255,255,.75); max-width:520px; margin:0 0 40px; font-size:16px;}
.role-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; max-width:900px; width:100%;}
@media (max-width:760px){.role-grid{grid-template-columns:1fr;}}
.role-card{
  border-radius:20px; padding:28px 22px; cursor:pointer; text-align:left;
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}
.role-card:hover{transform:translateY(-4px); border-color:var(--vna-gold); box-shadow:0 16px 40px rgba(0,20,50,.5);}
.role-card .icon{font-size:30px; margin-bottom:14px; display:block;}
.role-card h3{margin:0 0 6px; font-size:19px; font-weight:700;}
.role-card p{margin:0; font-size:13.5px; color:rgba(255,255,255,.65); line-height:1.5;}
.role-card .go{margin-top:16px; font-size:12.5px; color:var(--vna-gold-light); font-weight:600; letter-spacing:.03em;}

/* ---------- VI / EN switch ---------- */
.lang-switch{
  position:fixed; top:calc(16px + env(safe-area-inset-top)); right:calc(16px + env(safe-area-inset-right)); z-index:120;
  display:flex; gap:2px; padding:3px; border-radius:20px;
  background:rgba(0,20,45,.55); border:1px solid var(--glass-brd); backdrop-filter:blur(8px);
}
.lang-switch.inline{position:static; display:inline-flex; backdrop-filter:none;}
.lang-opt{
  border:none; background:transparent; color:rgba(255,255,255,.6); cursor:pointer; padding:5px 12px;
  border-radius:16px; font-family:var(--font-mono); font-weight:700; font-size:11.5px; letter-spacing:.06em;
  transition:all .15s ease; touch-action:manipulation;
}
.lang-opt:hover{color:#fff;}
.lang-opt.on{background:var(--vna-gold); color:#261a00;}
/* the floating one belongs to the landing screen only — every other view has its own inline
   copy, placed where it can't collide with the Exit button or the state badge.
   NB: not a `body > ...` selector — the switch lives inside .app, not directly under body. */
body:not(.on-landing) .lang-switch:not(.inline){display:none;}
.reg-head{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.reg-head h2{margin:0;}

.rules-help-btn{
  position:fixed; left:calc(18px + env(safe-area-inset-left)); bottom:calc(18px + env(safe-area-inset-bottom)); z-index:60;
  border:1px solid var(--glass-brd); color:#fff; font-family:var(--font-body); font-weight:600; font-size:12.5px;
  padding:9px 15px; border-radius:20px; cursor:pointer; touch-action:manipulation;
}
.rules-help-btn:hover{border-color:var(--vna-gold);}
.rules-modal-card{border-radius:22px; padding:26px; max-width:560px; width:100%; max-height:85vh; overflow-y:auto;}
.rules-section{margin-bottom:18px;}
.rules-section:last-child{margin-bottom:0;}
.rules-section h4{margin:0 0 8px; font-size:14px; color:var(--vna-gold-light); text-transform:uppercase; letter-spacing:.04em;}
.rules-section p{margin:0 0 8px; font-size:13.5px; line-height:1.55; color:rgba(255,255,255,.85);}
.rules-section p:last-child{margin-bottom:0;}

/* buttons */
.btn{
  font-family:var(--font-body); font-weight:600; border:none; cursor:pointer;
  border-radius:14px; padding:14px 22px; font-size:15px; transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  touch-action:manipulation;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--vna-gold-light),var(--vna-gold)); color:var(--vna-blue-deep); box-shadow:0 8px 24px rgba(212,175,55,.35);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-primary:disabled{opacity:.4; cursor:not-allowed; filter:none;}
.btn-ghost{background:var(--glass); border:1px solid var(--glass-brd); color:#fff;}
.btn-ghost:hover{border-color:rgba(255,255,255,.5);}
.btn-danger{background:rgba(225,82,82,.18); border:1px solid rgba(225,82,82,.5); color:#ffb3b3;}
.btn-sm{padding:9px 14px; font-size:13px; border-radius:10px;}
.btn-block{width:100%;}
.back-btn{position:fixed; top:calc(18px + env(safe-area-inset-top)); left:calc(18px + env(safe-area-inset-left)); z-index:50;}

input[type=text],select{
  font-family:var(--font-body); background:rgba(255,255,255,.08); border:1px solid var(--glass-brd);
  color:#fff; border-radius:12px; padding:13px 16px; font-size:16px; width:100%; outline:none;
}
input[type=text]::placeholder{color:rgba(255,255,255,.45);}
input[type=text]:focus{border-color:var(--vna-gold);}

/* ================= PLAYER ================= */
#view-player{
  max-width:460px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
  padding:calc(20px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
}
/* left padding keeps the brand clear of the fixed "← Exit" button, which floats over
   the top-left corner of every non-landing view */
.p-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding-left:76px;}
.p-header .brand-mark{margin:0;}
.p-badge{font-family:var(--font-mono); font-size:11px; background:var(--glass); border:1px solid var(--glass-brd); padding:6px 10px; border-radius:20px;}

.reg-card{border-radius:22px; padding:26px 22px; margin-top:10px;}
.reg-card h2{margin:0 0 4px; font-size:22px;}
.reg-card p.hint{color:rgba(255,255,255,.65); font-size:13.5px; margin:0 0 20px;}
.field-label{font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:rgba(255,255,255,.6); margin:18px 0 8px;}
.avatar-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.avatar-opt{
  border-radius:14px; padding:14px 6px; cursor:pointer;
  background:rgba(255,255,255,.06); border:1.5px solid var(--glass-brd); font-size:22px;
  transition:all .15s ease; touch-action:manipulation;
  display:flex; align-items:center; justify-content:center; min-height:58px;
}
.avatar-opt.selected{border-color:var(--vna-gold); background:rgba(212,175,55,.16); box-shadow:0 0 0 3px rgba(212,175,55,.18);}
.avatar-compose{display:inline-flex; align-items:center; justify-content:center; line-height:1;}
.avatar-compose .plane-ico{display:inline-block; flex-shrink:0;}
.avatar-compose .face-emoji{display:inline-block; line-height:1; transform:translateY(0.02em);}

/* horizontal route map across the top of the player's phone.
   overflow-x:auto makes the browser compute overflow-y to auto as well, so anything the
   lit stop paints outside the strip box gets clipped. Hence: no translateY lift, a soft
   glow instead of a solid ring, and vertical padding to give that glow somewhere to go. */
.route-strip{
  display:flex; align-items:flex-start; gap:1px; margin:14px 0 10px; padding:3px 0 2px;
  overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.route-strip::-webkit-scrollbar{display:none;}
.rs-stop{flex:1 0 auto; min-width:25px; display:flex; flex-direction:column; align-items:center; gap:2px; transition:opacity .3s ease;}
/* fixed-height slot centres every dot on one line, whatever size the dot is — the leg
   line then sits at 50% and stays aligned with the enlarged "here" dot too */
.rs-slot{position:relative; width:100%; height:36px; display:flex; align-items:center; justify-content:center;}
.rs-slot::before{content:''; position:absolute; top:50%; margin-top:-1px; right:50%; width:100%; height:2px; background:rgba(255,255,255,.18);}
.rs-stop:first-child .rs-slot::before{display:none;}
.rs-stop.done .rs-slot::before, .rs-stop.here .rs-slot::before{background:var(--vna-gold);}
.rs-dot{
  width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:11px; line-height:1; background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.25);
  position:relative; z-index:1; flex-shrink:0; transition:width .3s ease, height .3s ease, background .3s ease;
}
.rs-dot svg{width:1em; height:1em;}
.rs-code{font-family:var(--font-mono); font-size:7.5px; letter-spacing:-.02em; color:rgba(255,255,255,.55); white-space:nowrap;}
.rs-stop.cp .rs-dot{border-color:rgba(212,175,55,.55);}
.rs-stop.done{opacity:.55;}
.rs-stop.done .rs-dot{background:rgba(212,175,55,.3); border-color:rgba(212,175,55,.6);}
.rs-stop.ahead{opacity:.32;}
/* where the player's aircraft actually is — lit, enlarged and named. The wider min-width
   reserves room for the bigger dot so it never sits on top of its neighbours. */
.rs-stop.here{opacity:1; min-width:38px;}
.rs-stop.here .rs-dot{
  width:30px; height:30px; font-size:15px; background:var(--vna-gold); border-color:var(--vna-gold-light); color:#261a00;
  box-shadow:0 0 13px rgba(212,175,55,.85);
}
.rs-stop.here .rs-code{font-size:9px; font-weight:800; color:var(--vna-gold-light);}

.timer-ring-wrap{display:flex; justify-content:center; margin:10px 0 18px;}
.timer-num{font-family:var(--font-mono); font-weight:700; font-size:15px;}

.q-card{border-radius:22px; padding:22px; flex:1;}
.q-eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--vna-gold-light); font-weight:700; margin-bottom:10px;}
.q-text{font-size:19px; font-weight:700; line-height:1.4; margin:0 0 22px;}
.opt-btn{
  width:100%; text-align:left; padding:15px 16px; border-radius:14px; margin-bottom:10px;
  background:rgba(255,255,255,.06); border:1.5px solid var(--glass-brd); color:#fff; font-size:14.5px;
  cursor:pointer; display:flex; align-items:center; gap:12px; transition:all .15s ease; touch-action:manipulation;
}
.opt-btn .k{width:26px; height:26px; border-radius:8px; background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:12px; flex-shrink:0;}
.opt-btn:hover{border-color:rgba(255,255,255,.5);}
.opt-btn.picked{border-color:var(--vna-gold); background:rgba(212,175,55,.16);}
.opt-btn.correct{border-color:var(--good); background:rgba(46,204,113,.18);}
.opt-btn.wrong{border-color:var(--bad); background:rgba(225,82,82,.18);}
.opt-btn:disabled{cursor:default;}

.status-banner{border-radius:16px; padding:16px 18px; text-align:center; margin-top:14px;}
.status-banner.wait{background:rgba(255,255,255,.08);}
.status-banner.locked{background:rgba(212,175,55,.14); border:1px solid rgba(212,175,55,.4);}
.status-banner.correct{background:rgba(46,204,113,.16); border:1px solid rgba(46,204,113,.5);}
.status-banner.wrong{background:rgba(225,82,82,.14); border:1px solid rgba(225,82,82,.5);}
.power-note{margin:2px 0 16px; padding:10px 14px; border-radius:12px; text-align:center; font-size:12.5px;
  background:linear-gradient(135deg, rgba(255,196,0,.18), rgba(255,140,0,.12)); border:1px solid rgba(255,196,0,.45); color:#ffe6b0;}
.storm-note{margin:2px 0 16px; padding:10px 14px; border-radius:12px; text-align:center; font-size:12.5px;
  background:linear-gradient(135deg, rgba(90,140,255,.2), rgba(60,90,200,.14)); border:1px solid rgba(140,170,255,.5); color:#dbe4ff;}

.dest-strip{display:flex; align-items:center; justify-content:space-between; border-radius:16px; padding:14px 18px; margin-top:14px;}
.turbo-btn{font-size:13.5px;}
.turbo-note{text-align:center; font-size:12px; color:rgba(255,255,255,.5); padding:8px; background:rgba(255,255,255,.04); border-radius:10px;}
.dest-strip .lbl{font-size:11px; color:rgba(255,255,255,.55); text-transform:uppercase; letter-spacing:.05em;}
.dest-strip .val{font-family:var(--font-mono); font-weight:700; font-size:15px;}

/* ================= PRESENTER ================= */
#view-presenter{min-height:100vh; padding:22px 28px; display:flex; flex-direction:column; position:relative;}
.pres-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.pres-top h1{font-size:22px; margin:0; font-weight:700; display:flex; align-items:center; gap:12px;}
.pres-top h1 .brand-logo{height:50px;}
.pres-status-pill{font-family:var(--font-mono); font-size:12.5px; padding:8px 16px; border-radius:20px;}
.pres-body{display:grid; grid-template-columns:2.4fr 1fr; gap:22px; flex:1; min-height:0;}
/* min-height:0 lets the map take exactly the height the flex row gives it — a fixed
   640px floor pushed the whole presenter past the bottom of a 800px-tall screen */
.map-panel{border-radius:26px; padding:26px; position:relative; overflow:hidden; min-height:0;}
.map-panel.glass{backdrop-filter:none; -webkit-backdrop-filter:none;}
.route-svg{width:100%; height:100%; display:block;}
.leader-panel{border-radius:26px; padding:22px; display:flex; flex-direction:column;}
.leader-panel h3{margin:0 0 16px; font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:rgba(255,255,255,.6); flex-shrink:0;}
/* every player is listed, so the panel scrolls rather than stretching the page */
#presLeaderboard{flex:1; min-height:0; overflow-y:auto; padding-right:4px;}
.lead-row{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:14px; margin-bottom:8px; background:rgba(255,255,255,.05); transition:transform .3s ease;}
.lead-row .rank{font-family:var(--font-mono); font-weight:700; width:26px; color:rgba(255,255,255,.55); font-size:15px;}
.lead-row .av{font-size:19px;}
.lead-row .nm{flex:1; font-size:13.5px; font-weight:600;}
.lead-row .st{font-family:var(--font-mono); font-size:11px; color:var(--vna-gold-light);}
.lead-row.top1{background:linear-gradient(90deg,rgba(212,175,55,.22),rgba(255,255,255,.04)); border:1px solid rgba(212,175,55,.4);}
.lead-row .sub{font-size:10.5px; color:rgba(255,255,255,.5); font-weight:400;}
.lead-row .stats{font-size:10px; color:rgba(255,255,255,.42); font-weight:400; margin-top:1px;}
.lead-row .fire-tag{filter:drop-shadow(0 0 4px rgba(255,120,0,.8)); animation:fireWiggle .6s ease-in-out infinite alternate;}
@keyframes fireWiggle{ from{transform:scale(1) rotate(-6deg);} to{transform:scale(1.15) rotate(6deg);} }

.airport-node{position:absolute; transform:translate(-50%,-50%); cursor:pointer;}
.airport-dot{width:34px; height:34px; border-radius:50%; background:rgba(11,113,199,.85); border:2.5px solid #fff; box-shadow:0 0 0 4px rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; transition:transform .15s ease, box-shadow .15s ease;}
.airport-icon{font-size:17px; line-height:1;}
.airport-node.checkpoint .airport-dot{width:60px; height:60px; background:var(--vna-gold); border:4px solid var(--vna-gold-light); box-shadow:0 0 24px 7px rgba(212,175,55,.6);}
.airport-node.checkpoint .airport-icon{font-size:30px;}
.airport-node:hover .airport-dot{transform:scale(1.12); box-shadow:0 0 0 6px rgba(255,255,255,.28);}
.airport-node.checkpoint:hover .airport-dot{box-shadow:0 0 30px 10px rgba(212,175,55,.8);}
.airport-node.checkpoint .airport-label .code{font-size:15px; font-weight:800; color:var(--vna-gold-light);}
.airport-node.checkpoint .airport-label .city{font-size:10.5px; font-weight:600;}
.airport-label{position:absolute; top:40px; left:50%; transform:translateX(-50%); text-align:center; white-space:nowrap;}
.airport-node.checkpoint .airport-label{top:68px;}
.airport-label .code{font-family:var(--font-mono); font-weight:700; font-size:12.5px; color:#fff;}
.airport-label .city{font-size:9.5px; color:rgba(255,255,255,.6);}
.plane-token{position:absolute; transform:translate(-50%,-50%); transition:left 2.2s cubic-bezier(.45,.05,.15,1), top 2.2s cubic-bezier(.45,.05,.15,1); z-index:5;}
.plane-token .stack{display:flex; flex-direction:column; align-items:center; gap:2px;}
.plane-token .icon{font-size:18px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); animation:float 2.6s ease-in-out infinite;}
.plane-token.leader{z-index:6;}
.plane-token.leader .icon{font-size:21.6px;} /* the current #1 player's plane, 20% bigger */
.plane-token .pname{font-size:8.5px; font-weight:700; background:rgba(0,20,50,.65); padding:1px 6px; border-radius:8px; white-space:nowrap;}
@keyframes float{0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);}}
/* 5+ correct answers in a row — a flame trails behind the aircraft */
.plane-token.on-fire .icon{filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)) drop-shadow(0 0 9px rgba(255,120,0,.9));}
.plane-token .flame-trail{display:none;}
.plane-token.on-fire .flame-trail{
  display:block; position:absolute; left:50%; top:52%; transform:translate(-50%,0);
  font-size:13px; pointer-events:none; z-index:-1; animation:flameFlicker .45s ease-in-out infinite alternate;
}
@keyframes flameFlicker{ 0%{transform:translate(-50%,0) scale(.82) rotate(-6deg); opacity:.7;} 100%{transform:translate(-50%,3px) scale(1.08) rotate(6deg); opacity:1;} }

/* New Leader overtake — the two planes involved grow/shrink slowly (2s), independent of
   the normal .leader 20%-bigger rule, which resumes once the transient classes clear. */
.plane-token.overtaking .icon{transition:font-size 1.8s ease, filter 1.8s ease; font-size:36px !important; filter:drop-shadow(0 4px 16px rgba(255,196,0,.95));}
.plane-token.falling-behind .icon{transition:font-size 1.8s ease, opacity 1.8s ease; font-size:12px !important; opacity:.5;}
.plane-token.landing-flourish{animation:landingSwoop 2.6s ease-in-out; z-index:25;}
@keyframes landingSwoop{
  0%{transform:translate(-50%,-50%) rotate(0deg) scale(1);}
  35%{transform:translate(-50%,-50%) rotate(190deg) scale(1.35) translateY(-34px);}
  70%{transform:translate(-50%,-50%) rotate(360deg) scale(1.15) translateY(-8px);}
  100%{transform:translate(-50%,-50%) rotate(360deg) scale(1) translateY(0);}
}

.new-leader-banner{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.7); z-index:80;
  background:linear-gradient(135deg, rgba(255,196,0,.96), rgba(255,90,0,.94));
  color:#2a1500; text-align:center; padding:26px 50px; border-radius:22px;
  box-shadow:0 24px 70px rgba(255,140,0,.6); opacity:0; pointer-events:none;
  transition:opacity .4s ease, transform .4s ease;
}
.new-leader-banner.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
.new-leader-banner .tag{font-family:var(--font-display); font-weight:800; font-size:22px; letter-spacing:.05em;}
.new-leader-banner .who{font-family:var(--font-display); font-weight:800; font-size:36px; margin-top:6px;}

/* Location-themed backdrop — tracks whoever is currently in the lead. Stylised
   gradient + floating watermark icon per stop rather than a fully illustrated scene. */
.map-panel{transition:background 1.6s ease;}
.map-zoom-wrap{position:absolute; inset:0; transition:transform 1.8s cubic-bezier(.45,.05,.15,1); transform-origin:50% 50%;}
.scene-watermark{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:220px; line-height:1; opacity:.09; filter:blur(.5px); pointer-events:none;
  transition:opacity .8s ease; animation:sceneFloat 8s ease-in-out infinite;
}
@keyframes sceneFloat{0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-16px) scale(1.03);}}
.map-panel.scene-cdg{background:linear-gradient(160deg, rgba(255,150,130,.18), rgba(120,70,150,.15));}
.map-panel.scene-ams{background:linear-gradient(160deg, rgba(255,170,190,.16), rgba(110,200,150,.13));}
.map-panel.scene-han{background:linear-gradient(160deg, rgba(255,190,90,.2), rgba(220,60,60,.13));}
.map-panel.scene-muc{background:linear-gradient(160deg, rgba(255,190,80,.22), rgba(150,90,30,.15));}
.map-panel.scene-mow{background:linear-gradient(160deg, rgba(180,220,255,.2), rgba(90,120,180,.15));}
.map-panel.scene-spc{background:linear-gradient(160deg, rgba(255,215,120,.22), rgba(255,255,255,.1));}
.map-panel.scene-lhr{background:linear-gradient(160deg, rgba(185,195,215,.17), rgba(200,70,70,.1));}
.map-panel.scene-mxp{background:linear-gradient(160deg, rgba(190,150,255,.17), rgba(255,210,120,.13));}
.map-panel.scene-cph{background:linear-gradient(160deg, rgba(100,220,210,.17), rgba(60,140,180,.15));}
.map-panel.scene-sgn{background:linear-gradient(160deg, rgba(255,220,90,.2), rgba(80,200,120,.15));}
.map-panel.scene-fra{background:linear-gradient(160deg, rgba(160,190,230,.17), rgba(100,120,160,.15));}
.map-panel.scene-finish{background:linear-gradient(160deg, rgba(255,210,90,.24), rgba(255,255,255,.13));}

.q-status-card{margin-top:18px; border-radius:18px; padding:18px 20px;}

#weatherBadge.weather-storm{background:rgba(120,60,180,.25); border-color:rgba(200,160,255,.5); color:#e8d8ff;}

/* storm / turbulence theme */
#view-presenter.storm-theme{ animation:stormDarken .6s ease forwards; }
@keyframes stormDarken{ to{ filter:brightness(.78) saturate(.85); } }
.storm-fx{position:absolute; inset:0; pointer-events:none; z-index:40; overflow:hidden;}
.lightning-flash{position:absolute; inset:0; background:#fff; opacity:0; animation:flash 4.5s ease-in-out infinite;}
@keyframes flash{ 0%,92%,100%{opacity:0;} 93%{opacity:.55;} 94%{opacity:0;} 96%{opacity:.35;} 97%{opacity:0;} }
.rain-drop{position:absolute; top:-5%; width:1.5px; height:60px; background:linear-gradient(180deg, transparent, rgba(200,220,255,.55)); animation-name:rainfall; animation-iteration-count:infinite; animation-timing-function:linear;}
@keyframes rainfall{ from{transform:translateY(-10%);} to{transform:translateY(115vh);} }

#weatherBadge.weather-power{background:linear-gradient(135deg, rgba(255,196,0,.35), rgba(255,140,0,.28)); border-color:rgba(255,196,0,.65); color:#fff3d6;}

/* power question / sunny theme */
#view-presenter.sunny-theme{ animation:sunnyBrighten .6s ease forwards; }
@keyframes sunnyBrighten{ to{ filter:brightness(1.12) saturate(1.2) hue-rotate(-4deg); } }
.sunny-fx{position:absolute; inset:0; pointer-events:none; z-index:3; overflow:hidden;
  background:radial-gradient(circle at 50% -8%, rgba(255,214,120,.4), transparent 55%);
  animation:sunnyPulse 3.2s ease-in-out infinite;}
@keyframes sunnyPulse{ 0%,100%{opacity:.65;} 50%{opacity:1;} }
.sun-ray{position:absolute; top:-12%; left:50%; width:2400px; height:2400px; margin-left:-1200px;
  background:conic-gradient(from 0deg, rgba(255,214,120,0) 0deg, rgba(255,214,120,.16) 4deg, rgba(255,214,120,0) 9deg);
  border-radius:50%; transform-origin:50% 12%; animation:sunSpin 26s linear infinite;}
@keyframes sunSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

#weatherBadge.weather-thunder{background:linear-gradient(135deg, rgba(30,60,140,.5), rgba(10,20,60,.4)); border-color:rgba(150,190,255,.7); color:#eaf1ff;}

/* ⛈ Storm theme — a heavier, more electric variant of the turbulence rain */
#view-presenter.thunder-theme{ animation:thunderDarken .6s ease forwards; }
@keyframes thunderDarken{ to{ filter:brightness(.65) saturate(1.15) contrast(1.2); } }
.thunder-flash{animation-name:thunderFlash; animation-duration:2.6s; background:#cfe0ff;}
@keyframes thunderFlash{ 0%,88%,100%{opacity:0;} 89%{opacity:.7;} 90%{opacity:0;} 92%{opacity:.5;} 93%{opacity:0;} 95%{opacity:.4;} 96%{opacity:0;} }
.thunder-drop{background:linear-gradient(180deg, transparent, rgba(180,210,255,.75));}

.storm-clear-overlay{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:50;
  background:linear-gradient(160deg, rgba(10,25,60,.94), rgba(20,45,110,.9));
  border:1px solid rgba(150,190,255,.6); border-radius:20px; padding:22px 28px;
  min-width:320px; max-width:80%; box-shadow:0 20px 60px rgba(0,10,40,.6);
  animation:stormClearIn .35s ease;
}
@keyframes stormClearIn{ from{opacity:0; transform:translate(-50%,-50%) scale(.92);} to{opacity:1; transform:translate(-50%,-50%) scale(1);} }
.storm-clear-title{font-weight:800; font-size:16px; color:#eaf1ff; text-align:center; margin-bottom:14px; letter-spacing:.03em;}
.storm-clear-list{display:grid; grid-template-columns:1fr 1fr; gap:8px 18px; max-height:280px; overflow:auto;}
.storm-clear-row{display:flex; align-items:center; gap:8px; font-size:13.5px; color:#fff;}
.storm-clear-row .rank{font-family:var(--font-mono); color:rgba(200,220,255,.7); width:24px; flex-shrink:0;}

/* one shared "what's the rule right now" banner for the presenter screen, themed per
   weather/event so players watching the LED display know the rule without needing
   their own phone — turbulence (purple), storm (blue), power question (gold) */
.weather-rule-banner{
  position:absolute; top:70px; left:50%; transform:translateX(-50%) scale(1); z-index:45;
  padding:12px 28px; border-radius:14px; text-align:center; max-width:min(640px, 86%);
  font-family:var(--font-display); animation:weatherBannerPulse 1.3s ease-in-out infinite;
}
.weather-rule-banner .title{font-weight:800; font-size:19px; letter-spacing:.05em;}
.weather-rule-banner .rule{font-family:var(--font-body); font-weight:600; font-size:12.5px; letter-spacing:normal; margin-top:4px; opacity:.92;}
@keyframes weatherBannerPulse{ 0%,100%{ transform:translateX(-50%) scale(1);} 50%{ transform:translateX(-50%) scale(1.035);} }
.weather-rule-banner.wx-power{ background:linear-gradient(135deg, rgba(255,196,0,.92), rgba(255,120,0,.88)); color:#2a1500; box-shadow:0 10px 34px rgba(255,150,0,.5); }
.weather-rule-banner.wx-turbulence{ background:linear-gradient(135deg, rgba(150,90,220,.92), rgba(90,50,160,.88)); color:#fff; box-shadow:0 10px 34px rgba(120,60,180,.5); }
.weather-rule-banner.wx-storm{ background:linear-gradient(135deg, rgba(60,110,220,.92), rgba(20,40,110,.9)); color:#fff; box-shadow:0 10px 34px rgba(30,60,160,.5); }

.winner-overlay{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; flex-direction:column; background:radial-gradient(circle at 50% 30%, rgba(212,175,55,.35), rgba(0,20,50,.92));}
.winner-overlay .trophy{font-size:80px; margin-bottom:10px;}
.winner-overlay h1{font-size:44px; margin:0 0 6px;}
.winner-overlay .pname{color:var(--vna-gold-light); font-weight:800;}
.podium{display:flex; align-items:flex-end; gap:14px; margin-top:30px;}
.podium .col{display:flex; flex-direction:column; align-items:center; gap:8px;}
.podium .bar{width:90px; border-radius:10px 10px 0 0; background:var(--glass); border:1px solid var(--glass-brd); display:flex; align-items:flex-start; justify-content:center; padding-top:10px; font-family:var(--font-mono); font-weight:700;}
.podium .c1 .bar{height:120px; background:linear-gradient(180deg,var(--vna-gold-light),var(--vna-gold));color:#1a1200;}
.podium .c2 .bar{height:88px;}
.podium .c3 .bar{height:66px;}
.podium-name{font-size:16px; font-weight:800; color:var(--vna-gold); background:rgba(0,15,35,.65); padding:5px 12px; border-radius:9px; margin-top:2px; white-space:nowrap;}

/* ---------- FINAL ROUND: brilliant sunshine, somebody is one leg from landing ---------- */
.final-round-pill{
  background:linear-gradient(135deg,#ffd85e,#ff9500); color:#3a2200; border:1px solid #ffe9a8;
  font-family:var(--font-display); font-weight:800; letter-spacing:.09em;
  box-shadow:0 6px 22px rgba(255,170,0,.55); animation:finalRoundPulse 1.1s ease-in-out infinite alternate;
}
@keyframes finalRoundPulse{from{transform:scale(1); filter:brightness(1);} to{transform:scale(1.05); filter:brightness(1.18);}}
#view-presenter.final-round-theme{animation:finalRoundGlow .8s ease forwards;}
@keyframes finalRoundGlow{to{filter:brightness(1.2) saturate(1.35) contrast(1.04);}}
.final-round-fx .sun-disc{
  position:absolute; top:20px; left:50%; transform:translateX(-50%); font-size:150px; line-height:1;
  opacity:.5; filter:drop-shadow(0 0 50px rgba(255,200,60,.95)); animation:sunBlaze 3s ease-in-out infinite;
}
@keyframes sunBlaze{0%,100%{transform:translateX(-50%) scale(1); opacity:.42;} 50%{transform:translateX(-50%) scale(1.09); opacity:.62;}}
#view-player.final-round-theme .q-card{background:linear-gradient(160deg,rgba(255,213,90,.2),rgba(255,150,0,.11)); border-color:rgba(255,205,90,.55);}

/* ---------- presenter: the cabin bulletin under the leaderboard ---------- */
.pres-side{display:flex; flex-direction:column; gap:18px; min-height:0;}
.leader-panel{flex:2 1 0; min-height:0;}
.brief-panel{flex:1 1 0; min-height:0; border-radius:26px; padding:14px 16px; display:flex; flex-direction:column; overflow:hidden;}
.brief-head{
  display:flex; align-items:center; justify-content:space-between; gap:8px; flex-shrink:0;
  padding-bottom:9px; margin-bottom:10px; border-bottom:1px dashed rgba(255,255,255,.22);
}
.brief-title{font-family:var(--font-display); font-weight:800; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--vna-gold-light);}
.brief-leg{font-family:var(--font-mono); font-size:10.5px; color:rgba(255,255,255,.55);}
.brief-body{flex:1; min-height:0; overflow-y:auto; display:grid; grid-template-columns:1fr 1fr; gap:5px 12px; align-content:start;}
.brief-item{display:flex; align-items:flex-start; gap:7px; min-width:0;}
.brief-item .bi{font-size:15px; line-height:1.15; flex-shrink:0;}
.brief-item .bl{font-size:8.5px; text-transform:uppercase; letter-spacing:.06em; color:rgba(255,255,255,.48); line-height:1.2;}
.brief-item .bv{font-size:12px; font-weight:700; line-height:1.32; overflow-wrap:anywhere;}
.brief-item.wide{grid-column:1 / -1;}
.brief-item .bv .sub{font-weight:400; font-size:10.5px; color:rgba(255,255,255,.55);}
.brief-item .bnm{display:inline-block; margin-right:11px; white-space:nowrap;}
.brief-empty{font-size:12px; color:rgba(255,255,255,.45); line-height:1.5;}
.pace-fast{color:#7BE3A0;} .pace-med{color:var(--vna-gold-light);} .pace-slow{color:#FFB0A0;}

/* ---------- award ceremony: one champion with the cup, then gold / silver / bronze ---------- */
.champion-block{text-align:center; margin-bottom:26px;}
.champion-cup{font-size:96px; line-height:1; filter:drop-shadow(0 10px 30px rgba(212,175,55,.75)); animation:cupFloat 3s ease-in-out infinite;}
@keyframes cupFloat{0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-10px) scale(1.04);}}
.champion-eyebrow{font-family:var(--font-display); font-weight:800; font-size:14px; letter-spacing:.22em; text-transform:uppercase; color:var(--vna-gold-light); margin-top:6px;}
.champion-name{font-family:var(--font-display); font-weight:800; font-size:clamp(40px,5.4vw,76px); line-height:1.05; color:var(--vna-gold); text-shadow:0 6px 30px rgba(212,175,55,.5); margin-top:2px;}
.champion-sub{font-size:14px; color:rgba(255,255,255,.75); margin-top:8px;}
.medal-row{display:flex; gap:16px; justify-content:center; flex-wrap:wrap;}
.medal-card{min-width:170px; padding:16px 20px; border-radius:18px; text-align:center; background:rgba(255,255,255,.07); border:1px solid var(--glass-brd);}
.medal-ico{font-size:38px; line-height:1;}
.medal-place{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:rgba(255,255,255,.55); margin-top:4px;}
.medal-name{font-family:var(--font-display); font-weight:800; font-size:20px; margin-top:2px;}
.medal-sub{font-size:11.5px; color:rgba(255,255,255,.6); margin-top:4px;}

/* ================= ADMIN ================= */
#view-admin{min-height:100vh; display:flex;}
.admin-sidebar{width:250px; flex-shrink:0; padding:24px 18px; display:flex; flex-direction:column; gap:6px;}
.admin-nav-btn{display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:12px; background:transparent; border:none; color:rgba(255,255,255,.75); font-size:14px; font-weight:600; cursor:pointer; text-align:left;}
.admin-nav-btn:hover{background:rgba(255,255,255,.06);}
.admin-nav-btn.active{background:rgba(212,175,55,.16); color:var(--vna-gold-light);}
.admin-main{flex:1; padding:26px 34px; overflow-y:auto; max-height:100vh;}
.admin-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
.admin-header h2{margin:0; font-size:24px;}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;}
.stat-card{border-radius:16px; padding:16px 18px;}
.stat-card .n{font-family:var(--font-mono); font-size:24px; font-weight:700;}
.stat-card .l{font-size:12px; color:rgba(255,255,255,.6); margin-top:2px;}
.panel{border-radius:20px; padding:22px; margin-bottom:20px;}
.panel h3{margin:0 0 16px; font-size:15px; text-transform:uppercase; letter-spacing:.05em; color:rgba(255,255,255,.65);}
.control-row{display:flex; gap:10px; flex-wrap:wrap;}
.answer-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.answer-tile{border-radius:12px; padding:12px 14px; background:rgba(255,255,255,.05); border:1px solid var(--glass-brd);}
.answer-tile .nm{font-size:13px; font-weight:700; margin-bottom:3px;}
.answer-tile .ans{font-family:var(--font-mono); font-size:12px; color:rgba(255,255,255,.6);}
.answer-tile.correct-tile{border-color:var(--good);}
.answer-tile.wrong-tile{border-color:var(--bad);}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:rgba(255,255,255,.5); padding:8px 10px; border-bottom:1px solid var(--glass-brd);}
td{padding:10px; border-bottom:1px solid rgba(255,255,255,.06);}
.tag{display:inline-block; font-family:var(--font-mono); font-size:10.5px; padding:3px 8px; border-radius:6px; background:rgba(255,255,255,.08);}
.qedit-row{display:grid; grid-template-columns:26px 1fr; gap:10px; align-items:start; padding:12px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.qedit-row .num{font-family:var(--font-mono); color:rgba(255,255,255,.5); padding-top:6px;}
.qedit-row .ans-correct{color:var(--good); font-weight:700;}
.toast{position:fixed; bottom:calc(24px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:rgba(0,30,60,.92); border:1px solid var(--vna-gold); padding:12px 20px; border-radius:12px; font-size:13.5px; z-index:200; opacity:0; transition:opacity .25s ease, transform .25s ease; max-width:calc(100vw - 32px);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2); border-radius:4px;}

/* ---------- admin: live countdown + presenter notes ---------- */
.admin-ctrl-head{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:12px;}
.admin-timer{
  font-family:var(--font-mono); font-weight:700; font-size:26px; line-height:1; padding:8px 18px;
  border-radius:14px; background:rgba(255,255,255,.08); border:1px solid var(--glass-brd); min-width:96px; text-align:center;
}
.admin-timer.urgent{background:var(--bad); border-color:var(--bad); color:#fff; animation:clockPulse .5s ease-in-out infinite alternate;}
.presenter-notes{margin-top:14px; padding:14px 16px; border-radius:14px; background:rgba(212,175,55,.10); border:1px solid rgba(212,175,55,.34);}
.presenter-notes .pn-title{font-family:var(--font-display); font-weight:800; font-size:14px; letter-spacing:.05em; text-transform:uppercase; color:var(--vna-gold-light); margin-bottom:9px;}
/* the host reads this off the iPad while talking, so it needs to be legible at arm's length */
.presenter-notes .pn-body{font-size:17.5px; line-height:1.62; color:#fff;}
@keyframes clockPulse{from{transform:scale(1);} to{transform:scale(1.09);}}

/* ---------- presenter: question panel, answer card, fullscreen ----------
   Deliberately opaque (no backdrop-filter) — on an LED wall a blurred translucent
   panel loses all contrast and the back of the room can't read the options. */
.pres-question-overlay{
  position:absolute; inset:0; z-index:60; display:flex; flex-direction:column;
  background:linear-gradient(158deg,#00284C 0%,#003A6B 55%,#0A5391 100%);
  padding:30px 36px; gap:16px;
}
.pq-head{display:flex; align-items:center; justify-content:space-between; gap:20px;}
.pq-eyebrow{font-family:var(--font-display); font-weight:800; font-size:17px; letter-spacing:.07em; text-transform:uppercase; color:var(--vna-gold-light);}
.pq-timer{
  font-family:var(--font-mono); font-weight:700; font-size:52px; line-height:1; min-width:150px; text-align:center;
  padding:8px 20px; border-radius:18px; background:rgba(255,255,255,.10); border:2px solid var(--glass-brd);
}
.pq-timer.urgent{background:var(--bad); border-color:#ff8f8f; color:#fff; animation:clockPulse .5s ease-in-out infinite alternate;}
.pq-text{font-family:var(--font-display); font-weight:800; font-size:clamp(22px,2.5vw,36px); line-height:1.28;}
.pq-opts{display:grid; grid-template-columns:1fr 1fr; gap:13px; margin-top:auto;}
.pq-opt{
  display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius:16px;
  background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.20); font-size:clamp(15px,1.35vw,21px); font-weight:600;
}
.pq-opt .k{
  width:40px; height:40px; flex-shrink:0; border-radius:11px; background:rgba(255,255,255,.16);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:18px;
}
.pq-opt.correct{background:rgba(46,204,113,.28); border-color:var(--good);}
.pq-opt.correct .k{background:var(--good); color:#04301a;}
/* shown in place of the options while a question is staged but not yet opened */
.pq-await{margin-top:auto; text-align:center; padding:22px; border-radius:16px; font-size:clamp(14px,1.2vw,19px); font-weight:600;
  color:rgba(255,255,255,.6); background:rgba(255,255,255,.05); border:2px dashed rgba(255,255,255,.18);}
.p-await{text-align:center; padding:16px 14px; border-radius:13px; font-size:13px; font-weight:600;
  color:rgba(255,255,255,.55); background:rgba(255,255,255,.05); border:1.5px dashed rgba(255,255,255,.18);}
.pq-answer-tag{
  text-align:center; font-family:var(--font-display); font-weight:800; font-size:21px; letter-spacing:.04em;
  padding:11px; border-radius:14px; background:rgba(46,204,113,.24); border:2px solid var(--good); color:#d6ffe8;
}
.pres-fullscreen-btn{padding:8px 14px; font-size:13px; border-radius:20px;}

/* ---------- big weather announcement (lobby only, presenter + player) ---------- */
.wx-announce{
  border-radius:20px; padding:26px 30px; text-align:center; font-family:var(--font-display);
  animation:wxAnnouncePop .45s cubic-bezier(.2,1.3,.4,1);
}
.wx-announce .ic{font-size:52px; line-height:1; margin-bottom:8px;}
.wx-announce .tt{font-weight:800; font-size:30px; letter-spacing:.06em; margin-bottom:8px;}
.wx-announce .rl{font-family:var(--font-body); font-weight:600; font-size:15px; line-height:1.5; opacity:.94;}
.wx-announce.wx-turbulence{background:linear-gradient(135deg,#8f56dc,#5a32a0); color:#fff; box-shadow:0 18px 50px rgba(120,60,180,.55);}
.wx-announce.wx-storm{background:linear-gradient(135deg,#3c6edc,#14286e); color:#fff; box-shadow:0 18px 50px rgba(30,60,160,.55);}
.wx-announce.wx-power{background:linear-gradient(135deg,#ffc400,#ff7800); color:#2a1500; box-shadow:0 18px 50px rgba(255,150,0,.55);}
@keyframes wxAnnouncePop{from{opacity:0; transform:scale(.86);} to{opacity:1; transform:scale(1);}}
/* presenter: floats the card over the live map rather than blacking the map out —
   the room should still see the aircraft behind the warning */
.pres-wx-announce{position:absolute; inset:0; z-index:58; display:flex; align-items:center; justify-content:center; background:transparent; padding:40px; pointer-events:none;}
.pres-wx-announce .wx-announce{max-width:760px;}
.pres-wx-announce .wx-announce .ic{font-size:92px;}
.pres-wx-announce .wx-announce .tt{font-size:52px;}
.pres-wx-announce .wx-announce .rl{font-size:19px;}
/* player: sits at the top of the game column */
#pWxAnnounce{margin-bottom:12px;}
#pWxAnnounce .wx-announce{padding:18px 20px;}
#pWxAnnounce .wx-announce .ic{font-size:38px;}
#pWxAnnounce .wx-announce .tt{font-size:21px;}
#pWxAnnounce .wx-announce .rl{font-size:12.5px;}

/* ---------- player: countdown, helps, weather skins, business-class top 3 ---------- */
#pTimer{font-size:23px; font-weight:700; padding:7px 22px; min-width:96px; text-align:center; transition:background .2s ease;}
#pTimer.urgent{background:var(--bad); border-color:var(--bad); color:#fff; animation:clockPulse .5s ease-in-out infinite alternate;}
.help-row{display:flex; gap:14px; justify-content:center; margin-top:12px;}
.help-btn{
  width:70px; height:70px; flex-shrink:0; border-radius:50%; padding:0; line-height:1; cursor:pointer;
  border:2px solid var(--glass-brd); background:rgba(255,255,255,.07); color:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-family:var(--font-body); transition:all .15s ease; touch-action:manipulation;
}
/* one shared colour for all three help glyphs — the SVGs inherit it via currentColor,
   which is the whole reason they aren't emoji (see HELP_ICONS) */
.help-btn .ic{font-size:22px; line-height:1; color:#fff; display:flex; align-items:center; justify-content:center; height:1em;}
.help-btn .ic svg{width:1em; height:1em; display:block;}
.fifty-glyph{font-family:var(--font-display); font-weight:800; font-size:.72em; letter-spacing:-.03em; line-height:1;}
.help-btn .lb{font-size:8px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; opacity:.8;}
.help-btn:active{transform:scale(.94);}
.help-btn.armed{border-color:var(--vna-gold); background:rgba(212,175,55,.24); box-shadow:0 0 0 4px rgba(212,175,55,.18);}
.help-btn:disabled{opacity:.3; cursor:not-allowed;}
.help-btn.spent{opacity:.26;}
.help-hint{text-align:center; font-size:11px; color:rgba(255,255,255,.5); margin-top:7px;}
.opt-btn.eliminated{opacity:.22; text-decoration:line-through;}

#view-player.wx-turbulence .q-card{background:linear-gradient(160deg,rgba(150,90,220,.26),rgba(90,50,160,.15)); border-color:rgba(185,145,255,.55);}
#view-player.wx-storm .q-card{background:linear-gradient(160deg,rgba(60,110,220,.28),rgba(20,40,110,.18)); border-color:rgba(140,180,255,.6);}
#view-player.wx-power .q-card{background:linear-gradient(160deg,rgba(255,196,0,.22),rgba(255,120,0,.13)); border-color:rgba(255,196,0,.6);}
.player-fx{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}

/* Vietnam Airlines business-class gold treatment for whoever is currently 1st/2nd/3rd */
#view-player.biz-gold{background:linear-gradient(180deg,#231903 0%,#4b3705 42%,#8a6816 100%);}
#view-player.biz-gold .q-card,
#view-player.biz-gold .dest-strip,
#view-player.biz-gold .status-banner{border-color:rgba(212,175,55,.5); background:rgba(46,33,0,.5);}
#view-player.biz-gold .opt-btn{background:rgba(255,255,255,.07); border-color:rgba(212,175,55,.34);}
#view-player.biz-gold .opt-btn.picked{border-color:var(--vna-gold-light); background:rgba(212,175,55,.24);}
/* the reveal colours have to be restated here: "#view-player.biz-gold .opt-btn" outranks
   the plain ".opt-btn.correct/.wrong", so without these the top 3 saw no green or red */
#view-player.biz-gold .opt-btn.correct{border-color:var(--good); background:rgba(46,204,113,.26);}
#view-player.biz-gold .opt-btn.wrong{border-color:var(--bad); background:rgba(225,82,82,.26);}
#view-player.biz-gold .opt-btn.eliminated{opacity:.22;}
.biz-ribbon{
  display:flex; align-items:center; gap:10px; border-radius:16px; padding:12px 16px; margin-bottom:12px;
  background:linear-gradient(120deg,rgba(212,175,55,.9),rgba(240,214,120,.78)); color:#2a1d00;
  box-shadow:0 10px 28px rgba(212,175,55,.35);
}
/* 2nd place rides Premium Economy — the jade green of that cabin, same layout as gold */
#view-player.cabin-premium{background:linear-gradient(180deg,#04211a 0%,#0A4436 42%,#177A5F 100%);}
#view-player.cabin-premium .q-card,
#view-player.cabin-premium .dest-strip,
#view-player.cabin-premium .status-banner{border-color:rgba(46,190,150,.42); background:rgba(6,52,40,.5);}
#view-player.cabin-premium .opt-btn{background:rgba(255,255,255,.07); border-color:rgba(46,190,150,.3);}
#view-player.cabin-premium .opt-btn.picked{border-color:#3FD6A6; background:rgba(63,214,166,.2);}
#view-player.cabin-premium .opt-btn.correct{border-color:var(--good); background:rgba(46,204,113,.3);}
#view-player.cabin-premium .opt-btn.wrong{border-color:var(--bad); background:rgba(225,82,82,.26);}
#view-player.cabin-premium .opt-btn.eliminated{opacity:.22;}
.biz-ribbon.prem-ribbon{
  background:linear-gradient(120deg,#1E9B77,#39C79B); color:#03251c;
  box-shadow:0 10px 28px rgba(30,155,119,.35);
}
.biz-ribbon .medal{font-size:26px; line-height:1;}
.biz-ribbon .tt{font-family:var(--font-display); font-weight:800; font-size:15px; letter-spacing:.03em;}
.biz-ribbon .sb{font-size:11.5px; font-weight:600; opacity:.82; margin-top:1px;}

/* ---------- how to play: 4 paged slides ---------- */
.rules-page{display:none;}
.rules-page.active{display:block;}
.rules-nav{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:18px; padding-top:14px; border-top:1px solid rgba(255,255,255,.1);}
.rules-dots{display:flex; gap:7px;}
.rules-dot{width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.25); cursor:pointer; border:none; padding:0;}
.rules-dot.on{background:var(--vna-gold);}
.rules-routemap{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px;}
.rules-routemap span{font-family:var(--font-mono); font-size:11px; padding:4px 8px; border-radius:7px; background:rgba(255,255,255,.08);}
.rules-routemap span.cp{background:rgba(212,175,55,.24); color:var(--vna-gold-light); font-weight:700;}
.rules-help-card{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.07);}
.rules-help-card:last-child{border-bottom:none;}
.rules-doc-link{display:inline-flex; align-items:center; gap:8px; padding:11px 15px; border-radius:12px; text-decoration:none;
  background:rgba(212,175,55,.14); border:1px solid rgba(212,175,55,.42); color:var(--vna-gold-light); font-weight:600; font-size:13.5px;}
.rules-doc-link:hover{background:rgba(212,175,55,.24); border-color:var(--vna-gold);}
/* static route drawing on guide page 2 */
.rules-map{border-radius:16px; padding:8px 4px; background:linear-gradient(160deg,rgba(0,58,107,.55),rgba(11,95,160,.35)); border:1px solid var(--glass-brd);}
.rules-map svg{width:100%; height:auto; display:block;}
.rules-map text{font-family:var(--font-mono); fill:#fff;}
.rules-map .rm-code{font-size:24px; opacity:.8;}
.rules-map .rm-cp{font-size:28px; font-weight:700; fill:var(--vna-gold-light);}
/* the prize list earns a highlighted box — it's the reason people play hard */
.prize-box{padding:14px 16px; border-radius:14px; background:rgba(212,175,55,.1); border:1px solid rgba(212,175,55,.32);}
.prize-box h4{margin-top:0;}
.prize-box p{margin-bottom:0 !important;}
.rules-help-card .circ{width:46px; height:46px; flex-shrink:0; border-radius:50%; border:2px solid var(--glass-brd); background:rgba(255,255,255,.07); display:flex; align-items:center; justify-content:center; font-size:22px; color:#fff;}
.rules-help-card .circ svg{width:1em; height:1em; display:block;}
/* the same glyphs, small, in the admin players table */
.tag .fifty-glyph{font-size:10px;}
.tag svg{width:11px; height:11px; display:inline-block; vertical-align:-1px;}

/* ---------- iPad landscape: admin dashboard must fit without horizontal scroll ---------- */
@media (max-width:1250px){
  .admin-sidebar{width:184px; padding:16px 11px;}
  .admin-nav-btn{font-size:12.5px; padding:9px 10px; gap:6px;}
  .admin-main{padding:16px 20px;}
  .admin-header{margin-bottom:13px;}
  .admin-header h2{font-size:19px;}
  .stat-grid{gap:9px; margin-bottom:14px;}
  .stat-card{padding:10px 12px; border-radius:13px;}
  .stat-card .n{font-size:19px;}
  .stat-card .l{font-size:10.5px;}
  .panel{padding:15px; margin-bottom:13px; border-radius:16px;}
  .panel h3{font-size:13px; margin-bottom:11px;}
  #view-admin .btn{padding:9px 13px; font-size:13px; border-radius:11px;}
  #view-admin .btn-sm{padding:7px 10px; font-size:12px;}
  .control-row{gap:8px;}
  .admin-timer{font-size:22px; padding:6px 14px; min-width:84px;}
  table{font-size:12.5px;}
  th{padding:6px 8px;} td{padding:7px 8px;}
  .answer-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:8px;}
}
/* ---------- iPhone portrait: fit the whole game screen without scrolling ----------
   Keyed off viewport height rather than width: an iPhone 15 is 844px tall, an SE 667px,
   and the thing that has to fit is the vertical stack (header → progress → clock →
   question → helps → position strip), not the width. */
@media (max-height:900px){
  /* bottom padding clears the fixed 🟢 LIVE sync badge; because .q-card is flex:1 it
     absorbs the extra padding rather than pushing the page taller */
  #view-player{padding-top:calc(11px + env(safe-area-inset-top)); padding-bottom:calc(44px + env(safe-area-inset-bottom));}
  .p-header{margin-bottom:9px;}
  .route-strip{margin:8px 0 5px;}
  .rs-slot{height:32px;}
  .rs-dot{width:20px; height:20px; font-size:10px;}
  .rs-stop.here .rs-dot{width:28px; height:28px; font-size:14px;}
  .timer-ring-wrap{margin:4px 0 9px;}
  #pTimer{font-size:21px; padding:5px 20px;}
  .q-card{padding:14px; border-radius:18px;}
  .q-eyebrow{margin-bottom:7px; font-size:11px;}
  .q-text{font-size:16.5px; margin-bottom:13px;}
  .opt-btn{padding:11px 13px; font-size:13.5px; margin-bottom:6px; border-radius:12px;}
  .opt-btn .k{width:23px; height:23px;}
  .help-row{gap:12px; margin-top:9px;}
  .help-btn{width:58px; height:58px;}
  .help-btn .ic{font-size:18px;}
  .help-btn .lb{font-size:7.5px;}
  .help-hint{margin-top:5px; font-size:10.5px;}
  .dest-strip{padding:9px 14px; margin-top:9px; border-radius:13px;}
  .status-banner{padding:11px 14px; margin-top:9px; border-radius:13px;}
  .biz-ribbon{padding:9px 13px; margin-bottom:9px;}
  .biz-ribbon .medal{font-size:22px;}
  #pWxAnnounce{margin-bottom:9px;}
  #pWxAnnounce .wx-announce{padding:13px 15px;}
  #pWxAnnounce .wx-announce .ic{font-size:30px; margin-bottom:5px;}
  #pWxAnnounce .wx-announce .tt{font-size:18px; margin-bottom:5px;}
  #pWxAnnounce .wx-announce .rl{font-size:11.5px;}
}
@media (max-width:430px){
  .pq-opts{grid-template-columns:1fr;}
}
/* the sync badge is injected with an inline style, so overriding it needs !important */
@media (max-width:520px){
  #syncBadge{font-size:10px !important; padding:3px 8px !important; opacity:.85;}
}
</style>
</head>
<body>

<div class="cloud-field" id="cloudField"></div>
<div class="glow-orb" style="width:420px;height:420px; background:var(--vna-gold); top:-120px; right:-100px;"></div>
<div class="glow-orb" style="width:380px;height:380px; background:var(--vna-blue-mid); bottom:-140px; left:-100px;"></div>

<div class="app" id="app">

  <!-- language switch: fixed on the landing screen, and repeated on the player join card
       because a guest scanning the QR code lands straight on #player and never sees this one -->
  <div class="lang-switch" id="langSwitch">
    <button class="lang-opt" data-lang="vi" onclick="setLang('vi')">VI</button>
    <button class="lang-opt" data-lang="en" onclick="setLang('en')">EN</button>
  </div>

  <!-- ============ LANDING ============ -->
  <section id="view-landing" class="landing">
    <img src="vendor/vna-logo.png" alt="Vietnam Airlines" style="max-width:260px; width:60%; height:auto; margin-bottom:22px;" />
    <h1>Sky<span class="gold">Race</span></h1>
    <p class="sub" data-i18n-html="landing.sub"></p>
    <div class="role-grid">
      <div class="role-card glass" onclick="go('player')">
        <span class="icon">📱</span>
        <h3 data-i18n="landing.player"></h3>
        <p data-i18n="landing.playerDesc"></p>
        <div class="go" data-i18n="landing.playerGo"></div>
      </div>
      <div class="role-card glass" onclick="go('presenter')">
        <span class="icon">🖥️</span>
        <h3 data-i18n="landing.presenter"></h3>
        <p data-i18n="landing.presenterDesc"></p>
        <div class="go" data-i18n="landing.presenterGo"></div>
      </div>
      <div class="role-card glass" onclick="openAdminGate()">
        <span class="icon">🛠️</span>
        <h3 data-i18n="landing.admin"></h3>
        <p data-i18n="landing.adminDesc"></p>
        <div class="go" data-i18n="landing.adminGo"></div>
      </div>
    </div>
    <button class="rules-help-btn glass" onclick="openRulesModal()" data-i18n="landing.howto"></button>
  </section>

  <!-- ============ RULES / HOW TO PLAY ============ -->
  <div id="rulesModal" class="hidden" style="position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(0,20,40,.7); padding:20px;">
    <div class="glass rules-modal-card">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px;">
        <h3 style="margin:0; font-size:20px;" data-i18n="rules.title"></h3>
        <button class="btn btn-ghost btn-sm" onclick="closeRulesModal()" data-i18n="rules.close"></button>
      </div>

      <!-- page 1 — the race, winning, prizes -->
      <div class="rules-page active" data-page="1">
        <div class="rules-section">
          <h4 data-i18n="rules.h.race"></h4>
          <p data-i18n-html="rules.p.race1"></p>
          <p data-i18n-html="rules.p.race2"></p>
        </div>
        <div class="rules-section">
          <h4 data-i18n="rules.h.win"></h4>
          <p data-i18n-html="rules.p.win"></p>
        </div>
        <div class="rules-section prize-box">
          <h4 data-i18n="rules.h.prizes"></h4>
          <p data-i18n-html="rules.p.prizes"></p>
        </div>
      </div>

      <!-- page 2 — the route drawn out, so players can picture the whole race -->
      <div class="rules-page" data-page="2">
        <div class="rules-section">
          <h4 data-i18n="rules.h.map"></h4>
          <p data-i18n-html="rules.p.mapPage"></p>
        </div>
        <div class="rules-map" id="rulesMapWrap"></div>
        <div class="rules-section" style="margin-top:14px;">
          <h4 data-i18n="rules.h.cp"></h4>
          <p data-i18n-html="rules.p.cp"></p>
        </div>
      </div>

      <!-- page 3 — weather -->
      <div class="rules-page" data-page="3">
        <div class="rules-section">
          <h4 data-i18n="rules.h.clear"></h4>
          <p data-i18n-html="rules.p.clear"></p>
        </div>
        <div class="rules-section">
          <h4 data-i18n="rules.h.turb"></h4>
          <p data-i18n-html="rules.p.turb"></p>
        </div>
        <div class="rules-section">
          <h4 data-i18n="rules.h.storm"></h4>
          <p data-i18n-html="rules.p.storm"></p>
        </div>
        <div class="rules-section">
          <h4 data-i18n="rules.h.power"></h4>
          <p data-i18n-html="rules.p.power"></p>
        </div>
      </div>

      <!-- page 4 — the three helps -->
      <div class="rules-page" data-page="4">
        <div class="rules-section">
          <h4 data-i18n="rules.h.helps"></h4>
          <p data-i18n-html="rules.p.helps"></p>
        </div>
        <div class="rules-help-card">
          <div class="circ" id="rulesIconFifty"></div>
          <div>
            <div style="font-weight:700; font-size:14px; margin-bottom:3px;" data-i18n="rules.help.fifty"></div>
            <p style="margin:0; font-size:13px; line-height:1.5; color:rgba(255,255,255,.82);" data-i18n-html="rules.help.fiftyDesc"></p>
          </div>
        </div>
        <div class="rules-help-card">
          <div class="circ" id="rulesIconTurbo"></div>
          <div>
            <div style="font-weight:700; font-size:14px; margin-bottom:3px;" data-i18n="rules.help.turbo"></div>
            <p style="margin:0; font-size:13px; line-height:1.5; color:rgba(255,255,255,.82);" data-i18n-html="rules.help.turboDesc"></p>
          </div>
        </div>
        <div class="rules-help-card">
          <div class="circ" id="rulesIconSeatbelt"></div>
          <div>
            <div style="font-weight:700; font-size:14px; margin-bottom:3px;" data-i18n="rules.help.belt"></div>
            <p style="margin:0; font-size:13px; line-height:1.5; color:rgba(255,255,255,.82);" data-i18n-html="rules.help.beltDesc"></p>
          </div>
        </div>
      </div>

      <!-- page 5 — programme documents -->
      <div class="rules-page" data-page="5">
        <div class="rules-section">
          <h4 data-i18n="rules.h.docs"></h4>
          <p data-i18n="rules.p.docs"></p>
        </div>
        <div class="rules-section" id="rulesDocLinks">
          <p><a class="rules-doc-link" href="https://drive.google.com/file/d/1ZZJ9LvxETVIvqfpECi_8u5FKV55VV3gF/view?usp=drive_link" target="_blank" rel="noopener noreferrer" data-i18n="rules.docs.salesKitVi"></a></p>
          <p><a class="rules-doc-link" href="https://drive.google.com/file/d/1bf9BnmqIJFhusaYeGRvdomtSk2y83oEI/view?usp=sharing" target="_blank" rel="noopener noreferrer" data-i18n="rules.docs.salesKit"></a></p>
          <p style="color:rgba(255,255,255,.5); font-style:italic; font-size:12.5px;" data-i18n="rules.docs.more"></p>
        </div>
      </div>

      <div class="rules-nav">
        <button class="btn btn-ghost btn-sm" id="rulesPrevBtn" onclick="rulesGoPage(rulesPage-1)" data-i18n="rules.back"></button>
        <div class="rules-dots" id="rulesDots"></div>
        <button class="btn btn-primary btn-sm" id="rulesNextBtn" onclick="rulesGoPage(rulesPage+1)"></button>
      </div>
    </div>
  </div>

  <!-- ============ ADMIN PASSWORD GATE ============ -->
  <div id="adminGateModal" class="hidden" style="position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(0,20,40,.6);">
    <div class="glass" style="border-radius:22px;padding:32px 28px;max-width:340px;width:90%;text-align:center;">
      <div style="font-size:30px;margin-bottom:8px;">🔒</div>
      <h3 style="margin:0 0 6px; font-size:19px;" data-i18n="gate.title"></h3>
      <p style="margin:0 0 18px;font-size:13.5px;color:rgba(255,255,255,.65);" data-i18n="gate.desc"></p>
      <input type="text" id="adminPassInput" data-i18n-ph="gate.ph" style="text-align:center;letter-spacing:.2em;" />
      <div id="adminGateError" style="color:#ffb3b3;font-size:12.5px;margin-top:8px;height:14px;"></div>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button class="btn btn-ghost btn-block" onclick="closeAdminGate()" data-i18n="gate.cancel"></button>
        <button class="btn btn-primary btn-block" onclick="submitAdminGate()" data-i18n="gate.enter"></button>
      </div>
    </div>
  </div>

/* Looks up a string in the active language, falling back to English and finally to the
   key itself, so a missing translation degrades to something readable rather than blank.
   {placeholders} in the string are substituted from `vars`. */
function t(key, vars){
  let s = (STR[LANG] && STR[LANG][key]);
  if(s === undefined) s = (STR.en && STR.en[key]);
  if(s === undefined) return key;
  if(vars) Object.keys(vars).forEach(k=>{ s = s.split('{'+k+'}').join(vars[k]); });
  return s;
}
/* Paints every string that lives in the static markup. Elements opt in with
   data-i18n (textContent), data-i18n-html (innerHTML, for strings with <strong> in them),
   data-i18n-ph (placeholder) or data-i18n-title (tooltip). */
function applyStaticI18n(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{ el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('.lang-opt').forEach(b=>{ b.classList.toggle('on', b.dataset.lang===LANG); });
  // this one's label depends on runtime state, not just the language, so it can't be a data-i18n
  if(typeof syncFullscreenBtn === 'function') syncFullscreenBtn();
}
function setLang(l){
  if(LANGS.indexOf(l) < 0 || l === LANG) return;
  LANG = l;
  try{ localStorage.setItem('vna_lang', l); }catch(e){}
  loadQuestions();   // re-reads the bank in the new language, same shuffle order
  applyStaticI18n();
  if(typeof rulesPage !== 'undefined' && !document.getElementById('rulesModal').classList.contains('hidden')) rulesGoPage(rulesPage);
  renderAll();
}
// True "S" route: x traces one sine period (bulge right, then bulge left) while y
// climbs from START at the bottom to FINISH at the top. x/y below are placeholders —
// layoutRouteOnSCurve() overwrites them with points spaced evenly by arc length along
// that same curve, so every leg on the map is the same visual distance apart.
// START / HAN / SPC / SGN / FINISH are the 5 big checkpoint nodes.
// HAN (Turtle Tower) and SGN (Landmark 81) have no matching emoji, so they're inline SVGs.
const ROUTE = [
  {code:'START',  city:'Start',              icon:'🛫', checkpoint:true},
  {code:'CDG',    city:'Paris',              icon:'🗼', checkpoint:false},
  {code:'AMS',    city:'Amsterdam',          icon:'🌷', checkpoint:false},
  {code:'HAN',    city:'Hanoi',              icon:'<svg viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.12em"><rect x="7" y="14" width="10" height="7" rx="1" fill="#fff"/><rect x="9" y="8" width="6" height="6" fill="#fff"/><polygon points="12,3 16,8 8,8" fill="#fff"/><rect x="11.3" y="1" width="1.4" height="2.5" fill="#fff"/></svg>', checkpoint:true},
  {code:'MUC',    city:'Munich',             icon:'🍺', checkpoint:false},
  {code:'MOW',    city:'Moscow',             icon:'🐻', checkpoint:false},
  {code:'SPC',    city:'Special Checkpoint', icon:'⭐', checkpoint:true},
  {code:'LHR',    city:'London',             icon:'🎡', checkpoint:false},
  {code:'MXP',    city:'Milan',              icon:'👗', checkpoint:false},
  {code:'CPH',    city:'Copenhagen',         icon:'🧜‍♀️', checkpoint:false},
  {code:'SGN',    city:'Ho Chi Minh City',   icon:'<svg viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.12em"><rect x="4" y="14" width="2.3" height="8" fill="#fff"/><rect x="7" y="10" width="2.3" height="12" fill="#fff"/><rect x="10" y="6" width="2.3" height="16" fill="#fff"/><rect x="13" y="9" width="2.3" height="13" fill="#fff"/><rect x="16" y="12" width="2.3" height="10" fill="#fff"/><polygon points="11.15,2 12.3,6 10,6" fill="#fff"/></svg>', checkpoint:true},
  {code:'FRA',    city:'Frankfurt',          icon:'🏦', checkpoint:false},
  {code:'FINISH', city:'Finish',             icon:'🏁', checkpoint:true},
];
(function layoutRouteOnSCurve(){
  const AMPLITUDE = 280, CENTER_X = 500, Y_START = 480, Y_END = 95;
  const curveX = t => CENTER_X + AMPLITUDE * Math.sin(2*Math.PI*t);
  const curveY = t => Y_START + (Y_END - Y_START) * t;
  const SAMPLES = 4000;
  const cum = new Array(SAMPLES+1); cum[0] = 0;
  let prevX = curveX(0), prevY = curveY(0);
  for(let i=1;i<=SAMPLES;i++){
    const t = i/SAMPLES, x = curveX(t), y = curveY(t);
    cum[i] = cum[i-1] + Math.hypot(x-prevX, y-prevY);
    prevX = x; prevY = y;
  }
  const total = cum[SAMPLES];
  function tAtArcLength(targetLen){
    let lo=0, hi=SAMPLES;
    while(lo<hi){ const mid=(lo+hi)>>1; if(cum[mid]<targetLen) lo=mid+1; else hi=mid; }
    return lo/SAMPLES;
  }
  const n = ROUTE.length - 1;
  ROUTE.forEach((node,i)=>{
    const t = tAtArcLength((i/n)*total);
    node.x = Math.round(curveX(t)*10)/10;
    node.y = Math.round(curveY(t)*10)/10;
  });
})();

/* The source deck puts the correct answer at position B or C for almost every question,
   which players would spot within a few rounds and then simply always pick. So each question's
   four options get shuffled — but by a PRNG seeded purely from the question id, so every
   phone, the presenter screen and the admin dashboard independently derive the identical
   order with nothing to sync, AND the Vietnamese and English copies of a question end up
   with the answer behind the same letter. Wording and the answer itself are untouched. */
function seededRandom(seed){
  let t = seed >>> 0;
  return function(){
    t += 0x6D2B79F5;
    let x = t;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleOrderFor(id, n){
  const rand = seededRandom(id * 2654435761);
  const order = [];
  for(let i=0;i<n;i++) order.push(i);
  for(let i=order.length-1; i>0; i--){
    const j = Math.floor(rand()*(i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return order;
}
function loadQuestions(){
  QUESTIONS = QUESTION_BANK.map(raw=>{
    const L = raw[LANG] || raw.en;
    const order = shuffleOrderFor(raw.id, L.opts.length);
    return {
      id: raw.id,
      q: L.q,
      explain: L.explain,
      opts: order.map(i=>L.opts[i]),
      correct: order.indexOf(raw.correct),
    };
  });
  QUESTIONS_BY_ID = {};
  QUESTIONS.forEach(q=>{ QUESTIONS_BY_ID[q.id] = q; });
}
loadQuestions();

// Flag *emoji* render as plain two-letter codes on Windows (no flag glyphs in Segoe UI
// Emoji), which is exactly the admin/presenter laptop this app targets — so aircraft
// icons are small inline SVG flags instead, which look identical on every device.
function flagSvg(stripes){
  return '<svg viewBox="0 0 30 20" width="1.3em" height="0.87em" style="vertical-align:-0.15em; border-radius:2px; box-shadow:0 0 0 1px rgba(255,255,255,.35);">'+stripes+'</svg>';
}
const AVATARS = [
  flagSvg('<rect width="30" height="20" fill="#00247d"/><path d="M0 0 L30 20 M30 0 L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0 L30 20 M30 0 L0 20" stroke="#cf142b" stroke-width="2"/><path d="M15 0 V20 M0 10 H30" stroke="#fff" stroke-width="6"/><path d="M15 0 V20 M0 10 H30" stroke="#cf142b" stroke-width="3.6"/>'), // UK
  flagSvg('<rect width="10" height="20" fill="#002395"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ED2939"/>'), // France
  flagSvg('<rect width="30" height="20" fill="#DA251D"/><polygon points="15,4 16.76,9.27 22.5,9.27 17.87,12.73 19.63,18 15,14.55 10.37,18 12.13,12.73 7.5,9.27 13.24,9.27" fill="#FFCD00"/>'), // Vietnam
  flagSvg('<rect width="10" height="20" fill="#008C45"/><rect x="10" width="10" height="20" fill="#F4F5F0"/><rect x="20" width="10" height="20" fill="#CD212A"/>'), // Italy
  flagSvg('<rect width="30" height="20" fill="#fff"/><rect y="6.67" width="30" height="6.66" fill="#0039A6"/><rect y="13.33" width="30" height="6.67" fill="#D52B1E"/>'), // Russia
  flagSvg('<rect width="30" height="20" fill="#AE1C28"/><rect y="6.67" width="30" height="6.66" fill="#fff"/><rect y="13.33" width="30" height="6.67" fill="#21468B"/>'), // Netherlands
  flagSvg('<rect width="30" height="20" fill="#C60C30"/><rect x="9" width="4" height="20" fill="#fff"/><rect y="8" width="30" height="4" fill="#fff"/>'), // Denmark
  flagSvg('<rect width="30" height="6.67" fill="#000"/><rect y="6.67" width="30" height="6.66" fill="#DD0000"/><rect y="13.33" width="30" height="6.67" fill="#FFCE00"/>'), // Germany
]; // UK, France, Vietnam, Italy, Russia, Netherlands, Denmark, Germany

/* ---- game mechanics: question pools, turbo boost, power question, turbulence ---- */
const TURBO_MIN_LEG = ROUTE.findIndex(r=>r.code==='MUC'); // a player unlocks Turbo once their own aircraft reaches MUC
const TURBULENCE_LEGS = [5, 9]; // 0-based leg index = "lượt chơi thứ 6 và thứ 10"
const STORM_LEG = 7; // 0-based leg index = "lượt chơi thứ 8" — ⛈ Storm, ATC clears only the 10 fastest correct answers
function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
// Questions are served straight down the bank in order, and a question that has already
// been asked is never asked again — `questionIndexByLeg` is the record of what's been
// used, so this stays correct across Previous question, Undo, and overtime rounds alike.
// Returns null once the bank is exhausted; every caller treats that as "cannot open".
function usedQuestionIds(){
  return new Set(Object.values(state.questionIndexByLeg || {}).filter(v=>v!==null && v!==undefined));
}
// The Sunshine question is the host's, not the rotation's: it sits in the bank so every
// screen can look it up by id, but the ordinary round never serves it.
function isOrdinaryQuestion(q){ return q.id !== SUNSHINE_QUESTION_ID; }
function pickQuestionIndex(){
  const used = usedQuestionIds();
  const next = QUESTIONS.filter(isOrdinaryQuestion).find(q=>!used.has(q.id));
  return next ? next.id : null;
}
function questionsRemaining(){
  const used = usedQuestionIds();
  return QUESTIONS.filter(isOrdinaryQuestion).filter(q=>!used.has(q.id)).length;
}
function ensureQuestionPicked(){
  // ☀️ Sunshine is armed: this round asks the one question held back for it, whatever was
  // staged before. Swapping currentQuestionIndex is enough to hand the ordinary question
  // back to the pool, because questionIndexByLeg[currentQ] is what marks a question "used".
  if(state.powerQuestionActive){
    if(state.currentQuestionIndex !== SUNSHINE_QUESTION_ID){
      state.currentQuestionIndex = SUNSHINE_QUESTION_ID;
      state.questionIndexByLeg[state.currentQ] = SUNSHINE_QUESTION_ID;
      state.currentCorrectIndex = null;
    }
    return true;
  }
  if(state.currentQuestionIndex===null || state.currentQuestionIndex===undefined){
    // Stepping back to a leg that already had a question reuses that same question
    // rather than burning a fresh one out of the bank.
    const already = state.questionIndexByLeg ? state.questionIndexByLeg[state.currentQ] : null;
    const reusable = (already!==null && already!==undefined && QUESTIONS_BY_ID[already] && already!==SUNSHINE_QUESTION_ID);
    const idx = reusable ? already : pickQuestionIndex();
    if(idx===null) return false;
    state.currentQuestionIndex = idx;
    state.questionIndexByLeg[state.currentQ] = idx;
    state.currentCorrectIndex = null; // only revealed to players once the timer ends
  }
  return true;
}
function isTurbulenceLeg(legIndex){ return TURBULENCE_LEGS.includes(legIndex); }
function isStormLeg(legIndex){ return legIndex === STORM_LEG; }

/* FINAL ROUND: the moment anybody parks on FRA — the last stop before FINISH — the very
   next correct answer lands an aircraft. The sky clears to brilliant sunshine and a
   FINAL ROUND flag goes up beside the weather pill so the room knows the race is about
   to be decided. */
const FINAL_ROUND_LEG = ROUTE.length - 2; // FRA, one leg short of FINISH
function finalRoundActive(){
  if(state.gameState==='finished') return false;
  return Object.values(state.players).some(p=>!p.finishRank && p.position >= FINAL_ROUND_LEG);
}

/* The big weather/event card, shown on BOTH the presenter wall and every player's phone.
   It goes up the instant the host stages a leg with weather on it (pressing "Next question →"
   or arming the Power Question) and runs for WEATHER_ANNOUNCE_MS, after which the question
   text takes its place. Only the small weather pill remains from then on. */
// Does THIS leg carry a warning at all — independent of whether the card is still showing.
function wxKindForLeg(){
  if(isTurbulenceLeg(state.currentQ)) return {
    cls:'wx-turbulence', icon:'🌪', title:t('wx.turb.title'),
    rule:t('wx.turb.rule')
  };
  if(isStormLeg(state.currentQ)) return {
    cls:'wx-storm', icon:'⛈', title:t('wx.storm.title'),
    rule:t('wx.storm.rule')
  };
  if(state.powerQuestionActive) return {
    cls:'wx-power', icon:'⚡', title:t('wx.power.title'),
    rule:t('wx.power.rule')
  };
  return null;
}
/* How long the room waits between the host staging a leg and the question text appearing:
   the full warning window when there is a warning to read, otherwise just a short beat so
   the question doesn't snap up the instant the previous one clears. */
function legStageWait(){
  return wxKindForLeg() ? WEATHER_ANNOUNCE_MS : QUESTION_DELAY_MS;
}
function wxAnnounceActive(){
  return state.gameState==='lobby' && !!state.legAnnouncedAt && !!wxKindForLeg()
    && (Date.now() - state.legAnnouncedAt) < WEATHER_ANNOUNCE_MS;
}
function wxAnnounceFor(){
  return wxAnnounceActive() ? wxKindForLeg() : null;
}
// true once the staging wait has elapsed and the question text may go on screen
function questionPreviewReady(){
  if(!state.legAnnouncedAt) return true; // never staged (e.g. state from an older build)
  return (Date.now() - state.legAnnouncedAt) >= legStageWait();
}
// The map only has 12 legs, but the race keeps asking questions past leg 12 whenever
// fewer than 4 aircraft have reached FINISH yet, so latecomers still get a chance to
// land — those extra rounds are labelled "Overtime" instead of a leg number that would
// read as past the end of the board (e.g. "Leg 13 of 12").
function legLabel(legIndex){
  const totalLegs = ROUTE.length - 1;
  return legIndex < totalLegs ? t('common.legOf',{n:legIndex+1,total:totalLegs}) : t('common.overtime',{n:legIndex+1-totalLegs});
}
/* What the PLAYER's phone calls the current question. The bank holds more questions than
   the route has legs and the host can run overtime, so "Leg 9 of 12" was both wrong and
   confusing on the handset — the player only needs to know which turn is being played.
   The presenter wall and the admin dashboard keep legLabel(): they are steering the
   aircraft along the route and do need the leg number. */

const TIMER_SECONDS = 20;
const ANSWER_CARD_MS = 5000;      // presenter holds the correct answer this long — aircraft stay put until it clears
const URGENT_SECONDS = 5;         // countdown turns red and pulses for the final few seconds
const WEATHER_ANNOUNCE_MS = 10000; // the big turbulence/storm/power card runs this long after "Next question"
const QUESTION_DELAY_MS = 2000;    // beat between staging a normal leg and the question appearing
const FIRST_FINISH_SOLO_MS = 5000; // the first aircraft to land flies in alone, zoomed, before the rest move

const STORAGE_KEY = "vna_sky_race_state_v1";

try { bc = new BroadcastChannel('vna-sky-race'); } catch(e) { bc = null; }

function defaultState(){

    // Cabin Bulletin numbers for the last scored leg, computed by the admin at reveal.
    // The raw answers tree is admin-only (see database.rules.json), so the presenter can
    // never derive these itself — the admin publishes the finished figures instead.
    legBrief: null, // {leg,total,correctCount,fastestName,fastestTime,avgTime}
  };
}

function loadState(){
