  view.classList.toggle('wx-storm', stormy && live);
  view.classList.toggle('wx-power', powerOn && live);

  // the phone mirrors the wall's FINAL ROUND sunshine too
  const finalRound = finalRoundActive() && !turbulent && !stormy;
  view.classList.toggle('final-round-theme', finalRound);

  const want = !visible ? null
    : (turbulent && live) ? 'rain'
    : (stormy && live) ? 'heavyrain'
    : ((powerOn && live) || finalRound) ? 'sun' : null;
  let fx = document.getElementById('playerFx');
  if(!want){ if(fx) fx.remove(); return; }
  if(fx && fx.dataset.kind===want) return; // already showing — don't respawn the drops each tick
  if(fx) fx.remove();
  fx = document.createElement('div');
  fx.id = 'playerFx';
  fx.className = 'player-fx';
  fx.dataset.kind = want;
  if(want==='sun'){
    fx.innerHTML = '<div class="sunny-fx"><div class="sun-ray"></div></div>';
  } else {
    const heavy = want==='heavyrain';
    fx.innerHTML = '<div class="lightning-flash'+(heavy?' thunder-flash':'')+'"></div>' +
      Array.from({length: heavy?24:15}).map(()=>`<div class="rain-drop${heavy?' thunder-drop':''}" style="left:${Math.random()*100}%; animation-delay:${(Math.random()*1.2).toFixed(2)}s; animation-duration:${(0.45+Math.random()*0.4).toFixed(2)}s;"></div>`).join('');
  }
  document.body.appendChild(fx);
}

/* The whole route laid out across the top of the phone instead of a bar of anonymous dots:
   the stop you're parked at is lit up and named, everything else fades back. Stops already
   behind you stay slightly brighter than the ones still ahead, so progress reads at a glance. */
function renderPlayerRouteStrip(me){
  const strip = document.getElementById('pRouteStrip');
  if(!strip) return;
  const pos = me.position;
  strip.innerHTML = ROUTE.map((node,i)=>{
    const cls = i===pos ? 'here' : (i<pos ? 'done' : 'ahead');
    return `<div class="rs-stop ${cls}${node.checkpoint?' cp':''}">
      <div class="rs-slot"><div class="rs-dot">${node.icon}</div></div>
      <div class="rs-code">${node.code}</div>
    </div>`;
  }).join('');
  // keep the lit stop in view once the route runs wider than the phone
  const here = strip.querySelector('.rs-stop.here');
  if(here && strip.scrollWidth > strip.clientWidth){
    strip.scrollLeft = here.offsetLeft - strip.clientWidth/2 + here.offsetWidth/2;
  }
}

/* Top 3 fly business class: the whole phone turns Vietnam Airlines gold, and they're told
   who is breathing down their neck — the point being that a lead is something to defend. */
let _lastCabinTier = null;   // previous tier, so an actual cabin change can be told apart
                             // from the ribbon merely re-rendering with a new chaser name
function renderBizRibbon(me){
  const wrap = document.getElementById('pBizRibbon');
  const view = document.getElementById('view-player');
  const ranked = rankedPlayers();
  const idx = ranked.findIndex(p=>p.id===myPlayerId);
  /* Cabin and prize by standing:
       1st  Business (gold skin)        + Business upgrade voucher
       2nd  Premium Economy (jade skin) — the cabin is the prize
       3rd  Economy (ribbon only)
       4th  standard (ribbon only)      + extra-baggage voucher
       5th  standard (ribbon only)      + extra-baggage voucher
     Only the top two get a full-screen skin — the gold and jade cabins are meant to look
     worth defending — so everything below is the ribbon alone. */
  const enoughPlayers = ranked.length >= 2;
  const tier = !enoughPlayers ? null
    : (idx===0 ? 'biz' : idx===1 ? 'prem' : idx===2 ? 'econ' : (idx===3 || idx===4) ? 'std' : null);
  view.classList.toggle('biz-gold', tier==='biz');
  view.classList.toggle('cabin-premium', tier==='prem');
  if(!tier){ wrap.innerHTML = ''; wrap.dataset.sig = ''; return; }
  const medal = RANK_TROPHY[idx] || '✈️';
  const place = t('biz.place'+(idx+1));
  const chaser = ranked[idx+1];
  let sub;
  if(chaser){
    const gap = (me.position||0) - (chaser.position||0);
    const gapTxt = gap<=0 ? t('biz.level') : (gap===1 ? t('biz.oneLeg') : t('biz.nLegs',{n:gap}));
    sub = t('biz.chasing',{name:escapeHtml(chaser.name), gap:gapTxt});
  } else {
    sub = t('biz.alone');
  }
  const titleKey = tier==='biz' ? 'biz.title'
                 : tier==='prem' ? 'prem.title'
                 : tier==='econ' ? 'econ.title' : 'std.title';
  const cls = tier==='prem' ? 'prem-ribbon'
            : tier==='econ' ? 'econ-ribbon'
            : tier==='std'  ? 'std-ribbon' : '';
  // the voucher each place actually wins, shown on the ribbon
  const voucher = tier==='biz'  ? `<div class="up">🎟 ${t('voucher.upgrade')}</div>`
                : tier==='std'  ? `<div class="up">🧳 ${t('voucher.baggage')}</div>` : '';
  const html = `<div class="biz-ribbon ${cls}">
    <div class="medal">${medal}</div>
    <div><div class="tt">${t(titleKey,{n:place})}</div><div class="sb">${sub}</div>${voucher}</div>
  </div>`;
  // Only touch the DOM when the ribbon actually changed. renderPlayer runs every second, and
  // rewriting innerHTML each time would restart the arrival animation on every tick.
  if(wrap.dataset.sig === html) return;
  const movedCabin = _lastCabinTier !== null && _lastCabinTier !== tier;
  _lastCabinTier = tier;
  wrap.dataset.sig = html;
  wrap.innerHTML = html;
  // an actual change of cabin gets the arrival flourish; a new chaser name does not
  if(movedCabin) wrap.firstElementChild.classList.add('cabin-change');
}

/* The three round help buttons, sitting right under "Select an answer above". */
function renderHelps(me, myAns){
  const wrap = document.getElementById('pHelpsWrap');
  if(!wrap) return;
  const rankHelps = helpsUnlocked();
  const live = canActNow();
  const armedTurbo = !!(myAns && myAns.turbo);
  const armedBelt = !!(myAns && myAns.seatbelt);
  const armedFifty = !!(myAns && myAns.fifty);   // burned on THIS question
  const fiftyGone = !!me.fiftyUsed || armedFifty;
  const boostOk = live && !boostsBlocked();
  const beltOk = live && rankHelps && me_turbulenceActive();
  /* Two different "off" looks, and they must not be confused: `armed` means the player
     picked this help for the question in front of them — the whole button goes solid gold so
     the choice is unmistakable at arm's length. `spent` means it was used in an earlier
     round and is gone for the rest of the game — faded out. A help chosen this round is
     always drawn armed, even once the answer is submitted and the used-flag has gone up. */
  const btn = (ic, lb, spent, armed, disabled, title, fn)=>
    `<button class="help-btn${armed?' armed':(spent?' spent':'')}" ${disabled?'disabled':''} title="${title}" onclick="${fn}"><span class="ic">${ic}</span><span class="lb">${lb}</span></button>`;
  wrap.innerHTML = `<div class="help-row">
    ${btn(HELP_ICONS.fifty,t('h.fifty'), fiftyGone, armedFifty, fiftyGone || !rankHelps || !boostOk,
        fiftyGone?t('h.fiftyUsed'):t('h.fiftyTip'), 'playerUseFifty()')}
    ${btn(HELP_ICONS.turbo,t('h.turbo'), !!me.turboUsed, armedTurbo, !!me.turboUsed || !rankHelps || !boostOk,
        me.turboUsed?t('h.turboUsed'):t('h.turboTip'), 'playerToggleTurbo()')}
    ${btn(HELP_ICONS.seatbelt,t('h.belt'), !!me.seatbeltUsed, armedBelt, !!me.seatbeltUsed || !beltOk,
        me.seatbeltUsed?t('h.beltUsed'):t('h.beltTip'), 'playerToggleSeatbelt()')}
  </div>`;
  let hint = '';
  if(armedTurbo) hint = t('h.armedTurbo');
  else if(armedBelt) hint = t('h.armedBelt');
  else if(me_turbulenceActive()) hint = t('h.turbOnly');
  else if(me_stormActive()) hint = t('h.stormAll');
  else if(state.powerQuestionActive) hint = t('h.powerAll');
  else if(!rankHelps) hint = t('h.locked',{code:ROUTE[TURBO_MIN_LEG].code});
  if(hint) wrap.innerHTML += `<div class="help-hint">${hint}</div>`;
}

function renderPlayer(){
  const stateText = document.getElementById('pStateText');
  if(stateText) stateText.textContent = t('st.'+state.gameState);
  paintPlayerConnDot();

  if(!myPlayerId || !state.players[myPlayerId]){
    document.getElementById('pRegistration').classList.remove('hidden');
    document.getElementById('pGame').classList.add('hidden');
    // drop any skin left over from a previous session, otherwise a reset or a removed
    // player leaves the join screen wearing the gold business-class background
    document.getElementById('view-player').classList.remove('biz-gold','cabin-premium','wx-turbulence','wx-storm','wx-power','final-round-theme');
    const fx = document.getElementById('playerFx'); if(fx) fx.remove();
    _lastCabinTier = null;   // next join starts fresh, with no phantom "you changed cabin"
    return;
  }
  document.getElementById('pRegistration').classList.add('hidden');
  document.getElementById('pGame').classList.remove('hidden');
  const me = state.players[myPlayerId];
  document.getElementById('pAvatarShown').innerHTML = avatarHTML(me.avatar, '1.2em');

  // where you are in the field, and where you physically are on the map
  const ranked = rankedPlayers();
  const myRankIdx = ranked.findIndex(p=>p.id===myPlayerId);
  const myRank = myRankIdx>=0 ? (myRankIdx+1) : '—';
  const here = ROUTE[me.position];
  document.getElementById('pDest').innerHTML = `#${myRank} <span style="font-size:11px; opacity:.6;">${t('p.of',{n:ranked.length})}</span>`;
  document.getElementById('pLocation').innerHTML = `${here.code} <span style="font-size:10.5px; opacity:.6; font-family:var(--font-body);">${escapeHtml(here.city)}</span>`;
  // total answer time — the tie-break when several aircraft land on the same reveal
  document.getElementById('pTotalTime').textContent = formatTime(me.totalAnswerTime);

  renderBizRibbon(me);
  applyPlayerWeatherSkin();

  // the big turbulence/storm/power card between questions — same copy as the presenter wall
  const wxa = wxAnnounceFor();
  const wxWrap = document.getElementById('pWxAnnounce');
  wxWrap.innerHTML = wxa
    ? `<div class="wx-announce ${wxa.cls}"><div class="ic">${wxa.icon}</div><div class="tt">${wxa.title}</div><div class="rl">${wxa.rule}</div></div>`
    : '';

  renderPlayerRouteStrip(me);

  const timerEl = document.getElementById('pTimer');
  const bannerEl = document.getElementById('pStatusBanner');
  const optsEl = document.getElementById('pOptions');
  const eyebrow = document.getElementById('pQEyebrow');
  const qText = document.getElementById('pQText');
  const powerNoteEl = document.getElementById('pPowerNote');
  const stormNoteEl = document.getElementById('pStormNote');
  const helpsWrap = document.getElementById('pHelpsWrap');
  const clearTimer = ()=>{ timerEl.textContent = '--'; timerEl.classList.remove('urgent'); };

  // Once the race is decided, EVERY player gets their own final standing and a sign-off —
  // not just the four who landed. Handled before the finishRank branch so finishers get
  // this version rather than the mid-race "you landed" one.
  if(state.gameState==='finished'){
    const rankedAll = rankedPlayers();
    const idx = rankedAll.findIndex(p=>p.id===myPlayerId);
    const place = idx>=0 ? idx+1 : null;
    const onPodium = place && place<=FINISHERS_TO_END;
    const medal = onPodium ? RANK_TROPHY[place-1] : '✈️';
    eyebrow.textContent = t('p.raceComplete');
    qText.innerHTML = `
      <div style="font-size:40px; line-height:1; margin-bottom:8px;">${medal}</div>
      <div style="font-size:22px; font-weight:800; margin-bottom:4px;">${place ? t('p.placeN',{n:ordinal(place)}) : t('p.raceOver')}</div>
      <div style="font-size:13px; font-weight:600; color:var(--vna-gold-light); margin-bottom:12px;">
        ${onPodium ? t('p.prize'+place) : (place ? t('p.outOf',{n:rankedAll.length}) : '')}
      </div>
      <div style="font-size:14px; font-weight:400; color:rgba(255,255,255,.85); line-height:1.6;">
        ${onPodium ? t('p.congratsPodium') : t('p.congratsOther')}
        <br><br>${t('p.wish')}
      </div>`;
    optsEl.innerHTML=''; bannerEl.classList.add('hidden'); clearTimer();
    if(powerNoteEl) powerNoteEl.classList.add('hidden');
    if(stormNoteEl) stormNoteEl.classList.add('hidden');
    if(helpsWrap) helpsWrap.innerHTML='';
    return;
  }

  // Reaching FINISH is a personal milestone shown the moment it happens — the race
  // itself keeps going for everyone else until at least FINISHERS_TO_END aircraft have landed.
  if(me.finishRank){
    const medal = RANK_TROPHY[me.finishRank-1] || '🏅';
    eyebrow.textContent = t('p.finished');
    qText.innerHTML = `<div style="font-size:21px; font-weight:800; margin-bottom:12px;">${t('p.finishedPlace',{medal:medal, n:ordinal(me.finishRank)})}</div><div style="font-size:14px; font-weight:400; color:rgba(255,255,255,.82); line-height:1.55;">${t('p.finishedMsg')}</div>`;
    optsEl.innerHTML=''; bannerEl.classList.add('hidden'); clearTimer();
    if(powerNoteEl) powerNoteEl.classList.add('hidden');
    if(stormNoteEl) stormNoteEl.classList.add('hidden');
    if(helpsWrap) helpsWrap.innerHTML='';
    return;
  }

  if(state.gameState === 'lobby'){
    // Staged but not opened: everyone reads the question first, with no options and no
    // clock, until the host opens the answers. During the 10s weather card, the card
    // above is the whole message and the question stays hidden.
    const staged = questionStagedOnScreen();
    if(staged){
      eyebrow.textContent = roundLabel(state.currentQ);
      qText.textContent = QUESTIONS_BY_ID[state.currentQuestionIndex].q;
      optsEl.innerHTML = `<div class="p-await">${t('p.awaitAnswers')}</div>`;
    } else {
      const waiting = !!state.legAnnouncedAt;
      eyebrow.textContent = waiting ? roundLabel(state.currentQ) : t('p.waitStart');
      qText.textContent = wxAnnounceActive()
        ? t('p.readWarning')
        : (waiting ? t('p.waitNext') : t('p.waitStartMsg'));
      optsEl.innerHTML = '';
    }
    bannerEl.classList.add('hidden'); clearTimer();
    if(powerNoteEl) powerNoteEl.classList.add('hidden');
    if(stormNoteEl) stormNoteEl.classList.add('hidden');
    // the helps come up with the question, so they are already live while it is being read
    if(staged) renderHelps(me, me.answers[state.currentQ]);
    else if(helpsWrap) helpsWrap.innerHTML='';
    return;
  }
  if(state.currentQuestionIndex===null || state.currentQuestionIndex===undefined){
    eyebrow.textContent = roundLabel(state.currentQ);
    qText.textContent = t('p.waitOpen');
    optsEl.innerHTML=''; bannerEl.classList.add('hidden'); clearTimer();
    if(powerNoteEl) powerNoteEl.classList.add('hidden');
    if(stormNoteEl) stormNoteEl.classList.add('hidden');
    if(helpsWrap) helpsWrap.innerHTML='';
    return;
  }
  const qData = QUESTIONS_BY_ID[state.currentQuestionIndex];
  const powerNow = !!state.powerQuestionActive;
  const stormNow = isStormLeg(state.currentQ);
  eyebrow.innerHTML = roundLabel(state.currentQ) + (powerNow ? ' &nbsp;☀️ '+t('wx.powerTag')+'' : '') + (stormNow ? ' &nbsp;⛈ '+t('wx.stormTag') : '');
  qText.textContent = qData.q;
  if(powerNoteEl) powerNoteEl.classList.toggle('hidden', !powerNow);
  if(stormNoteEl) stormNoteEl.classList.toggle('hidden', !stormNow);

  const myAns = me.answers[state.currentQ];
  const revealed = state.gameState==='reveal';
  // Once the player's own countdown hits 0, no more picks or submits — an unsubmitted
  // answer already scores the same as a wrong one in every leg type (see adminRevealAnswer).
  const timeUp = myTimeUp();
  const struckOut = eliminatedOptions();
  optsEl.innerHTML = '';
  qData.opts.forEach((opt,i)=>{
    const gone = !!(struckOut && struckOut.includes(i));
    const b = document.createElement('button');
    let cls = 'opt-btn';
    if(revealed){
      if(state.currentCorrectIndex!==null && state.currentCorrectIndex!==undefined && i===state.currentCorrectIndex) cls+=' correct';
      else if(myAns && myAns.choice===i) cls+=' wrong';
    } else if(myAns && myAns.choice===i){
      cls+=' picked';
    }
    if(gone && !revealed) cls+=' eliminated';
    b.className = cls;
    const locked = state.gameState!=='question' || (myAns && myAns.submitted) || timeUp || (gone && !revealed);
    b.disabled = locked;
    b.innerHTML = `<span class="k">${String.fromCharCode(65+i)}</span><span>${opt}</span>`;
    b.onclick = ()=> playerSubmitAnswer(i);
    optsEl.appendChild(b);
  });

  paintCountdowns(); // shared clock painter — see paintCountdowns()

  renderHelps(me, myAns);

  // banner + submit button
  bannerEl.classList.remove('hidden','wait','locked','correct','wrong');
  if(state.gameState==='question'){
    if(myAns && myAns.submitted){
      bannerEl.classList.add('locked');
      bannerEl.innerHTML = t('p.locked') + (myAns.turbo?t('p.lockedTurbo'):'') + (myAns.seatbelt?t('p.lockedBelt'):'') + t('p.lockedWait');
    } else if(timeUp){
      bannerEl.classList.add('locked');
      // a pick that was never submitted is locked in automatically at reveal, so say so
      bannerEl.innerHTML = (myAns && myAns.choice!==null && myAns.choice!==undefined)
        ? t('p.timeUpAuto')
        : t('p.timeUpNone');
    } else if(myAns && myAns.choice!==null && myAns.choice!==undefined){
      bannerEl.classList.add('wait');
      bannerEl.innerHTML = `<button class="btn btn-primary btn-block" onclick="playerConfirmSubmit()">Submit answer →</button>
        <div style="font-size:11px; color:rgba(255,255,255,.55); margin-top:7px;">Submit now to bank a faster time — if you don't, this answer locks in when the clock runs out.</div>`;
    } else {
      bannerEl.classList.add('wait');
      bannerEl.innerHTML = t('p.selectAnswer');
    }
  } else if(state.gameState==='locked'){
    bannerEl.classList.add('locked');
    bannerEl.innerHTML = t('p.answersLocked');
  } else if(revealed){
    const correct = myAns && myAns.choice===state.currentCorrectIndex;
    const turbulent = isTurbulenceLeg(state.currentQ);
    let msg;
    if(turbulent){
      if(correct) msg = t('p.rv.turbOk');
      else if(myAns && myAns.seatbelt) msg = t('p.rv.turbBelt');
      else msg = t('p.rv.turbBad');
    } else if(isStormLeg(state.currentQ)){
      const cleared = !!(state.stormClearedIds && state.stormClearedIds.includes(myPlayerId));
      msg = cleared ? t('p.rv.stormOk') : (correct ? t('p.rv.stormSlow') : t('p.rv.stormBad'));
    } else if(state.powerQuestionActive){
      msg = correct ? t('p.rv.powerOk') : t('p.rv.powerBad');
    } else if(myAns && myAns.turbo){
      msg = correct ? t('p.rv.turboOk') : t('p.rv.turboBad');
    } else {
      msg = correct ? t('p.rv.ok') : (myAns ? t('p.rv.bad') : t('p.rv.none'));
    }
    bannerEl.classList.add(correct ? 'correct':'wrong');
    bannerEl.innerHTML = msg;
  }
}

/* ============================================================
   PRESENTER VIEW
   ============================================================ */
function buildRouteSvg(){
  const svg = document.getElementById('routeSvg');
  svg.setAttribute('viewBox','0 0 '+MAP_W+' '+MAP_H);
  /* Two strokes, not one. The old 3px/gap-11 dotted line was tuned for a flat gradient
     backdrop; over the illustrated map it disappeared entirely against bright water and
     sand. A dark casing goes down first so the gold reads on light AND dark terrain, then
     the bright dashed line on top, matching the reference artwork.
     The route is drawn leg by leg rather than as one polyline so the HAN and SGN detours
     (any leg touching a sub-stop) can be drawn thinner — the eye should still follow the
     main line around the islands and read the spurs as local hops off it. */
  let legs = '';
  for(let i=0;i<ROUTE.length-1;i++){
    const a = ROUTE[i], b = ROUTE[i+1];
    const spur = a.sub || b.sub;
    const w = spur ? 3.4 : 5;
    const dash = spur ? '7 9' : '11 13';
    legs += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="rgba(20,35,60,.55)"
               stroke-width="${spur ? 6.5 : 9}" stroke-linecap="round"/>`;
    legs += `<line class="leg-gold" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#FFD54A"
               stroke-width="${w}" stroke-dasharray="${dash}" stroke-linecap="round" filter="url(#glow)"
               opacity="${spur ? .85 : 1}"/>`;
  }
  svg.innerHTML = `
    <defs>
      <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    ${legs}
  `;

  const airportLayer = document.getElementById('airportLayer');
  airportLayer.innerHTML = '';
  ROUTE.forEach((a,idx)=>{
    const node = document.createElement('div');
    node.className = 'airport-node' + (a.checkpoint ? ' checkpoint':'') + (a.sub ? ' sub':'');
    node.style.left = (a.x/MAP_W*100)+'%';
    node.style.top = (a.y/MAP_H*100)+'%';
    node.innerHTML = `<div class="airport-dot"><span class="airport-icon">${a.icon}</span></div><div class="airport-label"><div class="code">${a.code}</div><div class="city">${a.city}</div></div>`;
    node.addEventListener('mouseenter', ()=>{ presHoveredLeg = idx; renderPresenterLeaderboard(); });
    node.addEventListener('mouseleave', ()=>{ presHoveredLeg = null; renderPresenterLeaderboard(); });
    // every stop is also a camera — click to push in, click again to pull back out
    node.addEventListener('click', ()=>setPresenterCamStop(idx));
    node.title = t('cam.stopTip',{code:a.code});
    airportLayer.appendChild(node);
  });
}
buildRouteSvg();
// which leg's checkpoint the mouse is currently over on the presenter map — filters the
// live leaderboard down to just the players parked there until the mouse moves away
let presHoveredLeg = null;

// Keyed by player id (top-5 named tokens) or by leg position (the '+N others' aggregate
// bucket) and reused across renders, so the CSS left/top transition on .plane-token can
// actually animate a glide to the new spot on reveal — a token that never changes its
// key keeps its element, so an unmoved aircraft has nothing to transition and stays put.
// Stylised gradient + floating watermark per stop, keyed to whoever currently leads —
// not a fully illustrated scene, just a tasteful CSS-only mood shift per city.
const LOCATION_THEMES = {
  START:  {cls:'',            icon:'🛫'},
  CDG:    {cls:'scene-cdg',   icon:'🗼'},
  AMS:    {cls:'scene-ams',   icon:'🌷'},
  HAN:    {cls:'scene-han',   icon:'🪷'},
  MUC:    {cls:'scene-muc',   icon:'🍺'},
  MOW:    {cls:'scene-mow',   icon:'❄️'},
  SPC:    {cls:'scene-spc',   icon:'⭐'},
  LHR:    {cls:'scene-lhr',   icon:'🎡'},
  MXP:    {cls:'scene-mxp',   icon:'⛪'},
  CPH:    {cls:'scene-cph',   icon:'🧜‍♀️'},
  SGN:    {cls:'scene-sgn',   icon:'🛵'},
  FRA:    {cls:'scene-fra',   icon:'🏦'},
  FINISH: {cls:'scene-finish',icon:'🏁'},
};
const ALL_SCENE_CLASSES = Object.values(LOCATION_THEMES).map(t=>t.cls).filter(Boolean);

/* Sizes the artwork so it COVERS the map panel — reaching all four edges of the rounded
   border with no letterbox — while keeping its true aspect ratio. Whatever spills past the
   panel is clipped by .map-stage.
   Done in JS rather than with `background-size:cover` because the pins are positioned as
   percentages of the artwork: cover-cropping the background alone would leave those
   percentages measured against an uncropped box and slide every pin off its landmark. Sizing
   the element itself keeps the pins and the image in the same coordinate space.
   In practice the panel's aspect is within a couple of percent of the artwork's, so the crop
   is slight — but this stays correct on any wall shape. Cheap enough for the render loop. */
function fitMapStage(){
  const panel  = document.getElementById('mapPanel');
  const canvas = document.getElementById('mapCanvas');
  if(!panel || !canvas) return;
  const availW = panel.clientWidth, availH = panel.clientHeight;
  if(!(availW > 0 && availH > 0)) return;
  const ar = MAP_W / MAP_H;
  let w = availW, h = availW / ar;
  if(h < availH){ h = availH; w = availH * ar; }   // grow until BOTH axes are covered
  const wpx = Math.ceil(w)+'px', hpx = Math.ceil(h)+'px';
  if(canvas.style.width !== wpx)  canvas.style.width  = wpx;
  if(canvas.style.height !== hpx) canvas.style.height = hpx;
}
window.addEventListener('resize', fitMapStage);

/* ---------- LIVING MAP ----------
   Sailing boats, flocks of birds and a few extra clouds, matched to the artwork so the island
   world looks inhabited rather than painted. Built once; from then on it is pure CSS
   animation, so it costs nothing per frame in JS.

   SHIPPING_LANES are not guesses: the background was sampled on a 50x33 grid and classified
   by pixel colour (blue clearly dominant, not near-white), and these are stretches that came
   back as open water end to end. Anything eyeballed here would end up sailing over an island.
   Coordinates are percentages of the map, so they hold at any wall size. */
const SHIPPING_LANES = [
  { top:91.5, x0:37, x1:63, secs:[150,210], scale:1.00 },  // wide bay along the bottom
  { top:63.0, x0:45, x1:65, secs:[130,180], scale:0.92 },  // channel below the Special Checkpoint
  { top:35.5, x0:29, x1:43, secs:[120,170], scale:0.85 },  // water between Milan and London
  { top:83.5, x0:82, x1:95, secs:[140,190], scale:0.88 },  // eastern strait past Hanoi
  { top: 4.5, x0:52, x1:77, secs:[190,260], scale:0.62 },  // far horizon, small with distance
];
function boatSvg(w){
  return `<svg width="${w}" height="${Math.round(w*0.9)}" viewBox="0 0 40 36" aria-hidden="true">
    <path d="M19 4 L19 23 L7 23 Z" fill="#fdfdfd" opacity=".95"/>
    <path d="M21 9 L21 23 L31 23 Z" fill="#eef4fb" opacity=".9"/>
    <path d="M4 24 L36 24 L31 30 L9 30 Z" fill="#2d3d55"/>
    <rect x="18.4" y="3" width="1.2" height="21" fill="#4a5b74"/>
  </svg>`;
}
function birdsSvg(n, w){
  let g = '';
  for(let i=0;i<n;i++){
    const bx = i*w*0.85, by = (i%2 ? w*0.42 : 0) + (i===2 ? w*0.2 : 0);
    g += `<path class="bd" d="M0 4 Q3 0 6 4 Q3 2.2 0 4Z" transform="translate(${bx.toFixed(1)},${by.toFixed(1)}) scale(${(w/7).toFixed(2)})" fill="rgba(38,52,74,.62)"/>`;
  }
  return `<svg width="${Math.round(n*w)}" height="${Math.round(w*1.6)}" viewBox="0 0 ${n*w} ${w*1.6}" aria-hidden="true">${g}</svg>`;
}
function initMapLife(){
  const layer = document.getElementById('mapLife');
  if(!layer || layer.dataset.built) return;
  layer.dataset.built = '1';
  const rnd = (a,b)=>a + Math.random()*(b-a);
  const add = (cls, html, o)=>{
    const el = document.createElement('div');
    el.className = cls;
    el.innerHTML = html;
    el.style.top = o.top+'%';
    el.style.setProperty('--x0', o.x0+'%');
    el.style.setProperty('--x1', o.x1+'%');
    el.style.setProperty('--op', o.op);
    if(o.flip) el.style.setProperty('--flip', -1);
    // one duration drives drift, fade and any bob/flap together, so they never desynchronise
    el.style.animationDuration = o.secs+'s';
    el.style.animationTimingFunction = 'linear';
    el.style.animationIterationCount = 'infinite';
    el.style.animationDelay = (-Math.random()*o.secs)+'s';
    layer.appendChild(el);
    return el;
  };

  // boats — one per lane, half of them sailing the other way
  SHIPPING_LANES.forEach((ln, i)=>{
    const back = i % 2 === 1;
    add('mv-boat', boatSvg(Math.round(rnd(15,21)*ln.scale)), {
      top: ln.top, x0: back?ln.x1:ln.x0, x1: back?ln.x0:ln.x1,
      secs: rnd(ln.secs[0], ln.secs[1]), op: rnd(.55,.8), flip: back
    });
  });
  // a couple of extra clouds drifting right across, low and slow
  for(let i=0;i<3;i++){
    const w = rnd(90,190);
    add('mv-cloud',
      `<svg width="${w}" height="${w*0.4}" viewBox="0 0 200 80"><ellipse cx="60" cy="50" rx="55" ry="26" fill="#fff"/><ellipse cx="112" cy="36" rx="46" ry="29" fill="#fff"/><ellipse cx="152" cy="52" rx="40" ry="23" fill="#fff"/></svg>`,
      { top: rnd(4,68), x0:-22, x1:112, secs: rnd(150,260), op: rnd(.16,.3) });
  }
  // flocks, high up and unhurried
  for(let i=0;i<3;i++){
    const back = i === 1;
    add('mv-birds', birdsSvg(Math.round(rnd(3,5)), rnd(6,10)), {
      top: rnd(6,42), x0: back?106:-8, x1: back?-8:106,
      secs: rnd(95,150), op: rnd(.4,.6), flip: back
    });
  }
}

/* ============================================================
   PRESENTER AMBIENCE — clear-skies daylight, tiny background life, camera
   Everything below is decoration on the presenter wall only. None of it touches game state,
   and all of it is skipped while the presenter view is hidden, so a player's phone never
   pays for animations nobody is looking at.
   ============================================================ */

/* The sun sits off the top-right corner (see .sun-corner), so "sunlit" means high-x, low-y in
   the MAP_W x MAP_H route coordinate space. The falloff is normalised between two explicit
   distances rather than from a single radius: the route only ever comes within ~480 of the
   sun and never goes past ~840, so a plain 1 - d/reach curve compressed every stop into the
   dim end of the range and nothing visibly caught the light. NEAR/FAR stretch that real band
   across the full 0-1, which is what makes flying east actually look like flying into the sun.
   Re-checked against the island-map coordinates: the stops still spread 0.00 (START, MXP, CPH)
   to 1.00 (FINISH), with HAN/MUC/MOW/FINISH bright enough to throw a flare. */
const SUN_POINT = { x: 1010, y: -60 };
const SUN_NEAR = 480;   // at or inside this distance: fully lit
const SUN_FAR  = 840;   // at or beyond this distance: fully shaded
function sunlitAmount(x, y){
  const d = Math.hypot(x - SUN_POINT.x, y - SUN_POINT.y);
  return Math.max(0, Math.min(1, (SUN_FAR - d) / (SUN_FAR - SUN_NEAR)));
}
// Is the sky currently clear? Any weather or event owns the panel instead.
function skyIsClear(){
  return !isTurbulenceLeg(state.currentQ) && !isStormLeg(state.currentQ) && !state.powerQuestionActive;
}
function updateSkyAmbience(){
  const el = document.getElementById('skyAmbience');
  if(!el) return;
  el.classList.toggle('hidden', !skyIsClear());
}

/* Turbo Boost → the whole sky accelerates. Every client watches the broadcast leg brief
   rather than the answers tree (which only the admin may read), so the presenter wall reacts
   to a boost it can't otherwise see. Keyed on the leg so one round bumps the sky once, and
   the aircraft only start gliding after the answer card clears — which is exactly when the
   speed-up should land, so it is delayed to match. */
let _skyBumpedForLeg = null;
function tickSkyForTurbo(){
  const brief = state.legBrief;
  if(!brief || !brief.turboCount){ return; }
  if(_skyBumpedForLeg === brief.leg) return;
  _skyBumpedForLeg = brief.leg;
  const wait = Math.max(0, ANSWER_CARD_MS - (state.revealAt ? Date.now()-state.revealAt : ANSWER_CARD_MS));
  setTimeout(()=>bumpSkySpeed(6000), wait);
}

/* Lens flare when an aircraft crosses the sunlit corner. Fired from renderPresenterPlanes
   on the transition into the bright zone only — holding position under the sun must not
   re-trigger it every second, so the last state per player is remembered. */
const _lastLitByPlayer = {};
// Calibrated against the actual route: only the three brightest stops (HAN, MUC, FINISH)
// clear this, so a flare stays an occasional highlight rather than a per-round effect.
const FLARE_THRESHOLD = 0.82;
function maybeFlare(playerId, x, y, lit){
  const was = _lastLitByPlayer[playerId] || 0;
  _lastLitByPlayer[playerId] = lit;
  if(!(lit >= FLARE_THRESHOLD && was < FLARE_THRESHOLD)) return;
  if(!skyIsClear()) return;
  const host = document.getElementById('skyAmbience');
  if(!host || host.classList.contains('hidden')) return;
  const f = document.createElement('div');
  f.className = 'lens-flare';
  f.style.left = (x/MAP_W*100)+'%';
  f.style.top  = (y/MAP_H*100)+'%';
  f.innerHTML = '<div class="core"></div><div class="streak"></div>'
    + '<div class="ghost" style="left:38%; top:44%; width:13px; height:13px;"></div>'
    + '<div class="ghost" style="left:64%; top:58%; width:8px; height:8px; opacity:.6;"></div>';
  host.appendChild(f);
  setTimeout(()=>f.remove(), 1200);
}

/* Tiny background life — a distant bird, a speck of far-off traffic, a stray contrail.
   One every 15-25s, never while weather owns the sky, never while the presenter is hidden.
   Deliberately too small and too faint to compete with the race for attention. */
const TINY_OBJECTS = [
  { cls:'tiny-bird',  html:()=>'🐦', top:[8,42],  secs:[16,26] },
  { cls:'tiny-bird',  html:()=>'🕊', top:[10,38], secs:[18,28] },
  { cls:'tiny-jet',   html:()=>'✈️', top:[6,30],  secs:[13,20] },
  { cls:'tiny-trail', html:()=>'',   top:[5,34],  secs:[11,17], width:[40,90] },
];
let _tinyTimer = null;
function spawnTinyObject(){
  const host = document.getElementById('skyAmbience');
  const presenterVisible = !document.getElementById('view-presenter').classList.contains('hidden');
  if(!host || !presenterVisible || !skyIsClear()) return;
  const spec = TINY_OBJECTS[Math.floor(Math.random()*TINY_OBJECTS.length)];
  const el = document.createElement('div');
  el.className = 'tiny-obj ' + spec.cls;
  const rightToLeft = Math.random() < 0.35;
  const secs = spec.secs[0] + Math.random()*(spec.secs[1]-spec.secs[0]);
  el.style.top = (spec.top[0] + Math.random()*(spec.top[1]-spec.top[0])) + '%';
  el.style.left = rightToLeft ? '105%' : '-8%';
  el.style.setProperty('--cross', rightToLeft ? '-118vw' : '118vw');
  el.style.animationDuration = secs+'s';
  if(spec.width) el.style.width = (spec.width[0] + Math.random()*(spec.width[1]-spec.width[0])) + 'px';
  if(spec.cls==='tiny-jet' && rightToLeft) el.style.transform = 'scaleX(-1)';
  el.innerHTML = spec.html();
  host.appendChild(el);
  setTimeout(()=>el.remove(), secs*1000 + 500);
}
function scheduleTinyObject(){
  clearTimeout(_tinyTimer);
  const wait = 15000 + Math.random()*10000;   // 15-25s, per the brief
  _tinyTimer = setTimeout(()=>{ spawnTinyObject(); scheduleTinyObject(); }, wait);
}
scheduleTinyObject();

/* ---------- camera system ----------
   CAM 1 whole race · CAM 2 the leader · CAM 3 the busiest stretch of airspace · plus every
   stop on the map is itself a camera: click a pin to push in on it.
   The map already has one transform-driven zoom (#mapZoomWrap), which the landing
   cinematics also drive. Those outrank the camera: while one is running the selector greys
   out and applyCamera() no-ops, then the camera reasserts itself the moment it is released. */
let presCam = 1;
let presCamStop = null;              // route index when a pin is the camera; null otherwise
const CAM_ZOOM = { 1: 1, 2: 1.85, 3: 1.6 };
const CAM_STOP_ZOOM = 2.1;           // a single stop is tighter than the group shots
let _finishCamHoldUntil = 0;         // set by triggerFinishCinematic while it owns the map
function cinematicOwnsCamera(){
  return _soloZoomOn || Date.now() < _finishCamHoldUntil;
}
// Where CAM 2 / CAM 3 should point, in route coordinates — or null if there's nothing to see.
function cameraTarget(){
  // a pin camera outranks the three group cameras and needs no players to aim at
  if(presCamStop !== null && ROUTE[presCamStop]){
    return { x: ROUTE[presCamStop].x, y: ROUTE[presCamStop].y };
  }
  const players = Object.values(state.players);
  if(!players.length) return null;
  if(presCam === 2){
    const leader = rankedPlayers()[0];
    if(!leader) return null;
    const n = ROUTE[displayPosition(leader)];
    return n ? { x:n.x, y:n.y } : null;
  }
  if(presCam === 3){
    // busiest airspace = the stop with the most aircraft; ties go to the one further along,
    // because that is the end of the field the room actually cares about
    const byPos = {};
    players.forEach(p=>{ const d = displayPosition(p); byPos[d] = (byPos[d]||0) + 1; });
    let best = null, bestN = 0;
    Object.keys(byPos).forEach(k=>{
      const pos = +k;
      if(byPos[pos] > bestN || (byPos[pos] === bestN && pos > best)){ bestN = byPos[pos]; best = pos; }
    });
    const n = (best===null) ? null : ROUTE[best];
    return n ? { x:n.x, y:n.y } : null;
  }
  return null;
}
function applyCamera(){
  const wrap = document.getElementById('mapZoomWrap');
  const sw = document.getElementById('camSwitch');
  if(sw) sw.classList.toggle('cam-locked', cinematicOwnsCamera());
  if(!wrap || cinematicOwnsCamera()) return;
  if(presCam === 1 && presCamStop === null){
    wrap.style.transformOrigin = '50% 50%';
    wrap.style.transform = 'scale(1)';
    return;
  }
  const target = cameraTarget();
  if(!target){ wrap.style.transformOrigin = '50% 50%'; wrap.style.transform = 'scale(1)'; return; }
  wrap.style.transformOrigin = (target.x/MAP_W*100)+'% '+(target.y/MAP_H*100)+'%';
  wrap.style.transform = 'scale('+(presCamStop!==null ? CAM_STOP_ZOOM : CAM_ZOOM[presCam])+')';
}
function setPresenterCam(n){
  presCam = n;
  presCamStop = null;              // picking a group camera releases the pin camera
  if(n!==1 && !Object.keys(state.players).length) toast(t('cam.noPlayers'));
  else toast(t('cam.switched',{name:t('cam.'+n+'.tip')}));
  syncCamButtons();
  applyCamera();
}
/* Every stop doubles as a camera. Clicking the pin that is already the camera releases it and
   goes back to the wide shot, so the host can get out with a second click on the same target
   instead of hunting for CAM 1. */
function setPresenterCamStop(idx){
  if(!ROUTE[idx]) return;
  if(presCamStop === idx){
    presCamStop = null;
    toast(t('cam.switched',{name:t('cam.1.tip')}));
  } else {
    presCamStop = idx;
    toast(t('cam.stopped',{code:ROUTE[idx].code, city:ROUTE[idx].city}));
  }
  syncCamButtons();
  applyCamera();
}
function syncCamButtons(){
  ['1','2','3'].forEach(k=>{
    const b = document.getElementById('camBtn'+k);
    if(!b) return;
    b.textContent = t('cam.'+k);
    b.title = t('cam.'+k+'.tip');
    // while a pin is the camera, none of the three group cameras is the active one
    b.classList.toggle('active', presCamStop===null && String(presCam)===k);
  });
  // ring the pin that is currently being filmed
  document.querySelectorAll('#airportLayer .airport-node').forEach((el,i)=>{
    el.classList.toggle('cam-on', presCamStop===i);
  });
}

/* ============================================================
   EVENT FEED — the rolling commentary along the bottom of the presenter wall
   Every story is derived from state the presenter can already see, so nothing new has to be
   synced. Each builder returns null when its story doesn't apply right now, and the whole
   list is filtered — so the feed narrows gracefully to "waiting for players" in an empty
   lobby and widens to a dozen stories mid-race, without ever emitting a half-filled
   sentence. Order is deliberate: the standings lead, then what just happened, then colour.
   ============================================================ */
function gapText(n){
  return n===1 ? t('feed.gapOne') : t('feed.gapLegs',{n:n});
}
// Ranking as it stood BEFORE the last reveal, read out of the undo snapshot the admin writes
// for exactly this leg — that's what makes "who overtook whom" possible without extra sync.
function previousRanking(){
  if(!state.undoSnapshot || !state.undoSnapshot.players) return null;
  const snap = state.undoSnapshot.players;
  const ids = Object.keys(state.players).filter(id=>snap[id]);
  if(!ids.length) return null;
  return ids.map(id=>({ id, position: snap[id].position||0, totalAnswerTime: snap[id].totalAnswerTime||0,
                        finishRank: snap[id].finishRank||null }))
    .sort((a,b)=>{
      if(a.finishRank && b.finishRank) return a.finishRank - b.finishRank;
      if(a.finishRank) return -1;
      if(b.finishRank) return 1;
      return b.position - a.position || a.totalAnswerTime - b.totalAnswerTime;
    })
    .map(x=>x.id);
}
function buildEventFeed(){
  const nm = p => escapeHtml(p.name);
  const ranked = rankedPlayers();
  const players = Object.values(state.players);
  const stories = [];
  const push = (cls, icon, html)=>{ if(html) stories.push({cls, icon, html}); };

  if(!players.length){
    push('', '⏳', t('feed.waiting'));
    push('', '📋', t('feed.bank',{n:questionsRemaining()}));
    return stories;
  }
  if(state.gameState==='finished'){
    push('hot', '🏁', t('feed.raceDone'));
  }

  // ---- the standings ----
  // Gap stories only make sense between aircraft that are still flying: once someone has
  // landed, their position is pinned at FINISH, so comparing legs would report a finisher as
  // "neck and neck" with another finisher. Landed aircraft get their landing story instead.
  const racing = ranked.filter(p=>!p.finishRank);
  const leader = ranked[0], second = ranked[1], third = ranked[2];
  if(leader){
    const node = ROUTE[leader.position];
    const gapToSecond = (second && !leader.finishRank && !second.finishRank) ? leader.position - second.position : null;
    if(gapToSecond !== null && gapToSecond >= 2) push('', '🥇', t('feed.leaderAlone',{name:nm(leader), gap:gapText(gapToSecond)}));
    else push('', '🥇', t('feed.leader',{name:nm(leader), code:node.code, city:node.city}));
  }
  if(second && !second.finishRank && !leader.finishRank){
    const gap = leader.position - second.position;
    if(gap === 0) push('hot', '⚔️', t('feed.neck',{name:nm(second)}));
    else if(gap === 1) push('hot', '🔥', t('feed.chasing',{name:nm(second), gap:gapText(gap)}));
    else push('', '🥈', t('feed.second',{name:nm(second), gap:gapText(gap)}));
  } else if(racing.length >= 2){
    // Some have landed, so the race for the lead is settled — the live story is the fight for
    // the places still open. The gap is against the leading *racer*, so the copy names them
    // rather than saying "the leader", who is already on the ground.
    const first = racing[0], next = racing[1];
    const gap = first.position - next.position;
    if(gap === 0) push('hot', '⚔️', t('feed.raceNeck',{a:nm(next), b:nm(first)}));
    else push('hot', '🔥', t('feed.raceGap',{a:nm(next), b:nm(first), gap:gapText(gap)}));
  }
  if(third && !third.finishRank) push('', '🥉', t('feed.third',{name:nm(third), code:ROUTE[third.position].code}));
  // Only worth calling out when there's a real tail to speak of — with two aircraft left
  // still flying, "currently last" is just the chaser again under a different headline.
  if(racing.length >= 3){
    const last = racing[racing.length-1];
    if(last && last.id !== leader.id) push('', '🐢', t('feed.slowest',{name:nm(last), code:ROUTE[last.position].code}));
  }

  // ---- leader's run to the line ----
  if(leader && !leader.finishRank){
    const legsLeft = (ROUTE.length-1) - leader.position;
    if(legsLeft === 1) push('hot', '🛬', t('feed.etaOne',{name:nm(leader)}));
    else if(legsLeft > 1) push('', '🛬', t('feed.eta',{name:nm(leader), n:legsLeft}));
  }
  if(finalRoundActive()) push('hot', '☀️', t('feed.finalRound'));
  const landed = ranked.filter(p=>p.finishRank).sort((a,b)=>a.finishRank-b.finishRank);
  landed.slice(0,FINISHERS_TO_END).forEach(p=>{
    push('hot', RANK_TROPHY[p.finishRank-1] || '🏁', t('feed.landed',{name:nm(p), rank:ordinal(p.finishRank)}));
  });
  if(landed.length && landed.length < FINISHERS_TO_END){
    push('', '🏁', t('feed.slotsLeft',{n:FINISHERS_TO_END - landed.length}));
  }

  // ---- what just happened on the last scored round ----
  const brief = state.legBrief;
  if(brief){
    const legNo = brief.leg + 1;
    const total = brief.total || players.length;
    if(brief.correctCount === 0) push('hot', '❌', t('feed.noneCorrect',{leg:legNo}));
    else if(brief.correctCount === total && total > 1) push('hot', '✅', t('feed.allCorrect',{leg:legNo, n:total}));
    else push('', '✅', t('feed.correctCount',{leg:legNo, n:brief.correctCount, total:total}));
    if(brief.fastestName){
      push('', '⚡', t('feed.fastest',{leg:legNo, name:escapeHtml(brief.fastestName), time:formatTime(brief.fastestTime)}));
    }
    if(brief.turboCount) push('hot', '🚀', t('feed.turbo',{n:brief.turboCount}));
    if(typeof brief.avgTime === 'number'){
      const label = brief.avgTime < 7000 ? t('brief.paceFast') : brief.avgTime < 14000 ? t('brief.paceSteady') : t('brief.paceSlow');
      push('', '⏱', t('feed.pace',{label:label, time:formatTime(brief.avgTime)}));
    }
    // overtakes: whose rank improved past somebody else's since the pre-reveal snapshot
    const prev = previousRanking();
    if(prev){
      const now = ranked.map(p=>p.id);
      const passes = [];
      now.forEach((id, i)=>{
        const was = prev.indexOf(id);
        if(was > i){
          const passed = prev.slice(i, was).filter(x=>now.indexOf(x) > i);
          if(passed.length && state.players[id] && state.players[passed[0]]){
            passes.push({ a: state.players[id], b: state.players[passed[0]] });
          }
        }
      });
      if(passes.length === 1) push('hot', '↗️', t('feed.overtake',{a:nm(passes[0].a), b:nm(passes[0].b)}));
      else if(passes.length > 1) push('hot', '↕️', t('feed.overtakeMulti',{n:passes.length}));
    }
  }

  // ---- accuracy, streaks, milestones ----
  const answered = players.filter(p=>(p.answeredCount||0) > 0);
  if(answered.length){
    const best = answered.slice().sort((a,b)=>
      (b.correctCount/b.answeredCount) - (a.correctCount/a.answeredCount) || b.correctCount - a.correctCount)[0];
    push('', '🎯', t('feed.accuracy',{name:nm(best), pct:Math.round(best.correctCount/best.answeredCount*100),
                                      n:best.correctCount, total:best.answeredCount}));
  }
  const hottest = players.slice().sort((a,b)=>(b.currentStreak||0)-(a.currentStreak||0))[0];
  if(hottest && (hottest.currentStreak||0) >= 3) push('hot', '🔥', t('feed.streak',{name:nm(hottest), n:hottest.currentStreak}));
  ['HAN','SPC','SGN'].forEach(code=>{
    const id = state.milestones && state.milestones[code];
    const p = id && state.players[id];
    if(p) push('', '🏅', t('feed.milestone',{name:nm(p), code:code}));
  });

  // ---- where the traffic is ----
  const byPos = {};
  players.forEach(p=>{ byPos[p.position] = (byPos[p.position]||0) + 1; });
  let busyPos = null, busyN = 1;
  Object.keys(byPos).forEach(k=>{ if(byPos[+k] > busyN){ busyN = byPos[+k]; busyPos = +k; } });
  if(busyPos !== null){
    push('', '📍', t('feed.busiest',{code:ROUTE[busyPos].code, city:ROUTE[busyPos].city, n:busyN}));
  }

  // ---- weather + housekeeping ----
  if(isTurbulenceLeg(state.currentQ)) push('wx', '🌪', t('feed.wxTurb'));
  else if(isStormLeg(state.currentQ)) push('wx', '⛈', t('feed.wxStorm'));
  else if(state.powerQuestionActive) push('wx', '☀️', t('feed.wxSun'));
  else push('wx', '🌈', t('feed.wxClear'));
  if(state.gameState==='lobby' && !state.legBrief) push('', '✈️', t('feed.lobbyReady',{n:players.length}));
  push('', '📋', t('feed.bank',{n:questionsRemaining()}));
  return stories;
}

/* The ticker itself. Two identical copies of the story list are laid end to end and the
   track slides exactly -50%, so the wrap is invisible. Content is only swapped at that wrap
   (the animationiteration event), which is what stops the text jumping mid-sentence when a
   reveal lands — the alternative, rebuilding on every 1s render, made it unreadable. */
const TICKER_PX_PER_SEC = 85;   // reading pace on a wall, not a phone
let _tickerPending = true;      // a rebuild is due at the next wrap
let _tickerHTML = '';
function eventFeedHTML(){
  const stories = buildEventFeed();
  if(!stories.length) return '';
  return stories.map(s=>
    `<span class="ticker-item ${s.cls}"><span class="ic">${s.icon}</span><span>${s.html}</span></span><span class="ticker-sep">◆</span>`
  ).join('');
}
function refreshEventFeed(force){
  const track = document.getElementById('tickerTrack');
  if(!track) return;
  const html = eventFeedHTML();
  if(!html){ track.innerHTML = ''; return; }
  if(!force && html === _tickerHTML) return;
  _tickerHTML = html;
  track.innerHTML = html + html;   // two copies -> seamless -50% loop
  // duration from the real rendered width, so long and short feeds scroll at the same speed
  const half = track.scrollWidth / 2;
  track.style.animation = 'none';
  void track.offsetWidth;          // reflow, so restarting the animation actually takes
  track.style.animationName = 'tickerScroll';
  track.style.animationDuration = Math.max(12, half / TICKER_PX_PER_SEC) + 's';
  track.style.animationTimingFunction = 'linear';
  track.style.animationIterationCount = 'infinite';
}
/* The ticker's left-hand flag doubles as the presenter's sync indicator, replacing the
   floating corner badge on this screen. Red LIVE + player count when synced; amber OFFLINE
   when the room is running off one laptop; grey while connecting. The colour has to change
   too — a red "LIVE" flag while actually offline would tell the room the opposite of true. */
function paintTickerFlag(){
  const flag = document.getElementById('tickerFlag');
  const txt = document.getElementById('tickerFlagText');
  const cnt = document.getElementById('tickerFlagCount');
  if(!flag || !txt || !cnt) return;
  const mode = (FB.mode === 'online' || FB.mode === 'offline') ? FB.mode : 'init';
  flag.classList.toggle('st-offline', mode === 'offline');
  flag.classList.toggle('st-init', mode === 'init');
  if(mode === 'online'){
    const n = Object.keys(state.players || {}).length;
    txt.textContent = t('feed.flag');
    cnt.textContent = t('feed.flagCount',{n:n});
    cnt.classList.remove('hidden');
  } else if(mode === 'offline'){
    txt.textContent = t('feed.flagOffline');
    cnt.textContent = t('feed.flagOneDevice');
    cnt.classList.remove('hidden');
  } else {
    txt.textContent = t('feed.flagInit');
    cnt.classList.add('hidden');
  }
}
/* ---------- Turbo Boost call-out on the presenter wall ----------
   Presses are grouped into a burst: anyone who presses within BOOST_NOTICE_MS of the previous
   presser joins the same call-out, and the whole panel — every name in it — stays up until
   BOOST_NOTICE_MS after the LAST of them pressed. So three players boosting together get one
   panel listing all three, extended by each new press; two players boosting ten seconds apart
   get two separate panels rather than one that never closes. */
const BOOST_NOTICE_MS = 3000;
// The burst that is on screen right now, newest name first. Online this comes from the
// `boosts` node; offline the whole state is broadcast, so the armed flag on the answer is
// readable directly and no extra node is needed.
function activeBoosts(){
  const now = Date.now();
  let rows = [];
  if(FB.mode==='online'){
    const leg = _boosts[state.currentQ] || {};
    rows = Object.keys(leg)
      .map(uid=>({ uid, name: (leg[uid]||{}).name || '', at: (leg[uid]||{}).at || 0 }))
      .filter(r=>r.name && r.at);
  } else {
    rows = Object.values(state.players)
      .map(p=>{ const a = p.answers[state.currentQ]; return (a && a.turbo && a.turboAt) ? { uid:p.id, name:p.name, at:a.turboAt } : null; })
      .filter(Boolean);
  }
  if(!rows.length) return [];
  rows.sort((a,b)=>a.at-b.at);
  // walk the presses and keep only the most recent burst
  let burst = [rows[0]];
  for(let i=1;i<rows.length;i++){
    if(rows[i].at - burst[burst.length-1].at < BOOST_NOTICE_MS) burst.push(rows[i]);
    else burst = [rows[i]];
  }
  if(now - burst[burst.length-1].at >= BOOST_NOTICE_MS) return [];
  return burst.slice().sort((a,b)=>b.at-a.at);
}
function renderPresenterBoosts(){
  const el = document.getElementById('boostNotice');
  if(!el) return;
  const rows = activeBoosts();
  if(!rows.length){ el.classList.remove('show'); return; }
  const head = rows.length===1 ? t('boost.one') : t('boost.many',{n:rows.length});
  const html = `<div class="bn-head"><span class="bn-bolt">⚡</span><span>${head}</span></div>`
    + `<div class="bn-names">${rows.map(r=>`<span class="bn-name">${escapeHtml(r.name)}</span>`).join('')}</div>`;
  if(el.dataset.sig !== html){ el.innerHTML = html; el.dataset.sig = html; }
  el.classList.add('show');
}

/* The player's equivalent: a 6px dot on the state pill they are already watching. Replaces
   the floating corner badge on the phone, which had no room to float without covering the
   position strip along the bottom. */
function paintPlayerConnDot(){
  const dot = document.getElementById('pConnDot');
  if(!dot) return;
  const mode = (FB.mode === 'online' || FB.mode === 'offline') ? FB.mode : 'init';
  dot.classList.toggle('off', mode === 'offline');
  dot.classList.toggle('init', mode === 'init');
  dot.title = mode === 'online' ? t('sync.live',{count:Object.keys(state.players||{}).length, s:''})
            : mode === 'offline' ? t('sync.offline') : t('sync.connecting');
}
function initEventFeed(){
  const track = document.getElementById('tickerTrack');
  paintTickerFlag();
  if(!track) return;
  // swap in fresh content only at the loop point, where it cannot be seen
  track.addEventListener('animationiteration', ()=>{
    if(_tickerPending){ _tickerPending = false; refreshEventFeed(true); }
  });
  refreshEventFeed(true);
}
// called from renderPresenter: mark the feed stale, don't rebuild mid-scroll
function tickEventFeed(){
  paintTickerFlag();   // cheap, and keeps the player count live between wraps
  const track = document.getElementById('tickerTrack');
  if(!track) return;
  if(!track.innerHTML){ refreshEventFeed(true); return; }   // first paint / after a reset
  _tickerPending = true;
}

let lastLeaderLocationCode = null;
function updateLocationScene(){
  const mapPanel = document.getElementById('mapPanel');
  const watermark = document.getElementById('sceneWatermark');
  if(!mapPanel || !watermark) return;
  const leader = rankedPlayers()[0];
  const code = leader ? ROUTE[leader.position].code : 'START';
  if(code === lastLeaderLocationCode) return;
  lastLeaderLocationCode = code;
  const theme = LOCATION_THEMES[code] || LOCATION_THEMES.START;
  mapPanel.classList.remove(...ALL_SCENE_CLASSES);
  if(theme.cls) mapPanel.classList.add(theme.cls);
  watermark.textContent = theme.icon;
}

// Finish-moment cinematic: fires once, the instant the race is decided (3rd finisher
// lands) — zooms the map into FINISH, gives the top-3 tokens a landing swoop, and cheers.
let finishFlourishIds = new Set();
let finishCinematicPlayed = false;
function triggerFinishCinematic(){
  const finishers = Object.values(state.players).filter(p=>p.finishRank && p.finishRank<=FINISHERS_TO_END)
    .sort((a,b)=>a.finishRank-b.finishRank);
  finishFlourishIds = new Set(finishers.map(p=>p.id));
  const zoomWrap = document.getElementById('mapZoomWrap');
  const finishNode = ROUTE[ROUTE.length-1];
  _finishCamHoldUntil = Date.now() + 7000;   // the cinematic outranks the camera selector
  if(zoomWrap){
    zoomWrap.style.transformOrigin = (finishNode.x/MAP_W*100)+'% '+(finishNode.y/MAP_H*100)+'%';
    zoomWrap.style.transform = 'scale(2.1)';
  }
  playApplause(2800);
  renderPresenterPlanes(); // apply the landing flourish now, don't wait for the 1s tick
  setTimeout(()=>{
    finishFlourishIds = new Set();
    _finishCamHoldUntil = 0;
    applyCamera();          // hand the map back to whichever CAM the host had selected
    renderPresenterPlanes();
  }, 7000);
}

const presenterPlaneEls = {};
let lastLeaderId = null;              // who was #1 as of the previous render, to detect a change
let cinematicOvertakeId = null;       // player id growing during the New Leader cinematic
let cinematicFallenId = null;         // player id shrinking during the New Leader cinematic
let leaderCinematicUntil = 0;         // Date.now() timestamp the transient classes above expire

function triggerLeaderChangeCinematic(oldId, newId){
  cinematicOvertakeId = newId;
  cinematicFallenId = oldId;
  leaderCinematicUntil = Date.now() + 2200;
  playApplause(1800);
  const p = state.players[newId];
  showNewLeaderBanner(p ? p.name : '');
}
function showNewLeaderBanner(name){
  const presenterEl = document.getElementById('view-presenter');
  let el = document.getElementById('newLeaderBanner');
  if(!el){
    el = document.createElement('div');
    el.id = 'newLeaderBanner';
    el.className = 'new-leader-banner';
    presenterEl.appendChild(el);
  }
  el.innerHTML = `<div class="tag">${t('pres.newLeader')}</div><div class="who">${escapeHtml(name)}</div>`;
  // reflow so re-adding "show" retriggers the transition even if a banner is already up
  el.classList.remove('show'); void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(()=>{ el.classList.remove('show'); }, 3000);
}

/* While the presenter is holding the correct answer on screen, the aircraft must stay
   where they were — they only start gliding once that card clears. Scoring itself already
   happened, so the pre-reveal positions are read back out of the undo snapshot (which
   adminRevealAnswer writes for exactly this leg before it moves anybody). */
function haveSnapshotForThisLeg(){
  return !!state.undoSnapshot && state.undoSnapshot.leg === state.currentQ && !!state.undoSnapshot.players;
}
function planesFrozen(){
  return state.gameState==='reveal'
    && !!state.revealAt && (Date.now() - state.revealAt) < ANSWER_CARD_MS
    && haveSnapshotForThisLeg();
}
/* The beat straight after the answer card, on the leg where the first aircraft landed:
   the map is zoomed into FINISH and only the champion is released, so the room watches
   one aircraft come in to land. Everyone else is held for another FIRST_FINISH_SOLO_MS. */
function firstFinishSolo(){
  if(!state.firstFinishAt || !state.firstFinishId) return false;
  const t = Date.now() - state.firstFinishAt;
  return t >= ANSWER_CARD_MS && t < (ANSWER_CARD_MS + FIRST_FINISH_SOLO_MS) && haveSnapshotForThisLeg();
}
function snapshotPosition(p){
  const before = state.undoSnapshot.players[p.id];
  return before ? before.position : p.position;
}
function displayPosition(p){
  if(planesFrozen()) return snapshotPosition(p);
  if(firstFinishSolo() && p.id !== state.firstFinishId) return snapshotPosition(p);
  return p.position;
}

/* Drives the map zoom for the solo landing. Kept separate from triggerFinishCinematic()
   (which fires at the END of the race, when the 4th aircraft lands) — this one is the
   FIRST landing, and it has to zoom in and back out on its own timer. */
let _soloZoomOn = false;
function updateFirstFinishZoom(){
  const zoomWrap = document.getElementById('mapZoomWrap');
  if(!zoomWrap) return;
  const want = firstFinishSolo();
  if(want === _soloZoomOn) return;
  _soloZoomOn = want;
  if(want){
    const finishNode = ROUTE[ROUTE.length-1];
    zoomWrap.style.transformOrigin = (finishNode.x/MAP_W*100)+'% '+(finishNode.y/MAP_H*100)+'%';
    zoomWrap.style.transform = 'scale(1.9)';
    playApplause(2200);
  } else if(state.gameState!=='finished'){
    // the end-of-race cinematic owns the zoom once the race is decided; don't fight it
    applyCamera();   // back to the host's selected CAM, not unconditionally to scale(1)
  }
}

/* Compass bearing of the leg an aircraft parked at `pos` is about to fly, in degrees for a
   nose-up glyph. At FINISH there is no next leg, so it keeps the bearing it arrived on —
   otherwise the winner would swing back to due north the moment they landed. */
function routeHeadingAt(pos){
  const i = Math.max(0, Math.min(pos, ROUTE.length-1));
  const from = (i >= ROUTE.length-1) ? ROUTE[ROUTE.length-2] : ROUTE[i];
  const to   = (i >= ROUTE.length-1) ? ROUTE[ROUTE.length-1] : ROUTE[i+1];
  return Math.atan2(to.y-from.y, to.x-from.x) * 180 / Math.PI + 90;
}
// Bearing actually flown between two stops — used while an aircraft is in transit.
function bearingBetween(a, b){
  const A = ROUTE[Math.max(0,Math.min(a,ROUTE.length-1))];
  const B = ROUTE[Math.max(0,Math.min(b,ROUTE.length-1))];
  if(!A || !B || (A.x===B.x && A.y===B.y)) return null;
  return Math.atan2(B.y-A.y, B.x-A.x) * 180 / Math.PI + 90;
}

/* ---------- flight speed and when an aircraft turns ----------
   Two rules the room can actually read from the back:

   TURNING: an aircraft holds the bearing of the leg it is flying for the whole glide, and only
   swings onto the next leg once it has ARRIVED. Setting the heading straight from the new stop
   (as before) made it pivot the instant it left, so it flew the yellow line sideways.

   SPEED: the quickest answerer gets the quickest aircraft. Ranked by average answer time —
   which lives on the progress node, so the presenter can read it without the answers tree —
   the fastest flies FLIGHT_FAST_MS and each place back adds FLIGHT_STEP_MS, capped so the
   tail never crawls. Everyone is a little slower than before, so the move reads as a flight
   rather than a jump. */
const FLIGHT_FAST_MS = 3400;   // the quickest aircraft on the board
const FLIGHT_STEP_MS = 260;    // each place further back is this much slower
const FLIGHT_SLOW_MS = 4700;   // nobody crawls past this
function flightMsFor(p, order){
  const idx = order.indexOf(p.id);
  if(idx < 0) return FLIGHT_FAST_MS;
  return Math.min(FLIGHT_SLOW_MS, FLIGHT_FAST_MS + idx*FLIGHT_STEP_MS);
}
// Player ids ordered quickest-answering first. Unanswered players sort last: with no time on
// the board there is nothing to claim they are fast.
function speedOrder(){
  return Object.values(state.players)
    .map(p=>({ id:p.id, avg: (p.answeredCount||0) > 0 ? (p.totalAnswerTime||0)/p.answeredCount : Infinity }))
    .sort((a,b)=>a.avg-b.avg)
    .map(x=>x.id);
}
// last displayed position per player, so a change can be recognised as a departure
const _planeAt = {};
const _planeTurnTimer = {};
/* Last heading actually written per aircraft, kept UNWRAPPED (it may run past ±360 over a
   race). atan2 returns -180..180, so +90 puts bearings in -90..270 — and CSS transitions the
   raw number, not the direction. Going from -54deg to 257deg (which is the same bearing as
   -103deg) would spin the aircraft 311 degrees the long way instead of turning 49. So each new
   heading is rebased onto the shortest path from the previous one before it is applied. */
const _planeHdg = {};
function applyHeading(tok, id, deg){
  const prev = _planeHdg[id];
  let next = deg;
  if(prev !== undefined){
    next = prev + ((((deg - prev) % 360) + 540) % 360) - 180;
  }
  _planeHdg[id] = next;
  tok.style.setProperty('--hdg', next.toFixed(1)+'deg');
}
function renderPresenterPlanes(){
  const layer = document.getElementById('planeLayer');
  const ranked = rankedPlayers();
  const leaderId = ranked.length ? ranked[0].id : null;
  updateFirstFinishZoom();
  // A change of #1 (once there was already a leader, and the race isn't already decided)
  // gets the slow overtake animation + "New Leader" banner + applause.
  if(lastLeaderId!==null && leaderId!==null && leaderId!==lastLeaderId && state.gameState!=='finished'){
    triggerLeaderChangeCinematic(lastLeaderId, leaderId);
  }
  lastLeaderId = leaderId;
  if(leaderCinematicUntil && Date.now() > leaderCinematicUntil){
    cinematicOvertakeId = null; cinematicFallenId = null; leaderCinematicUntil = 0;
  }
  const top5Ids = new Set(ranked.slice(0,5).map(p=>p.id));
  const order = speedOrder();      // quickest answerer first — drives each aircraft's speed
  const byPos = {};
  Object.values(state.players).forEach(p=>{
    const pos = displayPosition(p);
    byPos[pos] = byPos[pos] || [];
    byPos[pos].push(p);
  });
  const seenKeys = new Set();
  function tokenFor(key){
    let tok = presenterPlaneEls[key];
    if(!tok){
      tok = document.createElement('div');
      tok.className = 'plane-token';
      layer.appendChild(tok);
      presenterPlaneEls[key] = tok;
    }
    seenKeys.add(key);
    return tok;
  }
  Object.entries(byPos).forEach(([pos, plist])=>{
    const node = ROUTE[+pos];
    const topHere = plist.filter(p=>top5Ids.has(p.id));
    const othersHere = plist.filter(p=>!top5Ids.has(p.id));
    let stackIdx = 0;
    topHere.forEach(p=>{
      const onFire = (p.currentStreak||0) >= 5;
      const tok = tokenFor('p-'+p.id);
      tok.className = 'plane-token'
        + (p.id===leaderId ? ' leader' : '')
        + (onFire ? ' on-fire' : '')
        + (p.id===cinematicOvertakeId ? ' overtaking' : '')
        + (p.id===cinematicFallenId ? ' falling-behind' : '')
        + (finishFlourishIds.has(p.id) ? ' landing-flourish' : '');
      tok.style.left = (node.x/MAP_W*100)+'%';
      tok.style.top = ((node.y/MAP_H*100) - stackIdx*4.2)+'%';
      // fuselage catches the sun as it moves toward the bright corner; crossing into the
      // brightest zone throws a one-shot lens flare (see maybeFlare)
      const lit = skyIsClear() ? sunlitAmount(node.x, node.y) : 0;
      tok.style.setProperty('--lit', lit.toFixed(3));
      maybeFlare(p.id, node.x, node.y, lit);
      /* Speed: quickest answerer, quickest aircraft. */
      const flightMs = flightMsFor(p, order);
      tok.style.setProperty('--fly', flightMs+'ms');
      /* Turning: hold the bearing of the leg being flown for the whole glide, then swing onto
         the next leg only once the aircraft has arrived. */
      const was = _planeAt[p.id];
      const posNum = +pos;
      if(was === undefined){
        applyHeading(tok, p.id, routeHeadingAt(posNum));
      } else if(was !== posNum){
        const travel = bearingBetween(was, posNum);
        if(travel !== null) applyHeading(tok, p.id, travel);
        clearTimeout(_planeTurnTimer[p.id]);
        _planeTurnTimer[p.id] = setTimeout(()=>{
          const el = presenterPlaneEls['p-'+p.id];
          if(el) applyHeading(el, p.id, routeHeadingAt(posNum));
        }, flightMs + 60);   // a beat after touchdown, so the turn reads as a separate move
      }
      _planeAt[p.id] = posNum;
      tok.innerHTML = `<div class="stack"><div class="icon">${avatarHTML(p.avatar,'1em','#FFFFFF')}</div><div class="pname">${escapeHtml(p.name)}</div></div><div class="flame-trail">🔥</div>`;
      stackIdx++;
    });
    if(othersHere.length>0){
      const tok = tokenFor('agg-'+pos);
      tok.style.left = (node.x/MAP_W*100)+'%';
      tok.style.top = ((node.y/MAP_H*100) - stackIdx*4.2)+'%';
      tok.style.setProperty('--lit', (skyIsClear() ? sunlitAmount(node.x, node.y) : 0).toFixed(3));
      applyHeading(tok, 'agg-'+pos, routeHeadingAt(+pos));
      tok.innerHTML = `<div class="stack"><div class="icon">${planeSvg('#FFFFFF')}</div><div class="pname">+${othersHere.length}</div></div>`;
    }
  });
  // drop tokens for players who left the top 5 or position buckets that emptied out
  Object.keys(presenterPlaneEls).forEach(key=>{
    if(!seenKeys.has(key)){ presenterPlaneEls[key].remove(); delete presenterPlaneEls[key]; }
  });
}

// Rows are kept and reused (keyed by player id) instead of rebuilt from scratch, so a
// rank swap can FLIP-animate: the row's DOM position moves instantly, then a translateY
// inverts it back to where it visually was and releases into the CSS transition on
// .lead-row (transform .3s ease), producing a smooth slide into its new spot.
const presenterLeaderRowEls = {};
function renderPresenterLeaderboard(){
  const el = document.getElementById('presLeaderboard');
  const titleEl = document.getElementById('presLeaderboardTitle');
  if(presHoveredLeg!==null){
    const node = ROUTE[presHoveredLeg];
    const here = Object.values(state.players).filter(p=>p.position===presHoveredLeg)
      .sort((a,b)=>(a.totalAnswerTime||0)-(b.totalAnswerTime||0));
    if(titleEl) titleEl.textContent = `📍 ${node.code} · ${node.city}`;
    el.innerHTML = here.length===0
      ? `<p style="color:rgba(255,255,255,.5); font-size:13px;">${t('pres.noneHere')}</p>`
      : here.map(p=>`
        <div class="lead-row">
          <div class="av">${avatarHTML(p.avatar,'1em','#FFFFFF')}</div>
          <div class="nm">${escapeHtml(p.name)}${milestoneDotsFor(p.id)}<div style="font-size:10.5px; color:rgba(255,255,255,.5); font-weight:400;">⏱ ${formatTime(p.totalAnswerTime)}</div></div>
        </div>
      `).join('');
    return; // the hover view wipes the DOM, so the row cache below is rebuilt fresh next time
  }
  if(titleEl) titleEl.textContent = t('pres.leaderboard');
  const ranked = rankedPlayers();
  if(ranked.length===0){
    el.innerHTML = `<p style="color:rgba(255,255,255,.5); font-size:13px;">${t('pres.noPlayers')}</p>`;
    Object.keys(presenterLeaderRowEls).forEach(k=>delete presenterLeaderRowEls[k]);
    return;
  }
  const totalLegs = ROUTE.length - 1;
  // The leaderboard lists EVERY player (the panel scrolls). The route map is unaffected —
  // it still draws named tokens for the top 5 and a "+N" pile for everyone else.
  if(titleEl) titleEl.textContent = t('pres.leaderboardN',{n:ranked.length});

  // Drop anything in the panel that isn't one of our tracked rows — e.g. the "No players
  // yet" placeholder left over from the empty state above, the first time players join.
  const trackedEls = new Set(Object.values(presenterLeaderRowEls));
  [...el.children].forEach(child=>{ if(!trackedEls.has(child)) child.remove(); });

  // FLIP step 1 ("First"): note where every currently-attached row sits before reordering.
  const firstTop = {};
  Object.keys(presenterLeaderRowEls).forEach(key=>{
    const row = presenterLeaderRowEls[key];
    if(row.isConnected) firstTop[key] = row.getBoundingClientRect().top;
  });

  const seenKeys = new Set();
  ranked.forEach((p,i)=>{
    const key = 'p-'+p.id;
    seenKeys.add(key);
    let row = presenterLeaderRowEls[key];
    if(!row){ row = document.createElement('div'); presenterLeaderRowEls[key] = row; }
    const onFire = (p.currentStreak||0) >= 5;
    const accuracy = p.answeredCount ? Math.round((p.correctCount||0)/p.answeredCount*100) : 0;
    row.className = 'lead-row' + (i===0?' top1':'');
    row.innerHTML = `
      <div class="rank">${i<RANK_TROPHY.length?RANK_TROPHY[i]:('#'+(i+1))}</div>
      <div class="av">${avatarHTML(p.avatar,'1em','#FFFFFF')}</div>
      <div class="nm">${onFire?'<span class="fire-tag">🔥</span> ':''}${escapeHtml(p.name)}${milestoneDotsFor(p.id)}
        <div class="sub">${ROUTE[p.position].code} · ${ROUTE[p.position].city} · ⏱ ${formatTime(p.totalAnswerTime)}</div>
        <div class="stats">🎯 ${accuracy}% accuracy · 🏆 best streak ${p.longestStreak||0}</div>
      </div>
      <div class="st">${p.position}/${totalLegs}</div>
    `;
    el.appendChild(row); // "Last": (re)places it in rank order — existing nodes just move
  });
  // rows for players who left the race (removed by the admin) get dropped
  Object.keys(presenterLeaderRowEls).forEach(key=>{
    if(!seenKeys.has(key)){ presenterLeaderRowEls[key].remove(); delete presenterLeaderRowEls[key]; }
  });

  // FLIP steps 2-3 ("Invert" + "Play"): snap each moved row back to its old spot with no
  // transition, then release the inline overrides so the CSS transition slides it home.
  seenKeys.forEach(key=>{
    const row = presenterLeaderRowEls[key];
    const first = firstTop[key];
    if(first===undefined) return; // brand-new row — nothing to animate from
    const delta = first - row.getBoundingClientRect().top;
    if(Math.abs(delta) < 1) return;
    row.style.transition = 'none';
    row.style.transform = `translateY(${delta}px)`;
    row.getBoundingClientRect(); // force a reflow so the snapped position takes effect first
    row.style.transition = '';
    row.style.transform = '';
  });
}

/* The cabin bulletin under the leaderboard: a post-question debrief written the way an
   in-flight announcement reads. Everything here describes the LAST SCORED leg, so it holds
   its numbers on screen while the host talks over the next question being staged. */
function lastScoredLeg(){
  const legs = Object.keys(state.revealedLegs||{}).filter(k=>state.revealedLegs[k]).map(Number);
  return legs.length ? Math.max.apply(null, legs) : null;
}
/* Only the admin can read rooms/{ROOM}/answers, so the presenter has no way to work out
   who was quickest or how many got it right. The admin boils the leg down to these few
   numbers at reveal and publishes them in the admin slice, which everyone can read. */
function buildLegBrief(leg, correctIdx){
  const players = Object.values(state.players);
  const submitted = players.map(p=>({p, a:p.answers[leg]})).filter(x=>x.a && x.a.submitted);
  const correct = submitted.filter(x=>x.a.choice===correctIdx);
  const fastest = correct.slice().sort((a,b)=>(a.a.timeTaken||Infinity)-(b.a.timeTaken||Infinity))[0];
  const times = submitted.map(x=>x.a.timeTaken).filter(v=>typeof v==='number');
  return {
    leg,
    total: players.length,
    correctCount: correct.length,
    fastestName: fastest ? fastest.p.name : null,
    fastestTime: fastest && typeof fastest.a.timeTaken==='number' ? fastest.a.timeTaken : null,
    avgTime: times.length ? Math.round(times.reduce((s,v)=>s+v,0)/times.length) : null,
    // How many aircraft ran Turbo this round. The presenter can't read the answers tree
    // (admin-only under database.rules.json), so the count rides along on the brief — that
    // is what lets the wall speed the sky up when somebody boosts. See tickSkyForTurbo.
    turboCount: submitted.filter(x=>x.a.turbo).length,
  };
}
function renderPresenterBrief(){
  const legEl = document.getElementById('briefLeg');
  const body = document.getElementById('briefBody');
  if(!body) return;
  const players = Object.values(state.players);
  const leg = lastScoredLeg();
  const brief = (state.legBrief && state.legBrief.leg===leg) ? state.legBrief : null;

  if(leg===null || !brief || players.length===0){
    if(legEl) legEl.textContent = '—';
    body.innerHTML = `<div class="brief-empty brief-item wide">${t('brief.standby')}</div>`;
    return;
  }
  if(legEl) legEl.textContent = legLabel(leg).toUpperCase();

  // everyone who didn't answer counts against the rate — sitting it out is not a pass
  const total = brief.total || players.length;
  const rate = total ? Math.round(brief.correctCount/total*100) : 0;

  const leader = rankedPlayers()[0];
  // busiest stop on the board right now
  const tally = {};
  players.forEach(p=>{ tally[p.position] = (tally[p.position]||0)+1; });
  let busyPos = null, busyN = 0;
  Object.keys(tally).forEach(k=>{ if(tally[k] > busyN){ busyN = tally[k]; busyPos = +k; } });

  // pace, read off how long the room took to answer this one
  const avg = (typeof brief.avgTime==='number') ? brief.avgTime : null;
  let pace, paceCls, paceIcon;
  if(avg===null){ pace=t('brief.paceNone'); paceCls=''; paceIcon='📉'; }
  else if(avg < 7000){ pace=t('brief.paceFast'); paceCls='pace-fast'; paceIcon='🚀'; }
  else if(avg < 14000){ pace=t('brief.paceSteady'); paceCls='pace-med'; paceIcon='🧭'; }
  else { pace=t('brief.paceSlow'); paceCls='pace-slow'; paceIcon='🐢'; }

  const fastestHtml = brief.fastestName
    ? `🥇 ${escapeHtml(brief.fastestName)} <span class="sub">${formatTime(brief.fastestTime)}</span>`
    : ('<span class="sub">'+t('brief.noneCorrect')+'</span>');

  const item = (icon, label, value, wide)=>
    `<div class="brief-item${wide?' wide':''}"><span class="bi">${icon}</span><div><div class="bl">${label}</div><div class="bv">${value}</div></div></div>`;

  body.innerHTML =
    item('⚡',t('brief.fastest'), fastestHtml, true) +
    item('✅',t('brief.correct'), `${brief.correctCount} <span class="sub">${t('brief.ofN',{n:total})}</span>`) +
    item('📊',t('brief.rate'), `${rate}%`) +
    item('👑',t('brief.leaderAt'), leader ? `${ROUTE[leader.position].code} <span class="sub">${escapeHtml(ROUTE[leader.position].city)}</span>` : '—') +
    item('🛬',t('brief.busiest'), busyPos!==null ? `${ROUTE[busyPos].code} <span class="sub">${t('brief.aircraftN',{n:busyN})}</span>` : '—') +
    item(paceIcon,t('brief.pace'), `<span class="${paceCls}">${pace}</span>${avg!==null?` <span class="sub">${t('brief.avg',{t:formatTime(avg)})}</span>`:''}`, true);
}

function rankedPlayers(){
  // Anyone who has actually landed (finishRank set) outranks everyone still racing,
  // ordered by true arrival sequence — not just by who happens to share the FINISH tile.
  return Object.values(state.players).slice().sort((a,b)=>{
    if(a.finishRank && b.finishRank) return a.finishRank - b.finishRank;
    if(a.finishRank) return -1;
    if(b.finishRank) return 1;
    return b.position - a.position || (a.totalAnswerTime||0) - (b.totalAnswerTime||0);
  });
}
/* Champion's cup, then gold / silver, then bronze SHARED by 4th and 5th — the two of them
   finish level on the podium, so the array has five entries and the last two match. Index by
   finishRank-1. Anything past 5th has no medal (callers fall back to a plain marker). */
const RANK_TROPHY = ['🏆','🥇','🥈','🥉','🥉'];
function formatTime(ms){
  ms = ms || 0;
  return (ms/1000).toFixed(1)+'s';
}
function ordinal(n){
  // Vietnamese has no ordinal suffix — the surrounding string already says "Hạng"/"thứ"
  if(LANG === 'vi') return String(n);
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}
function milestoneDotsFor(playerId){
  let dots = '';
  ['HAN','SPC','SGN'].forEach(code=>{
    if(state.milestones && state.milestones[code]===playerId){
      dots += ` <span title="First to reach ${code}" style="color:var(--vna-gold-light);">●</span>`;
    }
  });
  return dots;
}

/* Fullscreen for the LED wall. Safari still only has the webkit-prefixed API, and the
   request rejects unless it's inside a user gesture — which is why this is wired to the
   button rather than called automatically when the presenter view opens. */
function togglePresenterFullscreen(){
  const el = document.documentElement;
  const isFull = document.fullscreenElement || document.webkitFullscreenElement;
  if(isFull){
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    return;
  }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(!req){ toast(t('pres.fsUnsupported')); return; }
  Promise.resolve(req.call(el)).catch(()=>toast(t('pres.fsBlocked')));
}
function syncFullscreenBtn(){
  const btn = document.getElementById('presFullscreenBtn');
  if(!btn) return;
  const isFull = document.fullscreenElement || document.webkitFullscreenElement;
  btn.textContent = isFull ? t('pres.exitFullscreen') : t('pres.fullscreen');
}
document.addEventListener('fullscreenchange', syncFullscreenBtn);
document.addEventListener('webkitfullscreenchange', syncFullscreenBtn);

function renderPresenter(){
  const pill = document.getElementById('presStatePill');
  pill.textContent = t('st.'+state.gameState);
  fitMapStage();         // before anything positions itself against the artwork
  initMapLife();         // boats/birds/clouds — builds once, then runs on CSS alone
  updateSkyAmbience();   // before the planes: their sunlight depends on whether the sky is clear
  tickSkyForTurbo();
  renderPresenterPlanes();
  renderPresenterLeaderboard();
  renderPresenterBrief();
  updateLocationScene();
  syncCamButtons();
  applyCamera();         // CAM 2/3 follow the field, so re-aim every tick
  tickEventFeed();       // marks the ticker stale; it re-reads at its next wrap
  if(state.gameState==='finished' && !finishCinematicPlayed){
    finishCinematicPlayed = true;
    triggerFinishCinematic();
  }

  const totalLegs = ROUTE.length - 1;
  const turbulent = isTurbulenceLeg(state.currentQ);
  const qKnown = (state.currentQuestionIndex!==null && state.currentQuestionIndex!==undefined);

  // weather badge + storm / sunny / thunder theme
  const presenterEl = document.getElementById('view-presenter');
  const weatherBadge = document.getElementById('weatherBadge');
  // Turbulence always outranks Power Question — arming Power on a turbulence leg
  // is already blocked in adminTogglePowerQuestion, this is just a display backstop.
  const powerOn = state.powerQuestionActive && !turbulent;
  // "Thunder" is the internal name for the ⛈ Storm feature (leg 8), kept distinct from the
  // pre-existing "storm" naming used for Turbulence's rain/lightning theme, to avoid confusion.
  const thunderOn = isStormLeg(state.currentQ) && !turbulent;
  if(weatherBadge){
    weatherBadge.innerHTML = turbulent ? t('wx.turbulence') : (thunderOn ? t('wx.storm') : (powerOn ? t('wx.power') : t('wx.clear')));
