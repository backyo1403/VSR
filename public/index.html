          <p style="color:rgba(255,255,255,.5); font-style:italic; font-size:12.5px;" data-i18n="rules.docs.more"></p>
        </div>
      </div>

      <div class="rules-nav">
        <button class="btn btn-ghost btn-sm" id="rulesPrevBtn" onclick="rulesGoPage(rulesPage-1)" data-i18n="rules.back"></button>
        <div class="rules-dots" id="rulesDots"></div>
        <button class="btn btn-primary btn-sm" id="rulesNextBtn" onclick="rulesGoPage(rulesPage+1)"></button>
      </div>
    </div>
  </div>

  <!-- ============ ADMIN PASSWORD GATE ============ -->
  <div id="adminGateModal" class="hidden" style="position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(0,20,40,.6);">
    <div class="glass" style="border-radius:22px;padding:32px 28px;max-width:340px;width:90%;text-align:center;">
      <div style="font-size:30px;margin-bottom:8px;">🔒</div>
      <h3 style="margin:0 0 6px; font-size:19px;" data-i18n="gate.title"></h3>
      <p style="margin:0 0 18px;font-size:13.5px;color:rgba(255,255,255,.65);" data-i18n="gate.desc"></p>
      <input type="text" id="adminPassInput" data-i18n-ph="gate.ph" style="text-align:center;letter-spacing:.2em;" />
      <div id="adminGateError" style="color:#ffb3b3;font-size:12.5px;margin-top:8px;height:14px;"></div>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button class="btn btn-ghost btn-block" onclick="closeAdminGate()" data-i18n="gate.cancel"></button>
        <button class="btn btn-primary btn-block" onclick="submitAdminGate()" data-i18n="gate.enter"></button>
      </div>
    </div>
  </div>

  <!-- ============ PLAYER ============ -->
  <section id="view-player" class="hidden">
    <div class="p-header">
      <div class="brand-mark"><img class="brand-logo" src="vendor/vna-logo.png" alt="Vietnam Airlines" /><span>Sky Race</span></div>
      <div class="p-badge mono" id="pStateBadge"><span class="conn-dot" id="pConnDot"></span><span id="pStateText">LOBBY</span></div>
    </div>

    <div id="pRegistration" class="reg-card glass">
      <div class="reg-head">
        <h2 data-i18n="p.join.title"></h2>
        <div class="lang-switch inline">
          <button class="lang-opt" data-lang="vi" onclick="setLang('vi')">VI</button>
          <button class="lang-opt" data-lang="en" onclick="setLang('en')">EN</button>
        </div>
      </div>
      <p class="hint" data-i18n="p.join.hint"></p>
      <div class="field-label" data-i18n="p.join.room"></div>
      <input type="text" id="pRoomCode" maxlength="12" style="text-transform:uppercase;" data-i18n-ph="p.join.roomPh" />
      <div class="field-label" data-i18n="p.join.name"></div>
      <input type="text" id="pName" maxlength="18" data-i18n-ph="p.join.namePh" />
      <div class="field-label" data-i18n="p.join.avatar"></div>
      <div class="avatar-grid" id="pAvatarGrid"></div>
      <button class="btn btn-primary btn-block" style="margin-top:22px;" id="pJoinBtn" onclick="playerJoin()" data-i18n="p.join.btn"></button>
    </div>

    <div id="pGame" class="hidden" style="display:flex; flex-direction:column; flex:1;">
      <div id="pBizRibbon"></div>
      <div class="route-strip" id="pRouteStrip"></div>

      <div class="timer-ring-wrap"><div class="p-badge timer-num mono" id="pTimer">--</div></div>

      <div id="pWxAnnounce"></div>

      <div class="q-card glass" id="pQCard">
        <div class="q-eyebrow" id="pQEyebrow">WAITING FOR NEXT QUESTION</div>
        <div class="q-text" id="pQText">Sit tight — the presenter will open the next question shortly.</div>
        <div class="power-note hidden" id="pPowerNote" data-i18n-html="p.powerNote"></div>
        <div class="storm-note hidden" id="pStormNote" data-i18n-html="p.stormNote"></div>
        <div id="pOptions"></div>
      </div>

      <div class="status-banner wait glass hidden" id="pStatusBanner"></div>
      <div id="pHelpsWrap"></div>

      <div class="dest-strip glass">
        <div><div class="lbl" data-i18n="p.pos"></div><div class="val mono" id="pDest">START</div></div>
        <div style="text-align:center;"><div class="lbl" data-i18n="p.now"></div><div class="val mono" id="pLocation">—</div></div>
        <div style="text-align:center;"><div class="lbl" data-i18n="p.total"></div><div class="val mono" id="pTotalTime">0.0s</div></div>
        <div style="text-align:right;"><div class="lbl" data-i18n="p.aircraft"></div><div class="val" id="pAvatarShown">—</div></div>
      </div>
    </div>
  </section>

  <!-- ============ PRESENTER ============ -->
  <section id="view-presenter" class="hidden">
    <div class="pres-top">
      <h1><img class="brand-logo" src="vendor/vna-logo.png" alt="Vietnam Airlines" /> Sky Race</h1>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="pres-status-pill final-round-pill hidden" id="finalRoundBadge">☀️ FINAL ROUND</div>
      <div class="pres-status-pill glass" id="weatherBadge">🌈 Clear Skies</div>
        <div class="pres-status-pill glass" id="presStatePill">LOBBY</div>

/* Looks up a string in the active language, falling back to English and finally to the
   key itself, so a missing translation degrades to something readable rather than blank.
   {placeholders} in the string are substituted from `vars`. */
function t(key, vars){
  let s = (STR[LANG] && STR[LANG][key]);
  if(s === undefined) s = (STR.en && STR.en[key]);
  if(s === undefined) return key;
  if(vars) Object.keys(vars).forEach(k=>{ s = s.split('{'+k+'}').join(vars[k]); });
  return s;
}
/* Paints every string that lives in the static markup. Elements opt in with
   data-i18n (textContent), data-i18n-html (innerHTML, for strings with <strong> in them),
   data-i18n-ph (placeholder) or data-i18n-title (tooltip). */
function applyStaticI18n(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{ el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('.lang-opt').forEach(b=>{ b.classList.toggle('on', b.dataset.lang===LANG); });
  // these depend on runtime state, not just the language, so they can't be data-i18n
  if(typeof syncFullscreenBtn === 'function') syncFullscreenBtn();
  if(typeof syncCamButtons === 'function') syncCamButtons();
  if(typeof paintTickerFlag === 'function') paintTickerFlag();
}
function setLang(l){
  if(LANGS.indexOf(l) < 0 || l === LANG) return;
  LANG = l;
  try{ localStorage.setItem('vna_lang', l); }catch(e){}
  loadQuestions();   // re-reads the bank in the new language, same shuffle order
  applyStaticI18n();
  if(typeof rulesPage !== 'undefined' && !document.getElementById('rulesModal').classList.contains('hidden')) rulesGoPage(rulesPage);
  // the ticker normally only re-reads at its wrap point, which can be half a minute away —
  // a language switch has to show immediately, so force it
  if(typeof refreshEventFeed === 'function') refreshEventFeed(true);
  renderAll();
}
/* The route is pinned to the illustrated island map behind it (vendor/route-bg.jpg), so the
   coordinates below are NOT generated — each one is the spot on that artwork where the stop's
   landmark actually stands: START on the runway, CDG at the Eiffel Tower, MOW at St Basil's,
   and so on. They are expressed in the MAP_W x MAP_H space defined below, which shares the
   background's aspect ratio, and every consumer positions by percentage of that space — so
   the pins stay welded to their landmarks at any screen size.
   Editing note: to move a pin, read its pixel position off the artwork and scale by
   MAP_W/imageWidth. Do not "tidy" these into a curve; they are survey data, not layout.
   START / HAN / SPC / SGN / FINISH are the 5 big checkpoint nodes.
   HAN (Turtle Tower) and SGN (Landmark 81) have no matching emoji, so they're inline SVGs.

   this list, which is exactly what makes the "three correct answers to leave HAN or SGN"
   rule work without any special-case code: one correct answer moves one stop, and there are
   now three hops from HAN to MUC (HAN→DAD→HUI→MUC) and three from SGN to FRA
   (SGN→CXR→PQC→FRA). Their coordinates sit deliberately OFF the main line so the detour
   reads as a local loop rather than part of the through-route, and they draw smaller
   (.airport-node.sub) so they never compete with the twelve main stops. */

 en:{q:"A customer on a long-haul route wants more comfort than Economy but their budget does not stretch to Business Class. Which product should the agent recommend?",opts:["Economy Class","Premium Economy Class","Business Class","Transit Tour"],explain:"Premium Economy sits between Economy and Business, offering a more comfortable experience while still suiting customers who are not ready to pay for Business Class. It is an excellent upselling opportunity based on what the customer actually needs."}},

{id:7,correct:2,
 vi:{q:"Dịch vụ nào sau đây không thuộc nhóm ancillary services của Vietnam Airlines?",opts:["Chọn ghế trước","Mua thêm hành lý","Check-in nhanh tại sân bay","Suất ăn đặc biệt"],explain:"Các dịch vụ bổ trợ như chọn ghế trước, mua thêm hành lý, nâng hạng hay suất ăn đặc biệt giúp hành khách cá nhân hóa chuyến đi. Đồng thời, đây cũng là cơ hội để đại lý tăng giá trị trên mỗi booking."},
 en:{q:"Which of the following is NOT part of Vietnam Airlines' ancillary services?",opts:["Advance seat selection","Extra baggage purchase","Fast-track check-in at the airport","Special meals"],explain:"Ancillary services such as advance seat selection, extra baggage, upgrades or special meals let passengers personalise their trip. They are also an opportunity for agents to add value to every booking."}},

{id:8,correct:1,
 vi:{q:"Vì sao việc giới thiệu LotusMiles cho khách hàng thường xuyên đi lại có thể tạo giá trị dài hạn cho đại lý?",opts:["Giúp khách luôn mua vé rẻ nhất","Tăng khả năng khách quay lại và tiếp tục lựa chọn Vietnam Airlines","Giúp đại lý không cần chăm sóc khách hàng","Thay thế hoàn toàn các chương trình khuyến mại"],explain:"Một khách hàng trung thành có giá trị cao hơn một giao dịch đơn lẻ. Khi khách hiểu và sử dụng LotusMiles, họ có thêm động lực quay lại Vietnam Airlines trong những chuyến đi tiếp theo."},
 en:{q:"Why can introducing LotusMiles to frequent travellers create long-term value for an agent?",opts:["It guarantees the customer always gets the cheapest fare","It increases the chance the customer returns and keeps choosing Vietnam Airlines","It removes the need for the agent to look after the customer","It completely replaces promotional campaigns"],explain:"A loyal customer is worth more than a single transaction. Once customers understand and use LotusMiles, they have a further reason to come back to Vietnam Airlines on their next trips."}},

{id:9,correct:1,
 vi:{q:"Một đại lý muốn xây dựng các tour nhóm/premium tour với Vietnam Airlines. Chính sách nào nên được tìm hiểu đầu tiên?",opts:["Chính sách nâng hạng","Chính sách Tour Series","Chính sách LotusMiles","Chính sách Transit Tour"],explain:"Chính sách Tour Series là một trong những công cụ thương mại quan trọng dành cho các đại lý phát triển sản phẩm tour. Việc hiểu rõ chính sách giúp đại lý chủ động hơn trong việc xây dựng package, lập kế hoạch bán và quản lý chỗ."},
 en:{q:"An agent wants to build group or premium tours with Vietnam Airlines. Which policy should they look into first?",opts:["The upgrade policy","The Tour Series policy","The LotusMiles policy","The Transit Tour policy"],explain:"The Tour Series policy is one of the key commercial tools for agents developing tour products. Understanding it lets the agent take the initiative on building packages, planning sales and managing inventory."}},

{id:10,correct:1,
 vi:{q:"Trong các giải pháp bán hàng của Vietnam Airlines, phát biểu nào mô tả CHÍNH XÁC nhất về TAP?",opts:["TAP là hệ thống toàn cầu của IATA dùng để xử lý giao dịch tài chính giữa đại lý và hãng hàng không.","TAP là một nền tảng bán vé trực tuyến kết nối trực tiếp với hệ thống chủ (PSS) của Vietnam Airlines, dành cho đại lý, GSA và CA theo mô hình self-service.","TAP là một nền tảng GDS cho phép đại lý tìm kiếm và bán vé của nhiều hãng hàng không trên toàn thế giới.","TAP là API dành riêng cho các OTA để tích hợp trực tiếp dữ liệu giá và chỗ của Vietnam Airlines."],explain:"TAP là một trong những giải pháp bán hàng trực tuyến của Vietnam Airlines, cho phép đại lý, GSA và CA self-service kết nối trực tiếp với hệ thống PSS của Vietnam Airlines. Điểm quan trọng cần phân biệt là TAP không phải BSP: BSP tập trung vào quy trình giao dịch tài chính giữa đại lý và hãng hàng không trong hệ thống BSP của IATA. TAP cũng không phải GDS hay XML API. Với đại lý, việc hiểu đúng TAP giúp lựa chọn đúng công cụ bán hàng và phương thức kết nối phù hợp với mô hình kinh doanh của mình."},
 en:{q:"Among Vietnam Airlines' sales solutions, which statement describes TAP MOST accurately?",opts:["TAP is IATA's global system for handling financial settlement between agents and airlines.","TAP is an online booking platform connected directly to Vietnam Airlines' host system (PSS), built for agents, GSAs and CAs on a self-service model.","TAP is a GDS platform that lets agents search and sell tickets for airlines worldwide.","TAP is an API reserved for OTAs to integrate Vietnam Airlines fare and inventory data directly."],explain:"TAP is one of Vietnam Airlines' online sales solutions, letting agents, GSAs and CAs self-serve through a direct connection to Vietnam Airlines' PSS. The key distinction is that TAP is not BSP: BSP handles financial settlement between agents and airlines inside IATA's BSP system. TAP is not a GDS or an XML API either. For an agent, understanding TAP correctly means choosing the right selling tool and the right connection method for their business model."}},

{id:11,correct:1,
 vi:{q:"Vietnam Airlines phối hợp marketing với đại lý thông qua roadshow, workshop và các hoạt động co-branding chủ yếu nhằm mục tiêu nào?",opts:["Giảm chi phí vận hành máy bay","Tăng nhận diện thương hiệu và kích thích nhu cầu thị trường","Thay thế hoàn toàn hoạt động marketing của đại lý","Chỉ quảng bá vé Business Class"],explain:"Vietnam Airlines xem marketing là hoạt động hợp tác với đối tác. Thông qua roadshow, workshop, campaign và co-branding, cả hai bên có thể cùng tiếp cận khách hàng và tạo nhu cầu cho thị trường hiệu quả hơn."},
 en:{q:"Vietnam Airlines runs joint marketing with agents through roadshows, workshops and co-branding mainly to achieve which goal?",opts:["To cut aircraft operating costs","To raise brand awareness and stimulate market demand","To completely replace the agent's own marketing","To promote Business Class tickets only"],explain:"Vietnam Airlines treats marketing as something done together with partners. Through roadshows, workshops, campaigns and co-branding, both sides can reach customers and create market demand more effectively."}},

{id:12,correct:1,
 vi:{q:"Mục tiêu chính của các chương trình incentive dành cho đại lý là gì?",opts:["Chỉ thưởng cho số lượng booking","Khuyến khích hiệu quả bán hàng và tăng trưởng kinh doanh bền vững","Thay thế hoàn toàn commission","Chỉ áp dụng cho đại lý mới"],explain:"Các chương trình incentive được xây dựng để ghi nhận hiệu quả kinh doanh và khuyến khích đại lý phát triển doanh số. Điều quan trọng là đại lý cần hiểu rõ KPI, điều kiện và cách thức đạt incentive để chủ động xây dựng kế hoạch bán hàng."},
 en:{q:"What is the main objective of the incentive programmes for agents?",opts:["To reward booking volume only","To encourage sales performance and sustainable business growth","To completely replace commission","To apply to new agents only"],explain:"Incentive programmes are designed to recognise business performance and encourage agents to grow their sales. What matters is that agents understand the KPIs, the conditions and how the incentive is earned, so they can plan their selling proactively."}},

{id:13,correct:1,
 vi:{q:"Một hành khách quốc tế có thời gian transit dài tại Việt Nam. Dịch vụ nào của Vietnam Airlines có thể biến thời gian chờ thành một trải nghiệm du lịch?",opts:["Nâng hạng","Transit Tour","Chọn trước ghế","Phòng chờ Lotus Lounge"],explain:"Transit không nhất thiết phải là thời gian chờ đợi nhàm chán. Transit Tour tạo cơ hội để hành khách khám phá Hà Nội hoặc TP.HCM trong thời gian nối chuyến, từ đó biến một điểm trung chuyển thành một phần của trải nghiệm Việt Nam."},
 en:{q:"An international passenger has a long transit in Vietnam. Which Vietnam Airlines service can turn that waiting time into a travel experience?",opts:["Upgrade","Transit Tour","Advance seat selection","Lotus Lounge"],explain:"A transit does not have to be dull waiting time. The Transit Tour gives passengers a chance to explore Hanoi or Ho Chi Minh City during their connection, turning a transfer point into part of the Vietnam experience."}},

{id:14,correct:2,
 vi:{q:"Một khách hàng chỉ tập trung so sánh giá vé giữa các hãng. Cách tư vấn nào phù hợp nhất với định hướng của Vietnam Airlines?",opts:["Luôn đưa ra mức giá thấp nhất","Chỉ nói về hành lý","Tư vấn tổng thể về network, sản phẩm, dịch vụ, loyalty và trải nghiệm","Khuyên khách chọn hãng khác nếu giá thấp hơn"],explain:"Giá là một yếu tố quan trọng nhưng không phải yếu tố duy nhất. Vietnam Airlines có lợi thế về network, sản phẩm full-service, dịch vụ premium và hệ sinh thái LotusMiles. Đại lý cần chuyển cuộc trò chuyện từ \"giá bao nhiêu\" sang \"khách nhận được giá trị gì\"."},
 en:{q:"A customer is focused purely on comparing fares between airlines. Which advisory approach best fits Vietnam Airlines' direction?",opts:["Always quote the lowest fare","Talk only about baggage","Advise holistically on network, product, service, loyalty and experience","Suggest another airline if its fare is lower"],explain:"Price matters, but it is not the only factor. Vietnam Airlines has advantages in network, full-service product, premium service and the LotusMiles ecosystem. Agents need to move the conversation from \"how much is it\" to \"what value does the customer get\"."}},

{id:15,correct:1,
 vi:{q:"Một khách từ châu Âu muốn đến Hà Nội, sau đó tiếp tục đi nhiều điểm tại Việt Nam. Lợi thế nào của Vietnam Airlines nên được đại lý nhấn mạnh?",opts:["Chỉ có giá vé quốc tế","Mạng bay quốc tế kết hợp với mạng bay nội địa","Chỉ có Business Class","Chỉ có dịch vụ Lotus Lounge"],explain:"Đây chính là lúc đại lý có thể tận dụng sức mạnh của network. Vietnam Airlines không chỉ đưa khách từ châu Âu đến Việt Nam mà còn có thể hỗ trợ khách tiếp tục hành trình tới nhiều điểm đến trong nước."},
 en:{q:"A customer from Europe wants to fly to Hanoi and then continue on to several points within Vietnam. Which Vietnam Airlines advantage should the agent emphasise?",opts:["International fares only","The international network combined with the domestic network","Business Class only","The Lotus Lounge service only"],explain:"This is exactly where an agent can use the strength of the network. Vietnam Airlines does not only bring customers from Europe to Vietnam — it can also carry them onward to many destinations inside the country."}},

{id:16,correct:1,
 vi:{q:"Thông điệp nào phản ánh đúng nhất cách Vietnam Airlines nhìn nhận vai trò của đại lý?",opts:["Đại lý chủ yếu là kênh phân phối vé","Đại lý là đối tác chiến lược cùng Vietnam Airlines phát triển kinh doanh","Đại lý chịu trách nhiệm bán vé","Đại lý có vai trò trong thị trường nội địa"],explain:"Trong chiến lược của Vietnam Airlines, đại lý không chỉ là nơi phát hành vé. Đại lý là đối tác có vai trò quan trọng trong việc tiếp cận khách hàng, phát triển thị trường, quảng bá sản phẩm và xây dựng trải nghiệm khách hàng."},
 en:{q:"Which message best reflects how Vietnam Airlines sees the role of its agents?",opts:["Agents are mainly a ticket distribution channel","Agents are strategic partners growing the business together with Vietnam Airlines","Agents are responsible for selling tickets","Agents have a role in the domestic market"],explain:"In Vietnam Airlines' strategy, an agent is not just a place that issues tickets. Agents are partners with an important role in reaching customers, developing the market, promoting products and building the customer experience."}},

{id:17,correct:2,
 vi:{q:"Đường bay thẳng mới nhất của Vietnam Airlines vừa khai thác kết nối châu Âu và Việt Nam là đường bay nào?",opts:["MXP-HAN","CPH-SGN","AMS-HAN","MUC-SGN"],explain:"Vietnam Airlines vừa khai thác đường bay thẳng Amsterdam – Hà Nội từ tháng 6/2026. Đây là đường bay mới nhất của Vietnam Airlines, kết nối châu Âu và Việt Nam."},
 en:{q:"Which is Vietnam Airlines' newest direct route connecting Europe and Vietnam?",opts:["MXP-HAN","CPH-SGN","AMS-HAN","MUC-SGN"],explain:"Vietnam Airlines has just launched the direct Amsterdam – Hanoi route from June 2026. It is the airline's newest route connecting Europe and Vietnam."}},

{id:18,correct:1,
 vi:{q:"Vì sao Vietnam Airlines liên tục mở rộng mạng bay quốc tế?",opts:["Để giảm số chuyến bay nội địa","Để mang lại kết nối toàn cầu liền mạch hơn và hỗ trợ tăng trưởng dài hạn","Để chỉ cạnh tranh bằng giá vé","Để chỉ tập trung vào khách du lịch nghỉ dưỡng"],explain:"Mở rộng mạng bay không chỉ là thêm điểm đến. Mỗi đường bay mới đều củng cố khả năng kết nối, thu hút thêm phân khúc khách hàng mới, hỗ trợ du lịch và tạo thêm cơ hội bán hàng cho đại lý trên khắp thế giới."},
 en:{q:"Why is Vietnam Airlines continuously expanding its international network?",opts:["To reduce domestic flights","To provide more seamless global connectivity and support long-term growth","To compete only on ticket prices","To focus exclusively on leisure travel"],explain:"Expanding the network is not just about adding destinations. Every new route strengthens connectivity, attracts new customer segments, supports tourism, and creates additional selling opportunities for travel agents around the world."}},

{id:19,correct:2,
 vi:{q:"Theo chiến lược Tầm nhìn 2030, Vietnam Airlines đặt mục tiêu trở thành một trong ___ hãng hàng không dịch vụ đầy đủ hàng đầu Đông Nam Á.",opts:["10","5","3","2"],explain:"Vietnam Airlines không chỉ đơn thuần mở rộng mạng bay. Tham vọng của chúng tôi là trở thành một trong ba hãng hàng không dịch vụ đầy đủ hàng đầu Đông Nam Á, thông qua sản phẩm cao cấp, vận hành xuất sắc và trải nghiệm khách hàng nổi bật."},
 en:{q:"According to the Vision 2030 strategy, Vietnam Airlines aims to become one of the top ___ full-service airlines in Southeast Asia.",opts:["10","5","3","2"],explain:"Vietnam Airlines isn't simply expanding its network. Our ambition is to become one of Southeast Asia's top three full-service airlines by delivering premium products, operational excellence, and outstanding customer experience."}},

{id:20,correct:1,
 vi:{q:"Vietnam Airlines đánh giá incentive bán hàng chủ yếu dựa trên yếu tố nào?",opts:["Số lượng nhân sự","Kết quả doanh thu và mức độ hoàn thành KPI","Vị trí văn phòng","Chỉ số năm hợp tác"],explain:"Vietnam Airlines tưởng thưởng các đại lý liên tục đạt mục tiêu bán hàng. Các chương trình incentive dựa trên kết quả doanh thu, mức độ hoàn thành KPI và cam kết thị trường, bảo đảm những đối tác xuất sắc nhận được sự ghi nhận và hỗ trợ xứng đáng."},
 en:{q:"Vietnam Airlines evaluates sales incentives primarily based on...",opts:["Number of employees.","Revenue performance and KPI achievement.","Office location.","Years of partnership only."],explain:"Vietnam Airlines rewards agencies that consistently achieve their sales targets. Incentive programs are based on revenue performance, KPI achievement, and market commitments, ensuring that outstanding partners receive meaningful recognition and support."}},

{id:21,correct:2,
 vi:{q:"Nếu so với cách bán truyền thống “Europe → Hanoi/Saigon”, Vietnam Airlines muốn đại lý khai thác thêm cách bán nào?",opts:["Chỉ bán one-way","Chỉ tập trung vào giá","Bán toàn bộ journey: Europe → Vietnam gateway → domestic destination","Không cần quan tâm điểm đến cuối cùng"],explain:"Đây là một trong những thông điệp quan trọng nhất: Sell the journey, not just the sector. Ví dụ AMS–HAN–DAD có giá trị bán hàng lớn hơn việc chỉ nhìn vào AMS–HAN."},
 en:{q:"Compared with the traditional “Europe → Hanoi/Saigon” way of selling, what additional approach does Vietnam Airlines want agents to take?",opts:["Sell one-way only","Focus on price only","Sell the whole journey: Europe → Vietnam gateway → domestic destination","Ignore the final destination"],explain:"This is one of the most important messages: sell the journey, not just the sector. AMS–HAN–DAD, for example, is worth far more commercially than looking at AMS–HAN alone."}},

{id:22,correct:2,
 vi:{q:"Khi booking trong các tháng thấp điểm có dấu hiệu yếu, Sales Kit nên giúp đại lý nhìn nhận cơ hội như thế nào?",opts:["Không bán Vietnam Airlines trong low season","Chỉ chờ đến peak season","Sử dụng promotional fare và các chương trình kích cầu để tạo demand mới","Chỉ giảm giá cho Corporate"],explain:"Điểm mới ở đây là chuyển từ reactive selling sang tactical selling. Đại lý có thể sử dụng fare/product phù hợp để chủ động kích thích demand trong những tháng thấp điểm."},
 en:{q:"When bookings look weak in the low-season months, how should the Sales Kit help agents see the opportunity?",opts:["Stop selling Vietnam Airlines in low season","Just wait for the peak season","Use promotional fares and demand-stimulation programmes to create new demand","Discount for corporate accounts only"],explain:"The shift here is from reactive selling to tactical selling. Agents can use the right fare or product to actively stimulate demand during the quieter months."}},

{id:23,correct:2,
 vi:{q:"Đâu là cách hiểu đầy đủ nhất về định hướng của Vietnam Airlines tại thị trường châu Âu?",opts:["Tăng số lượng chuyến bay là mục tiêu duy nhất","Tập trung vào việc bán vé giá thấp nhất","Kết hợp network, product/fare mới, digital distribution, agent partnership và các giải pháp sales để tăng khả năng cạnh tranh","Chỉ tập trung vào khách người Việt"],explain:"Đây là câu tổng hợp. Các “điểm mới” không nên được nhìn riêng lẻ. Network + Product + Fare + Distribution + Agent Partnership phải cùng tạo ra một proposition cạnh tranh hơn cho Vietnam Airlines tại châu Âu."},
 en:{q:"Which is the most complete understanding of Vietnam Airlines' direction in the European market?",opts:["Increasing flight numbers is the only goal","Focusing on selling the lowest fares","Combining network, new product/fare, digital distribution, agent partnership and sales solutions to compete more strongly","Focusing on Vietnamese passengers only"],explain:"This is the synthesis question. The “what's new” items should not be looked at in isolation. Network + Product + Fare + Distribution + Agent Partnership together have to create a more competitive proposition for Vietnam Airlines in Europe."}},


// ---- added from "Question Viet addon.docx", asked after the questions above ----
{id:24,correct:1,
 vi:{q:"Điểm nào sau đây giúp phân biệt rõ nhất trải nghiệm Business Class trên tàu bay thân rộng của Vietnam Airlines với Economy Class?",opts:["Business Class chỉ có suất ăn cao cấp hơn","Business Class có ghế được thiết kế đặc biệt, có thể ngả 180°, cùng các dịch vụ ưu tiên","Business Class chỉ được ưu tiên làm thủ tục tại sân bay","Business Class được miễn tất cả các loại phụ phí"],explain:"Business Class của Vietnam Airlines không chỉ khác biệt ở suất ăn hay quy trình check-in. Trên tàu bay thân rộng, hành khách có ghế được thiết kế riêng có khả năng ngả 180 độ, cùng với nhiều dịch vụ ưu tiên từ check-in, hành lý, boarding, transfer desk đến lounge. Đây là một sản phẩm premium được thiết kế để tạo ra trải nghiệm xuyên suốt."},
 en:{q:"Which point best distinguishes the Business Class experience on Vietnam Airlines' wide-body aircraft from Economy Class?",opts:["Business Class only has better meals","Business Class has specially designed seats that recline to 180°, together with a range of priority services","Business Class only gets priority check-in at the airport","Business Class is exempt from all surcharges"],explain:"Vietnam Airlines' Business Class is not just about the meal or the check-in process. On wide-body aircraft, passengers get a purpose-designed seat that reclines fully flat to 180 degrees, along with priority services spanning check-in, baggage, boarding, transfer desk and lounge. It is a premium product designed to deliver a consistent experience end to end."}},

{id:25,correct:1,
 vi:{q:"Một gia đình đi cùng trẻ nhỏ, trong đó có một hành khách cần hỗ trợ đặc biệt. Theo Sales Kit, nhóm dịch vụ nào cho thấy Vietnam Airlines có khả năng đáp ứng nhu cầu cá nhân hóa ngoài việc bán vé?",opts:["Chỉ Advance Seat Selection và Upgrade","Travelling with Pet, Reduced Mobility Passenger và Unaccompanied Minor Service","Chỉ Excess Baggage và Special Meal","Chỉ Sky Sofa và Upgrade"],explain:"Điểm đáng chú ý trong nhóm ancillary của Vietnam Airlines là danh mục không chỉ tập trung vào các dịch vụ tạo thêm doanh thu như chọn ghế hay hành lý. VNA còn cung cấp các dịch vụ phục vụ những nhu cầu hành khách đặc thù như hành khách giảm khả năng di chuyển, trẻ em đi một mình hay hành khách đi cùng thú cưng."},
 en:{q:"A family is travelling with small children and one passenger who needs special assistance. According to the Sales Kit, which group of services shows that Vietnam Airlines can meet personalised needs beyond simply selling a ticket?",opts:["Advance Seat Selection and Upgrade only","Travelling with Pet, Reduced Mobility Passenger and Unaccompanied Minor Service","Excess Baggage and Special Meal only","Sky Sofa and Upgrade only"],explain:"What stands out about Vietnam Airlines' ancillary range is that it is not limited to revenue-generating extras like seat selection or baggage. VNA also offers services for specific passenger needs — passengers with reduced mobility, children travelling alone, and passengers travelling with pets."}},

{id:26,correct:1,

/* The source deck puts the correct answer at position B or C for almost every question,
   which players would spot within a few rounds and then simply always pick. So each question's
   four options get shuffled — but by a PRNG seeded purely from the question id, so every
   phone, the presenter screen and the admin dashboard independently derive the identical
   order with nothing to sync, AND the Vietnamese and English copies of a question end up
   with the answer behind the same letter. Wording and the answer itself are untouched. */
function seededRandom(seed){
  let t = seed >>> 0;
  return function(){
    t += 0x6D2B79F5;
    let x = t;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleOrderFor(id, n){
  const rand = seededRandom(id * 2654435761);
  const order = [];
  for(let i=0;i<n;i++) order.push(i);
  for(let i=order.length-1; i>0; i--){
    const j = Math.floor(rand()*(i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return order;
}
function loadQuestions(){
  QUESTIONS = QUESTION_BANK.map(raw=>{
    const L = raw[LANG] || raw.en;
    const order = shuffleOrderFor(raw.id, L.opts.length);
    return {
      id: raw.id,
      q: L.q,
      explain: L.explain,
      opts: order.map(i=>L.opts[i]),
      correct: order.indexOf(raw.correct),
    };
  });
  QUESTIONS_BY_ID = {};
  QUESTIONS.forEach(q=>{ QUESTIONS_BY_ID[q.id] = q; });
}
loadQuestions();

// Flag *emoji* render as plain two-letter codes on Windows (no flag glyphs in Segoe UI
// Emoji), which is exactly the admin/presenter laptop this app targets — so aircraft
// icons are small inline SVG flags instead, which look identical on every device.
function flagSvg(stripes){
  return '<svg viewBox="0 0 30 20" width="1.3em" height="0.87em" style="vertical-align:-0.15em; border-radius:2px; box-shadow:0 0 0 1px rgba(255,255,255,.35);">'+stripes+'</svg>';
}
const AVATARS = [
  flagSvg('<rect width="30" height="20" fill="#00247d"/><path d="M0 0 L30 20 M30 0 L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0 L30 20 M30 0 L0 20" stroke="#cf142b" stroke-width="2"/><path d="M15 0 V20 M0 10 H30" stroke="#fff" stroke-width="6"/><path d="M15 0 V20 M0 10 H30" stroke="#cf142b" stroke-width="3.6"/>'), // UK
  flagSvg('<rect width="10" height="20" fill="#002395"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ED2939"/>'), // France
  flagSvg('<rect width="30" height="20" fill="#DA251D"/><polygon points="15,4 16.76,9.27 22.5,9.27 17.87,12.73 19.63,18 15,14.55 10.37,18 12.13,12.73 7.5,9.27 13.24,9.27" fill="#FFCD00"/>'), // Vietnam
  flagSvg('<rect width="10" height="20" fill="#008C45"/><rect x="10" width="10" height="20" fill="#F4F5F0"/><rect x="20" width="10" height="20" fill="#CD212A"/>'), // Italy
  flagSvg('<rect width="30" height="20" fill="#fff"/><rect y="6.67" width="30" height="6.66" fill="#0039A6"/><rect y="13.33" width="30" height="6.67" fill="#D52B1E"/>'), // Russia
  flagSvg('<rect width="30" height="20" fill="#AE1C28"/><rect y="6.67" width="30" height="6.66" fill="#fff"/><rect y="13.33" width="30" height="6.67" fill="#21468B"/>'), // Netherlands
  flagSvg('<rect width="30" height="20" fill="#C60C30"/><rect x="9" width="4" height="20" fill="#fff"/><rect y="8" width="30" height="4" fill="#fff"/>'), // Denmark
  flagSvg('<rect width="30" height="6.67" fill="#000"/><rect y="6.67" width="30" height="6.66" fill="#DD0000"/><rect y="13.33" width="30" height="6.67" fill="#FFCE00"/>'), // Germany
  // Belgium — vertical black/yellow/red, so it cannot be confused with Germany's horizontal bands
  flagSvg('<rect width="10" height="20" fill="#000"/><rect x="10" width="10" height="20" fill="#FAE042"/><rect x="20" width="10" height="20" fill="#ED2939"/>'), // Belgium

/* UK, France, Vietnam, Italy, Russia, Netherlands, Denmark, Germany, Belgium.
   New flags go on the END: a player's choice is stored as the SVG markup itself, not as an
   index into this list, so appending never reassigns anybody's aircraft — but inserting in the
   middle would still be safe for the same reason. Order here is only the picker's order. */

/* ---- game mechanics: question pools, turbo boost, power question, turbulence ---- */
const TURBO_MIN_LEG = ROUTE.findIndex(r=>r.code==='MUC'); // a player unlocks Turbo once their own aircraft reaches MUC
const TURBULENCE_LEGS = [5, 9]; // 0-based leg index = "lượt chơi thứ 6 và thứ 10"
const SGN_LEG_INDEX = ROUTE.findIndex(r=>r.code==='SGN'); // arriving here arms one extra turbulence
const STORM_LEG = 7; // 0-based leg index = "lượt chơi thứ 8" — ⛈ Storm, ATC clears only the 10 fastest correct answers
function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
// Questions are served straight down the bank in order, and a question that has already
// been asked is never asked again — `questionIndexByLeg` is the record of what's been
// used, so this stays correct across Previous question, Undo, and overtime rounds alike.
// Returns null once the bank is exhausted; every caller treats that as "cannot open".
function usedQuestionIds(){
  return new Set(Object.values(state.questionIndexByLeg || {}).filter(v=>v!==null && v!==undefined));
}
// The Sunshine question is the host's, not the rotation's: it sits in the bank so every
// screen can look it up by id, but the ordinary round never serves it.
function isOrdinaryQuestion(q){ return q.id !== SUNSHINE_QUESTION_ID; }
function pickQuestionIndex(){
  const used = usedQuestionIds();
  const next = QUESTIONS.filter(isOrdinaryQuestion).find(q=>!used.has(q.id));
  return next ? next.id : null;
}
function questionsRemaining(){
  const used = usedQuestionIds();
  return QUESTIONS.filter(isOrdinaryQuestion).filter(q=>!used.has(q.id)).length;
}
function ensureQuestionPicked(){
  // ☀️ Sunshine is armed: this round asks the one question held back for it, whatever was
  // staged before. Swapping currentQuestionIndex is enough to hand the ordinary question
  // back to the pool, because questionIndexByLeg[currentQ] is what marks a question "used".
  if(state.powerQuestionActive){
    if(state.currentQuestionIndex !== SUNSHINE_QUESTION_ID){
      state.currentQuestionIndex = SUNSHINE_QUESTION_ID;
      state.questionIndexByLeg[state.currentQ] = SUNSHINE_QUESTION_ID;
      state.currentCorrectIndex = null;
    }
    return true;
  }
  if(state.currentQuestionIndex===null || state.currentQuestionIndex===undefined){
    // Stepping back to a leg that already had a question reuses that same question
    // rather than burning a fresh one out of the bank.
    const already = state.questionIndexByLeg ? state.questionIndexByLeg[state.currentQ] : null;
    const reusable = (already!==null && already!==undefined && QUESTIONS_BY_ID[already] && already!==SUNSHINE_QUESTION_ID);
    const idx = reusable ? already : pickQuestionIndex();
    if(idx===null) return false;
    state.currentQuestionIndex = idx;
    state.questionIndexByLeg[state.currentQ] = idx;
    state.currentCorrectIndex = null; // only revealed to players once the timer ends
  }
  return true;
}
/* Two turbulence rounds are fixed on the schedule; a third is armed dynamically the moment
   the first aircraft reaches SGN (see adminRevealAnswer). state.sgnTurbLeg holds which round
   that turned out to be, and is part of the admin slice so every screen agrees. */
function isTurbulenceLeg(legIndex){
  if(TURBULENCE_LEGS.includes(legIndex)) return true;
  const sgn = state.sgnTurbLeg;
  return sgn!==null && sgn!==undefined && legIndex===sgn;
}
function isStormLeg(legIndex){ return legIndex === STORM_LEG; }

/* FINAL ROUND: the moment anybody parks on FRA — the last stop before FINISH — the very
   next correct answer lands an aircraft. The sky clears to brilliant sunshine and a
   FINAL ROUND flag goes up beside the weather pill so the room knows the race is about
   to be decided. */
const FINAL_ROUND_LEG = ROUTE.length - 2; // FRA, one leg short of FINISH
function finalRoundActive(){
  if(state.gameState==='finished') return false;
  return Object.values(state.players).some(p=>!p.finishRank && p.position >= FINAL_ROUND_LEG);
}

/* The big weather/event card, shown on BOTH the presenter wall and every player's phone.
   It goes up the instant the host stages a leg with weather on it (pressing "Next question →"
   or arming the Power Question) and runs for WEATHER_ANNOUNCE_MS, after which the question
   text takes its place. Only the small weather pill remains from then on. */
// Does THIS leg carry a warning at all — independent of whether the card is still showing.
function wxKindForLeg(){
  if(isTurbulenceLeg(state.currentQ)) return {
    cls:'wx-turbulence', icon:'🌪', title:t('wx.turb.title'),
    rule:t('wx.turb.rule')
  };
  if(isStormLeg(state.currentQ)) return {
    cls:'wx-storm', icon:'⛈', title:t('wx.storm.title'),
    rule:t('wx.storm.rule')
  };
  if(state.powerQuestionActive) return {
    cls:'wx-power', icon:'⚡', title:t('wx.power.title'),
    rule:t('wx.power.rule')
  };
  return null;
}
/* How long the room waits between the host staging a leg and the question text appearing:
   the full warning window when there is a warning to read, otherwise just a short beat so
   the question doesn't snap up the instant the previous one clears. */
function legStageWait(){
  return wxKindForLeg() ? WEATHER_ANNOUNCE_MS : QUESTION_DELAY_MS;
}
function wxAnnounceActive(){
  return state.gameState==='lobby' && !!state.legAnnouncedAt && !!wxKindForLeg()
    && (Date.now() - state.legAnnouncedAt) < WEATHER_ANNOUNCE_MS;
}
function wxAnnounceFor(){
  return wxAnnounceActive() ? wxKindForLeg() : null;
}
// true once the staging wait has elapsed and the question text may go on screen
function questionPreviewReady(){
  if(!state.legAnnouncedAt) return true; // never staged (e.g. state from an older build)
  return (Date.now() - state.legAnnouncedAt) >= legStageWait();
}
// The map has a fixed number of legs, but the race keeps asking questions past the last one whenever
// fewer than FINISHERS_TO_END aircraft have reached FINISH yet, so latecomers still get a chance to
// land — those extra rounds are labelled "Overtime" instead of a leg number that would
// read as past the end of the board (e.g. "Leg 13 of 12").
function legLabel(legIndex){
  const totalLegs = ROUTE.length - 1;
  return legIndex < totalLegs ? t('common.legOf',{n:legIndex+1,total:totalLegs}) : t('common.overtime',{n:legIndex+1-totalLegs});
}
/* What the PLAYER's phone calls the current question. The bank holds more questions than
   the route has legs and the host can run overtime, so "Leg 9 of 12" was both wrong and
   confusing on the handset — the player only needs to know which turn is being played.
   The presenter wall and the admin dashboard keep legLabel(): they are steering the
   aircraft along the route and do need the leg number. */
function roundLabel(legIndex){
  return t('common.roundN',{n:legIndex+1});
}
function planeSvg(color){
  return '<svg class="plane-ico" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.18em;"><path fill="'+color+'" d="M21 16v-1.9l-8-4.95V4.5a1.5 1.5 0 0 0-3 0v4.65l-8 4.95V16l8-2.5v4.9l-2.2 1.6V22l3.7-1.1 3.7 1.1v-1.5L13.5 18v-4.9z"/></svg>';
}
function avatarHTML(face, size, color){
  size = size || '1em';
  color = color || '#005BAC';
  return '<span class="avatar-compose" style="font-size:'+size+'; display:inline-flex; align-items:center; gap:.18em;">'+planeSvg(color)+'<span class="face-emoji">'+face+'</span></span>';
}
const TIMER_SECONDS = 20;
const ANSWER_CARD_MS = 5000;      // presenter holds the correct answer this long — aircraft stay put until it clears
const URGENT_SECONDS = 5;         // countdown turns red and pulses for the final few seconds
const WEATHER_ANNOUNCE_MS = 10000; // the big turbulence/storm/power card runs this long after "Next question"
const QUESTION_DELAY_MS = 2000;    // beat between staging a normal leg and the question appearing
const FIRST_FINISH_SOLO_MS = 5000; // the first aircraft to land flies in alone, zoomed, before the rest move
/* The race is decided once this many aircraft have landed. Five, not four: 4th and 5th now
   share the bronze, so the podium is not complete until a fifth aircraft is down. */
const FINISHERS_TO_END = 5;       // 🏆 🥇 🥈 🥉 🥉
const STORAGE_KEY = "vna_sky_race_state_v1";
let bc = null;
try { bc = new BroadcastChannel('vna-sky-race'); } catch(e) { bc = null; }

function defaultState(){
  return {
    gameState: 'lobby', // lobby | question | locked | reveal | finished
    currentQ: 0, // 0-based leg index (0-11), NOT a direct index into QUESTIONS anymore
    currentQuestionIndex: null, // index into QUESTIONS chosen randomly for this leg
    currentCorrectIndex: null, // set by adminRevealAnswer; the only way non-admin clients learn the answer
    questionIndexByLeg: {}, // leg index -> QUESTIONS index, kept for history/review
    powerQuestionActive: false,
    powerQuestionUsed: false, // Power Question can only ever be activated once per game
    questionOpenedAt: null,
    revealedLegs: {},   // leg index -> true once scored, so Reveal can never double-move
    undoSnapshot: null, // one-step rollback of the last Reveal
    paused: false,
    players: {}, // id -> {id,name,avatar,position,correctCount,answers:{legIdx:{choice,submitted,turbo,timeTaken}},totalAnswerTime,turboUsed}
    winnerId: null,
    milestones: { HAN:null, SPC:null, SGN:null }, // playerId of first arrival at each checkpoint
    sgnTurbLeg: null,      // leg index of the extra turbulence armed when the first aircraft reaches SGN
    awardShown: false,
    congratsShown: false, // the presenter's "Congratulations! X wins" overlay only appears once the admin triggers it
    stormClearedIds: null, // ids of the 10 fastest correct answers on the Storm leg, fastest first
    stormRevealAt: null,   // Date.now() of the Storm reveal, so the presenter's 10s clearance list can expire
    revealAt: null,        // Date.now() the answer was revealed — drives the presenter's answer card
    legAnnouncedAt: null,  // Date.now() the leg was staged — runs the 10s weather card, then the question preview
    firstFinishAt: null,   // Date.now() the very first aircraft landed — drives the solo landing cinematic
    firstFinishId: null,   // who that was, so only their aircraft moves during it
    finishSeq: 0, // counter handing out p.finishRank in true arrival order as aircraft land on FINISH
    // Cabin Bulletin numbers for the last scored leg, computed by the admin at reveal.
    // The raw answers tree is admin-only (see database.rules.json), so the presenter can
    // never derive these itself — the admin publishes the finished figures instead.
    legBrief: null, // {leg,total,correctCount,fastestName,fastestTime,avgTime}
  };
}
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return Object.assign(defaultState(), JSON.parse(raw));
  }catch(e){}
  return defaultState();
}
/* ============================================================
   SYNC LAYER
   ONLINE  — Firebase Realtime Database. One authoritative copy in the cloud that
             every phone and screen subscribes to. Writers own disjoint paths, so
             two clients can never overwrite each other's data:
               rooms/{ROOM}/admin           <- only the admin client writes
               rooms/{ROOM}/progress/{uid}  <- only the admin client writes
               rooms/{ROOM}/profiles/{uid}  <- only that player writes
               rooms/{ROOM}/answers/{leg}/{uid} <- only that player writes, once
             database.rules.json — not client discipline — is what actually stops
             a player writing another player's score or reading the answer key
             (answers/ as a whole is admin-read-only; a player never subscribes
             to it, it just keeps a local echo of its own writes).
   OFFLINE — falls back to the original localStorage + BroadcastChannel mode so a
             single-laptop game still runs if there is no network at the venue.
   ============================================================ */
let ROOM = (new URLSearchParams(location.search).get('room') || localStorage.getItem('vna_my_room') || 'SKY01').toUpperCase();
const MAX_PLAYERS_PER_ROOM = 200;

// Every top-level `state` key except `players` (that's synced separately, per-uid,
// via profiles/progress below) — this is the admin-owned "game state" slice.
const ADMIN_KEYS = ['gameState','currentQ','currentQuestionIndex','currentCorrectIndex',
  'questionIndexByLeg','powerQuestionActive','powerQuestionUsed','questionOpenedAt','deadline',
  'revealedLegs','undoSnapshot','paused','winnerId','milestones','sgnTurbLeg','awardShown','congratsShown',
  'stormClearedIds','stormRevealAt','revealAt','legAnnouncedAt','firstFinishAt','firstFinishId','finishSeq','legBrief'];

const FB = { mode:'init', role:'player', uid:null };
let db = null;            // the Realtime Database handle, created once firebase.initializeApp() runs
let roomRefs = null;      // {admin,profiles,progress,answers} refs currently subscribed, for cleanup on room switch
let _profiles = {};       // uid -> {name,avatar,joinedAt}
let _progress = {};       // uid -> {position,correctCount,totalAnswerTime,turboUsed,finishRank,currentStreak,longestStreak,answeredCount}
let _answers = {};        // leg -> uid -> {choice,turbo,submitted,timeTaken} — only ever populated for the admin
let _boosts = {};         // leg -> uid -> {name,at} — Turbo announcements, readable by everyone (see database.rules.json)

function pickAdminSlice(){
  const o = {};
  ADMIN_KEYS.forEach(k=>{ o[k] = (state[k]===undefined ? null : state[k]); });
  return o;
}
function applyAdminSlice(v){
  if(!v) return;
  ADMIN_KEYS.forEach(k=>{ if(v[k]!==undefined) state[k] = v[k]; });
  state.revealedLegs = state.revealedLegs || {};
  state.milestones = state.milestones || { HAN:null, SPC:null, SGN:null };
  state.questionIndexByLeg = state.questionIndexByLeg || {};
}
function rebuildPlayers(){
  const out = {};
  Object.keys(_profiles).forEach(id=>{
    const pr = _progress[id] || {};
    const ans = {};
    Object.keys(_answers).forEach(leg=>{
      if(_answers[leg] && _answers[leg][id]) ans[leg] = _answers[leg][id];
    });
    out[id] = {
      id,
      name: _profiles[id].name,
      avatar: _profiles[id].avatar,
      position: pr.position || 0,
      correctCount: pr.correctCount || 0,
      totalAnswerTime: pr.totalAnswerTime || 0,
      turboUsed: !!pr.turboUsed,
      fiftyUsed: !!pr.fiftyUsed,
      seatbeltUsed: !!pr.seatbeltUsed,
      // one-way latch: once true it stays true, and it also self-heals for a player whose
      // progress node predates this field but who is already at or past MUC
      reachedMuc: !!pr.reachedMuc || (pr.position||0) >= TURBO_MIN_LEG,
      finishRank: pr.finishRank || null,
      currentStreak: pr.currentStreak || 0,
      longestStreak: pr.longestStreak || 0,
      answeredCount: pr.answeredCount || 0,
      joinedAt: _profiles[id].joinedAt || Date.now(),
      answers: ans,
    };
  });
  state.players = out;
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  if(FB.mode==='online'){
    if(FB.role==='admin') fbWriteAdmin();
    if(myPlayerId) fbWriteMine();
  } else if(bc){
    // note: BroadcastChannel never delivers to the sender, so the acting tab
    // must repaint itself — otherwise the admin's own dashboard freezes offline
    bc.postMessage({type:'state', state});
  }
  renderAll();
}
function fbWriteAdmin(){
  if(FB.mode!=='online' || FB.role!=='admin') return;
  const u = {};
  u['rooms/'+ROOM+'/admin'] = pickAdminSlice();
  Object.values(state.players).forEach(p=>{
    u['rooms/'+ROOM+'/progress/'+p.id] = {
      position: p.position||0, correctCount: p.correctCount||0,
      totalAnswerTime: p.totalAnswerTime||0, turboUsed: !!p.turboUsed,
      fiftyUsed: !!p.fiftyUsed, seatbeltUsed: !!p.seatbeltUsed, reachedMuc: !!p.reachedMuc,
      finishRank: p.finishRank||null, currentStreak: p.currentStreak||0,
      longestStreak: p.longestStreak||0, answeredCount: p.answeredCount||0,
    };
  });
  db.ref().update(u).catch(e=>{ console.warn('[sync] admin write failed', e); toast(t('sync.errAdmin')); });
}
function fbWriteMine(){
  if(FB.mode!=='online' || !myPlayerId) return;
  const me = state.players[myPlayerId];
  if(!me) return;
  const u = {};
  u['rooms/'+ROOM+'/profiles/'+myPlayerId] = { name: me.name, avatar: me.avatar, joinedAt: me.joinedAt || Date.now() };
  const a = me.answers[state.currentQ];
  if(a && a.choice!==null && a.choice!==undefined){
    const row = { choice:a.choice, turbo:!!a.turbo, fifty:!!a.fifty, seatbelt:!!a.seatbelt, submitted:!!a.submitted, timeTaken: (typeof a.timeTaken==='number') ? a.timeTaken : null };
    u['rooms/'+ROOM+'/answers/'+state.currentQ+'/'+myPlayerId] = row;
    // keep a local echo so the option immediately re-renders as picked/locked
    // (a player is never subscribed to the answers tree — see database.rules.json)
    _answers[state.currentQ] = _answers[state.currentQ] || {};
    _answers[state.currentQ][myPlayerId] = row;
  }
  db.ref().update(u).catch(e=>{ console.warn('[sync] player write failed', e); toast(t('sync.errSend')); });
}
/* the admin client creates a progress node for anyone who has just joined */
function reconcileProgress(){
  if(FB.mode!=='online' || FB.role!=='admin') return;
  const u = {};
  Object.keys(_profiles).forEach(id=>{
    if(!_progress[id]) u['rooms/'+ROOM+'/progress/'+id] = {position:0,correctCount:0,totalAnswerTime:0,turboUsed:false,fiftyUsed:false,seatbeltUsed:false,reachedMuc:false,finishRank:null,currentStreak:0,longestStreak:0,answeredCount:0};
  });
  if(Object.keys(u).length) db.ref().update(u).catch(()=>{});
}

function setSyncBadge(){
  let el = document.getElementById('syncBadge');
  if(!el){
    el = document.createElement('div');
    el.id = 'syncBadge';
    el.style.cssText = 'position:fixed;bottom:10px;right:12px;z-index:300;font-family:var(--font-mono);font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--glass-brd);background:rgba(0,20,45,.75);backdrop-filter:blur(8px);';
    document.body.appendChild(el);

    offline: [t('sync.offline'), 'rgba(240,180,60,.6)'],
    init:    [t('sync.connecting'), 'var(--glass-brd)'],
  };
  const [txt, brd] = map[FB.mode] || map.init;
  el.textContent = txt;
  el.style.borderColor = brd;

     the player has a dot on the state pill — on a phone there is no spare corner at all, and
     this badge was landing on top of the bottom position strip. */
  const vis = id => !document.getElementById(id).classList.contains('hidden');
  const onPresenter = vis('view-presenter');
  const onPlayer = vis('view-player');
  el.style.display = (onPresenter || onPlayer) ? 'none' : '';
  if(onPresenter) paintTickerFlag();
  if(onPlayer) paintPlayerConnDot();
}

function goOffline(why){
  if(FB.mode==='offline') return;
  FB.mode = 'offline';
  console.warn('[sync] running in offline mode:', why);
  state = loadState();
  setSyncBadge();
  renderAll();
}

function fbDetachRoom(){
  if(!roomRefs) return;
  roomRefs.admin.off();
  roomRefs.profiles.off();
  roomRefs.progress.off();
  if(roomRefs.boosts) roomRefs.boosts.off();
  if(roomRefs.answers) roomRefs.answers.off();
  roomRefs = null;
}
/* admin/profiles/progress are readable by any signed-in client (see database.rules.json);
   answers is admin-only and subscribed separately once the admin gate succeeds. Firebase
   RTDB fires 'value' immediately with whatever is already there and again on every change,
   so there's no separate "fetch initial state" step the way Supabase's REST+realtime split needed. */
function fbSubscribeRoom(){
  fbDetachRoom();
  const base = db.ref('rooms/'+ROOM);
  const adminRef = base.child('admin');
  const profilesRef = base.child('profiles');
  const progressRef = base.child('progress');
  adminRef.on('value', s=>{ applyAdminSlice(s.val()); renderAll(); });
  profilesRef.on('value', s=>{ _profiles = s.val()||{}; reconcileProgress(); rebuildPlayers(); renderAll(); });
  progressRef.on('value', s=>{ _progress = s.val()||{}; rebuildPlayers(); renderAll(); });
  // Turbo announcements: name + timestamp only, so unlike `answers` every role may read it.
  // This is the only way the presenter wall learns a boost was armed while the clock is
  // still running — by reveal time it would be far too late to announce.
  const boostsRef = base.child('boosts');
  boostsRef.on('value', s=>{ _boosts = s.val()||{}; renderPresenterBoosts(); });
  roomRefs = { admin:adminRef, profiles:profilesRef, progress:progressRef, boosts:boostsRef, answers:null };
  if(FB.role==='admin') fbSubscribeAnswers();
}
/* admin subscribes to the answer feed only after signing in (rules block it otherwise) */
function fbSubscribeAnswers(){
  if(FB.mode!=='online' || !roomRefs) return;
  const answersRef = db.ref('rooms/'+ROOM+'/answers');
  answersRef.on('value', s=>{ _answers = s.val()||{}; rebuildPlayers(); renderAll(); });
  roomRefs.answers = answersRef;
}

async function fbInit(){
  setSyncBadge();
  const cfgMissing = (typeof FIREBASE_CONFIG==='undefined') || !FIREBASE_CONFIG.apiKey ||
                     !FIREBASE_CONFIG.databaseURL || String(FIREBASE_CONFIG.databaseURL).indexOf('PASTE')===0;
  if(typeof firebase==='undefined'){ return goOffline('Firebase SDK not loaded'); }
  if(cfgMissing){ return goOffline('FIREBASE_CONFIG not filled in'); }

  const timer = setTimeout(()=>goOffline('no connection within 8s'), 8000);
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    const cred = await firebase.auth().signInAnonymously();
    FB.uid = cred.user.uid;
    clearTimeout(timer);
    FB.mode = 'online';

    // a player's identity is their Firebase uid, so a refresh never loses their aircraft
    if(location.hash.replace('#','')==='player') myPlayerId = FB.uid;

    fbSubscribeRoom();
    db.ref('.info/connected').on('value', s=>{
      if(FB.mode==='online') setSyncBadge();
      if(s.val()===false) console.warn('[sync] disconnected — RTDB will retry automatically');
    });
    setSyncBadge();
  }catch(e){
    clearTimeout(timer);
    goOffline(e && e.message ? e.message : e);
  }
}
/* switches the client to a different room the player typed at the join screen —
   only players do this; presenter/admin stay on the ?room= (or default) room.
   There's no "is this room open" catalog in Firebase (there was never an admin UI
   control for it even under Supabase) — any code is joinable, capped at
   MAX_PLAYERS_PER_ROOM so one room can't be overloaded by mistake. */
async function fbValidateRoom(code){
  try{
    const snap = await db.ref('rooms/'+code+'/profiles').once('value');
    if(snap.numChildren() >= MAX_PLAYERS_PER_ROOM) return { ok:false, reason:t('p.join.roomFull') };
    return { ok:true };
  }catch(e){
    return { ok:false, reason:t('p.join.roomUnreachable') };
  }
}
function fbSwitchRoom(code){
  ROOM = code;
  state = defaultState();
  fbSubscribeRoom();
  setSyncBadge();
}

window.addEventListener('storage', (e)=>{
  if(FB.mode==='online') return;
  if(e.key===STORAGE_KEY && e.newValue){
    state = JSON.parse(e.newValue);
    renderAll();
  }
});
if(bc){
  bc.onmessage = (e)=>{
    if(FB.mode==='online') return;
    if(e.data && e.data.type==='state'){ state = e.data.state; renderAll(); }
  };
}

}

function uid(){ return 'p_' + Math.random().toString(36).slice(2,9); }

/* ---------- routing between the 3 views ---------- */
function go(view){
  document.querySelectorAll('.app > section').forEach(s=>s.classList.add('hidden'));
  document.getElementById('view-'+view).classList.remove('hidden');
  document.body.classList.toggle('on-landing', view==='landing'); // shows the floating VI/EN switch

      document.body.appendChild(back);
    }
    back.classList.remove('hidden');

  if(v==='admin' && FB.role!=='admin'){ go('landing'); openAdminGate(); return; }

/* ---------- admin gate ----------
   Single fixed password, "738B", both online and offline — a deliberate
   tradeoff: whoever reads this file's source (open to anyone, e.g. via
   browser DevTools) can find it and sign in as admin. Firebase requires
   real Auth passwords to be >=6 characters, so ADMIN_PASSWORD (what's typed
   at the gate) and ADMIN_FIREBASE_PASSWORD (the real Firebase Auth password
   used behind the scenes so admin writes actually pass database.rules.json)
   are two different constants. The admin@vna-sky-race.local account's
   Firebase password MUST be set to match ADMIN_FIREBASE_PASSWORD exactly
   (Firebase console -> Authentication -> Users) for online admin login to
   work — if they ever drift apart, admin sign-in will fail online. */
const ADMIN_PASSWORD = '738B';
const ADMIN_FIREBASE_PASSWORD = 'VNA-SkyRace-738B';
function openAdminGate(){
  const modal = document.getElementById('adminGateModal');
  modal.classList.remove('hidden');
  const input = document.getElementById('adminPassInput');

/* ---------- how to play: 4 paged slides ---------- */
const RULES_PAGES = 5;
let rulesPage = 1;
function rulesGoPage(n){
  rulesPage = Math.max(1, Math.min(RULES_PAGES, n));
  document.querySelectorAll('.rules-page').forEach(p=>{
    p.classList.toggle('active', +p.dataset.page === rulesPage);
  });
  const dots = document.getElementById('rulesDots');
  dots.innerHTML = '';
  for(let i=1;i<=RULES_PAGES;i++){
    const b = document.createElement('button');
    b.className = 'rules-dot' + (i===rulesPage?' on':'');
    b.title = 'Page '+i;
    b.onclick = ()=>rulesGoPage(i);
    dots.appendChild(b);
  }
  document.getElementById('rulesPrevBtn').style.visibility = rulesPage===1 ? 'hidden' : 'visible';
  const nextBtn = document.getElementById('rulesNextBtn');
  if(rulesPage===RULES_PAGES){ nextBtn.textContent = t('rules.close'); nextBtn.onclick = closeRulesModal; }
  else { nextBtn.textContent = t('rules.next'); nextBtn.onclick = ()=>rulesGoPage(rulesPage+1); }
  document.querySelector('.rules-modal-card').scrollTop = 0;
}
/* A static drawing of the whole route for the guide — same S-curve and the same ROUTE
   coordinates the presenter map uses, so what players study here is exactly the board
   they'll race on. Purely illustrative: no aircraft, no live state. */
function buildRulesRouteMap(){
  const wrap = document.getElementById('rulesMapWrap');
  if(!wrap) return;
  const pts = ROUTE.map(a=>`${a.x},${a.y}`).join(' ');
  const nodes = ROUTE.map((a,i)=>{
    // sub-stops draw smaller here too, so the guide matches the wall
    const r = a.checkpoint ? 19 : (a.sub ? 8 : 12);
    const fill = a.checkpoint ? 'var(--vna-gold)' : (a.sub ? 'rgba(11,113,199,.65)' : 'rgba(11,113,199,.95)');
    const stroke = a.checkpoint ? '#F0D678' : 'rgba(255,255,255,.75)';
    // labels alternate above/below the node so neighbouring codes never collide
    const labelY = a.y + (i % 2 ? -(r + 12) : (r + 26));
    return `<circle cx="${a.x}" cy="${a.y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="3"/>
      <text x="${a.x}" y="${labelY}" text-anchor="middle" class="${a.checkpoint?'rm-cp':'rm-code'}">${a.code}</text>`;
  }).join('');
  // Fit the viewBox to the points themselves. The S-curve only occupies the middle ~60% of
  // the presenter's 1000-wide canvas, so reusing that canvas here left big empty margins
  // and shrank the drawing to an unreadable strip inside the narrow guide modal.
  const xs = ROUTE.map(a=>a.x), ys = ROUTE.map(a=>a.y);
  const padX = 52, padTop = 46, padBottom = 62; // room for the node rings and the code labels
  const x0 = Math.min(...xs) - padX, x1 = Math.max(...xs) + padX;
  const y0 = Math.min(...ys) - padTop, y1 = Math.max(...ys) + padBottom;
  wrap.innerHTML = `<svg viewBox="${x0} ${y0} ${x1-x0} ${y1-y0}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sky Race route">
    <polyline points="${pts}" fill="none" stroke="#D4AF37" stroke-width="4" stroke-dasharray="4 14"
      stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
    ${nodes}
  </svg>`;
}

  buildRulesRouteMap();

  document.getElementById('rulesIconSeatbelt').innerHTML = HELP_ICONS.seatbelt;
  document.getElementById('rulesModal').classList.remove('hidden');

}

async function submitAdminGate(){
  const v = document.getElementById('adminPassInput').value.trim();
  const err = document.getElementById('adminGateError');
  if(!v) return;

  if(v.toUpperCase() !== ADMIN_PASSWORD){ err.textContent = t('gate.wrong'); return; }

  if(FB.mode!=='online'){
    FB.role='admin'; closeAdminGate(); go('admin');
    return;
  }

  err.textContent = t('gate.signing');
  try{
    // the admin typed ADMIN_PASSWORD above; ADMIN_FIREBASE_PASSWORD (a different,
    // Firebase-valid constant — see the comment above ADMIN_PASSWORD) is what
    // actually authenticates against Firebase so database.rules.json admin writes work
    const cred = await firebase.auth().signInWithEmailAndPassword(ADMIN_EMAIL, ADMIN_FIREBASE_PASSWORD);
    FB.uid = cred.user.uid;
    FB.role = 'admin';
    myPlayerId = null;               // the admin is not a racer
    fbSubscribeAnswers();            // answer feed is admin-only under the rules
    reconcileProgress();
    closeAdminGate();
    go('admin');
    toast(t('gate.signedIn',{room:ROOM}));
  }catch(e){
    err.textContent = (e && e.code==='auth/too-many-requests')
      ? t('gate.tooMany')
      : t('gate.fbFail');
  }
}
document.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !document.getElementById('adminGateModal').classList.contains('hidden')){
    submitAdminGate();
  }
});

/* ---------- ambient sky: three parallax cloud layers ----------
   Far clouds are small, pale and slow; near clouds are large, brighter and quick. Each cloud
   carries its own --dur (normal) and --fast-dur (Turbo), so adding .sky-fast to the field
   speeds every layer at once while keeping their relative parallax intact. */
const CLOUD_LAYERS = [
  { cls:'layer-far',  count:5, wMin: 70, wVar: 70, durMin:150, durVar:70 },
  { cls:'layer-mid',  count:4, wMin:130, wVar:110, durMin: 85, durVar:45 },
  { cls:'layer-near', count:3, wMin:230, wVar:170, durMin: 44, durVar:22 },
];
const SKY_TURBO_FACTOR = 0.55;  // Turbo rounds run the sky at ~1.8x
(function initClouds(){
  const field = document.getElementById('cloudField');
  if(!field) return;
  CLOUD_LAYERS.forEach(L=>{
    for(let i=0;i<L.count;i++){
      const c = document.createElement('div');
      c.className = 'cloud ' + L.cls;
      const w = L.wMin + Math.random()*L.wVar, h = w*0.4;
      const dur = L.durMin + Math.random()*L.durVar;
      c.style.top = (3 + Math.random()*80) + '%';
      c.style.setProperty('--dur', dur+'s');
      c.style.setProperty('--fast-dur', (dur*SKY_TURBO_FACTOR)+'s');
      c.style.animationDelay = (-Math.random()*dur)+'s';
      c.innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 200 80"><ellipse cx="60" cy="50" rx="55" ry="28" fill="white"/><ellipse cx="110" cy="35" rx="45" ry="30" fill="white"/><ellipse cx="150" cy="52" rx="42" ry="24" fill="white"/></svg>`;
      field.appendChild(c);
    }
  });
})();
/* Turbo Boost made visible as speed rather than as a token teleporting two stops: the whole
   sky accelerates for a few seconds. Restarting the animations on class change would snap
   every cloud back to its start position, so each element's elapsed progress is preserved by
   only swapping the duration — the browser keeps the current phase. */
let _skyFastUntil = 0;
function bumpSkySpeed(ms){
  const field = document.getElementById('cloudField');
  if(!field) return;
  _skyFastUntil = Math.max(_skyFastUntil, Date.now() + (ms||6000));
  field.classList.add('sky-fast');
  clearTimeout(field._skyTimer);
  field._skyTimer = setTimeout(()=>{
    if(Date.now() >= _skyFastUntil) field.classList.remove('sky-fast');
  }, (ms||6000) + 50);
}

async function playerJoin(){
  const roomInput = document.getElementById('pRoomCode').value.trim().toUpperCase();
  const name = document.getElementById('pName').value.trim();
  if(!roomInput){ toast(t('p.join.needRoom')); return; }
  if(!name){ toast(t('p.join.needName')); return; }
  if(!selectedAvatar){ toast(t('p.join.needAvatar')); return; }

  const joinBtn = document.getElementById('pJoinBtn');
  joinBtn.disabled = true;
  try{
    if(FB.mode==='online' && roomInput!==ROOM){
      const check = await fbValidateRoom(roomInput);
      if(!check.ok){ toast('⚠️ '+check.reason); return; }
      fbSwitchRoom(roomInput);
    }

    // Online, the player's identity IS their Firebase uid — it survives a refresh,
    // a dead battery, or the phone locking, so nobody loses their aircraft mid-race.
    myPlayerId = (FB.mode==='online' && FB.uid) ? FB.uid : uid();

    localStorage.setItem('vna_my_player_id', myPlayerId);
    localStorage.setItem('vna_my_room', ROOM);
    state.players[myPlayerId] = {
      id: myPlayerId, name, avatar: selectedAvatar, position: 0, correctCount:0, answers:{}, totalAnswerTime:0, turboUsed:false, fiftyUsed:false, seatbeltUsed:false, reachedMuc:false, finishRank:null, currentStreak:0, longestStreak:0, answeredCount:0, joinedAt: Date.now()
    };
    saveState();
    document.getElementById('pRegistration').classList.add('hidden');
    document.getElementById('pGame').classList.remove('hidden');
    renderPlayer();
    toast(t('p.join.welcome',{name:name}));
  } finally {
    joinBtn.disabled = false;
  }
}

// Client-side companion to the server-enforced deadline (the answers RLS policy checks
// `deadline > now()` for online games): once a player's own countdown reaches 0, their UI stops
// taking picks/submits too, rather than staying interactive until admin clicks Close.
function myTimeUp(){
  return state.gameState==='question' && !!state.questionOpenedAt && (Date.now()-state.questionOpenedAt) >= TIMER_SECONDS*1000;
}
// seconds left on the current question, or null if no question is running — shared by the
// player countdown, the presenter countdown and the admin dashboard clock so all three agree
function secondsRemaining(){
  if(!state.questionOpenedAt) return null;
  return Math.max(0, TIMER_SECONDS - Math.floor((Date.now()-state.questionOpenedAt)/1000));
}

/* One painter for all three clocks (player phone, presenter wall, admin dashboard).
   They used to be written inside each view's own render, and each view repaints on its
   own 1-second interval — so depending where in the second a given screen happened to
   tick, two screens could sit a full second apart. This is called from a fast 200ms tick
   as well as from the renders, so every clock lands on the same number within 200ms.
   It only touches the three text nodes, never a full re-render. */
function paintCountdowns(){
  const remain = secondsRemaining();
  const running = state.gameState==='question' && remain!==null;
  const urgent = running && remain<=URGENT_SECONDS;
  const idle = state.gameState==='locked' ? t('a.locked')
             : state.gameState==='reveal' ? t('a.revealed') : '--';

  const p = document.getElementById('pTimer');
  if(p){
    p.textContent = running ? remain+'s' : idle;
    p.classList.toggle('urgent', urgent);
  }
  const a = document.getElementById('adminTimer');
  if(a){
    a.textContent = running ? remain+'s' : idle;
    a.classList.toggle('urgent', urgent);
  }
  // the presenter clock lives inside an overlay that only exists while a question is up
  const pq = document.querySelector('#presQuestionOverlay .pq-timer');
  if(pq && state.gameState!=='reveal'){
    pq.textContent = running ? remain : '--';
    pq.classList.toggle('urgent', urgent);
  }
}
function playerSubmitAnswer(choiceIdx){
  const me = state.players[myPlayerId];
  if(!me) return;
  if(state.gameState !== 'question') return;
  if(myTimeUp()){ toast(t('p.timeUpToast')); return; }
  const existing = me.answers[state.currentQ];
  if(existing && existing.submitted) return;
  me.answers[state.currentQ] = { choice: choiceIdx, submitted:false, turbo: existing ? !!existing.turbo : false, turboAt: existing ? (existing.turboAt||0) : 0, fifty: existing ? !!existing.fifty : false, seatbelt: existing ? !!existing.seatbelt : false };
  saveState();
  renderPlayer();
}
/* The three help icons. Drawn as inline SVG (and a text glyph for 50%) rather than emoji:
   emoji carry their own fixed palette, so ✂️ ⚡ 🔒 sat side by side in three different
   colours. These inherit `currentColor`, so all three always match whatever the button
   sets — including the gold business-class skin. */
const HELP_ICONS = {
  fifty: '<span class="fifty-glyph">50%</span>',
  turbo: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.6 2 5 13.4h5.3L9.5 22l8.9-11.9h-5.5z"/></svg>',
  // the aircraft "fasten seat belt" pictogram: two straps down into a solid buckle body
  // with the tongue plugged into its right-hand side
  seatbelt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">'
    + '<path d="M3.4 3.6 9.4 10.9" stroke-width="2.5"/><path d="M20.6 3.6 14.6 10.9" stroke-width="2.5"/>'
    + '<rect x="2.6" y="12" width="10.9" height="9.1" rx="2.4" fill="currentColor" stroke="none"/>'
    + '<path d="M12.4 14.1H18.3a2.1 2.1 0 0 1 2.1 2.1v0.8a2.1 2.1 0 0 1-2.1 2.1H12.4" stroke-width="2.2"/></svg>',
};

/* ---------- the three helps ----------
   All three unlock per player the moment THEIR OWN aircraft reaches MUC — not when the
   race reaches MUC — and each is usable once per game. 50:50 and Turbo are "boosts" and
   are locked during turbulence/storm/power question; Fasten Seatbelt is the mirror image,
   usable only during turbulence.
   The used-flags live on the progress node (admin-owned), so they survive a refresh and a
   player cannot hand themselves a fresh set of helps by reloading. */
function me_turbulenceActive(){ return isTurbulenceLeg(state.currentQ); }
function me_stormActive(){ return isStormLeg(state.currentQ); }
/* Reaching MUC unlocks the three helps permanently. It is a one-way latch, not a live
   position test: a player who unlocked at MUC and was then pushed back to HAN by turbulence
   keeps their helps. Losing them on the way back down would punish the same wrong answer
   twice. `reachedMuc` lives on the admin-owned progress node so it survives a refresh, and
   markMucReached() is the single place it is ever set. */
function markMucReached(p){
  if(p && !p.reachedMuc && (p.position||0) >= TURBO_MIN_LEG) p.reachedMuc = true;
}
function helpsUnlocked(){
  const me = state.players[myPlayerId];
  if(!me) return false;
  markMucReached(me);   // covers the offline path, where nothing else observes the position
  return !!me.reachedMuc;
}
function boostsBlocked(){
  return me_turbulenceActive() || me_stormActive() || !!state.powerQuestionActive;
}
function boostBlockedReason(what){
  if(me_turbulenceActive()) return t('h.blockTurb',{what:what});
  if(me_stormActive()) return t('h.blockStorm',{what:what});
  if(state.powerQuestionActive) return t('h.blockPower',{what:what});
  return t('h.blockLocked',{what:what});
}
/* true while the player can still change their mind about this leg.
   This opens the moment the QUESTION appears, not when the answers do: the host stages the
   question first and only later opens the options, and a player reading the question should
   already be able to burn 50:50 or arm Turbo. So the window is the staged preview plus the
   open question, and it closes on submit or on their own clock running out. */
function canActNow(){
  const me = state.players[myPlayerId];
  if(!me) return false;
  const a = me.answers[state.currentQ];
  if(a && a.submitted) return false;
  if(state.gameState==='question') return !myTimeUp();
  if(state.gameState==='lobby') return questionStagedOnScreen();
  return false;
}
// the staged-but-not-yet-open window: question text is on the phone, options are not
function questionStagedOnScreen(){
  const qid = state.currentQuestionIndex;
  return qid!==null && qid!==undefined && !!QUESTIONS_BY_ID[qid] && questionPreviewReady();
}
function myAnswerDraft(){
  const me = state.players[myPlayerId];
  return me.answers[state.currentQ] || { choice:null, submitted:false };
}
function isTurboEligibleNow(){
  return helpsUnlocked() && !boostsBlocked();
}
function playerToggleTurbo(){
  const me = state.players[myPlayerId];
  if(!me) return;
  if(me.turboUsed){ toast(t('h.turboUsed')); return; }
  if(myTimeUp()){ toast(t('p.timeUpToast')); return; }
  if(!isTurboEligibleNow()){ toast(boostBlockedReason(t('h.nameTurbo'))); return; }
  const existing = myAnswerDraft();
  if(existing.submitted) return;
  existing.turbo = !existing.turbo;
  existing.turboAt = existing.turbo ? Date.now() : 0;   // drives the offline call-out window
  me.answers[state.currentQ] = existing;
  announceBoost(existing.turbo);   // puts the name on the presenter wall (or takes it back off)
  saveState();
  renderPlayer();
}
/* Tells the room a Turbo was just armed. Written to its own `boosts` node rather than read
   off `answers`, because answers are admin-read-only — the wall could never see it there.
   Only a name and a timestamp go out, never the choice. Disarming removes the entry again,
   so a mis-tap that is immediately undone does not leave a name on screen. */
function announceBoost(on){
  const me = state.players[myPlayerId];
  if(!me) return;
  if(FB.mode!=='online'){
    // offline the whole state is broadcast anyway, so the presenter reads it from answers
    return;
  }
  const path = 'rooms/'+ROOM+'/boosts/'+state.currentQ+'/'+myPlayerId;
  const val = on ? { name: String(me.name||'').slice(0,18), at: Date.now() } : null;
  db.ref(path).set(val).catch(e=>console.warn('[sync] boost announce failed', e));
}
function playerUseFifty(){
  const me = state.players[myPlayerId];
  if(!me) return;
  if(me.fiftyUsed){ toast(t('h.fiftyUsed')); return; }
  if(myTimeUp()){ toast(t('p.timeUpToast')); return; }
  if(!helpsUnlocked() || boostsBlocked()){ toast(boostBlockedReason(t('h.nameFifty'))); return; }
  const existing = myAnswerDraft();
  if(existing.submitted || existing.fifty) return;
  existing.fifty = true;
  me.answers[state.currentQ] = existing;
  saveState();
  renderPlayer();
  toast(t('h.fiftyDone'));
}
function playerToggleSeatbelt(){
  const me = state.players[myPlayerId];
  if(!me) return;
  if(me.seatbeltUsed){ toast(t('h.beltUsed')); return; }
  if(myTimeUp()){ toast(t('p.timeUpToast')); return; }
  if(!helpsUnlocked()){ toast(t('h.beltNeedMuc')); return; }
  if(!me_turbulenceActive()){ toast(t('h.beltOnlyTurb')); return; }
  const existing = myAnswerDraft();
  if(existing.submitted) return;
  existing.seatbelt = !existing.seatbelt;
  me.answers[state.currentQ] = existing;
  saveState();
  renderPlayer();
}
/* Which two options 50:50 struck out. Derived, not stored: seeded by this player's id and
   the question id so the same two stay struck out across every re-render and a refresh,
   without needing another synced field. */
function hashString(s){
  let h = 2166136261;
  for(let i=0;i<String(s).length;i++){ h ^= String(s).charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function eliminatedOptions(){
  const me = state.players[myPlayerId];
  if(!me) return null;
  const a = me.answers[state.currentQ];
  if(!a || !a.fifty) return null;
  const qd = QUESTIONS_BY_ID[state.currentQuestionIndex];
  if(!qd) return null;
  const wrong = qd.opts.map((_,i)=>i).filter(i=>i!==qd.correct);
  const rand = seededRandom((hashString(myPlayerId) ^ (qd.id*2654435761)) >>> 0);
  const survivor = wrong[Math.floor(rand()*wrong.length)];
  return wrong.filter(i=>i!==survivor);
}
function playerConfirmSubmit(){
  const me = state.players[myPlayerId];
  if(!me) return;
  if(myTimeUp()){ toast(t('p.timeUpToast')); renderPlayer(); return; }
  const a = me.answers[state.currentQ];
  if(!a || a.choice===null || a.choice===undefined){ toast(t('p.pickFirst')); return; }
  a.submitted = true;
  a.timeTaken = state.questionOpenedAt ? (Date.now() - state.questionOpenedAt) : 0;
  // NB: totalAnswerTime is NOT accumulated here. It lives on the admin-owned progress node,
  // so a write from the player is discarded online and the leaderboard clock stayed at 0.
  // adminRevealAnswer sums it from each submitted answer's timeTaken instead.
  // local echo so the help buttons grey out instantly; the durable copy is written by the
  // admin client at reveal (progress is admin-owned — see database.rules.json)
  if(a.turbo) me.turboUsed = true;
  if(a.fifty) me.fiftyUsed = true;
  if(a.seatbelt) me.seatbeltUsed = true;
  saveState();
  renderPlayer();
}

/* The player's phone mirrors the weather on the presenter wall — same tint, same rain or
   sun rays — so the room and the handset tell one story. The FX layer is only mounted while
   the player view is actually on screen (renderPlayer runs on every client, presenter included). */
function applyPlayerWeatherSkin(){
  const view = document.getElementById('view-player');
  const visible = !view.classList.contains('hidden');
  const turbulent = isTurbulenceLeg(state.currentQ);
  const stormy = isStormLeg(state.currentQ) && !turbulent;
  const powerOn = !!state.powerQuestionActive && !turbulent && !stormy;
  // "live" covers both the lobby announcement and the question itself
  const live = state.gameState==='question' || state.gameState==='locked' || state.gameState==='reveal' || !!wxAnnounceFor();
  view.classList.toggle('wx-turbulence', turbulent && live);
