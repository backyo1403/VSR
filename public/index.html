    weatherBadge.classList.toggle('weather-storm', turbulent);
    weatherBadge.classList.toggle('weather-power', powerOn);
    weatherBadge.classList.toggle('weather-thunder', thunderOn);
  }
  // FINAL ROUND — brilliant sunshine, but only when no weather owns the screen; on a
  // turbulence/storm leg the weather theme still wins and only the flag goes up.
  const finalRound = finalRoundActive();
  const frBadge = document.getElementById('finalRoundBadge');
  if(frBadge) frBadge.classList.toggle('hidden', !finalRound);
  presenterEl.classList.toggle('final-round-theme', finalRound && !turbulent && !thunderOn);

  presenterEl.classList.toggle('storm-theme', turbulent);
  presenterEl.classList.toggle('sunny-theme', powerOn);
  presenterEl.classList.toggle('thunder-theme', thunderOn);
  let stormFx = document.getElementById('stormFx');
  if(turbulent && !stormFx){
    stormFx = document.createElement('div');
    stormFx.id='stormFx';
    stormFx.className='storm-fx';
    stormFx.innerHTML = '<div class="lightning-flash"></div>' + Array.from({length:26}).map(()=>`<div class="rain-drop" style="left:${Math.random()*100}%; animation-delay:${(Math.random()*1.2).toFixed(2)}s; animation-duration:${(0.5+Math.random()*0.4).toFixed(2)}s;"></div>`).join('');
    presenterEl.appendChild(stormFx);
  } else if(!turbulent && stormFx){
    stormFx.remove();
  }
  // blazing sun for the final round (skipped if a Power Question already put one up)
  let frFx = document.getElementById('finalRoundFx');
  const wantFrFx = finalRound && !turbulent && !thunderOn && !powerOn;
  if(wantFrFx && !frFx){
    frFx = document.createElement('div');
    frFx.id = 'finalRoundFx';
    frFx.className = 'sunny-fx final-round-fx';
    frFx.innerHTML = '<div class="sun-ray"></div><div class="sun-disc">☀️</div>';
    presenterEl.appendChild(frFx);
  } else if(!wantFrFx && frFx){
    frFx.remove();
  }
  let sunnyFx = document.getElementById('sunnyFx');
  if(powerOn && !sunnyFx){
    sunnyFx = document.createElement('div');
    sunnyFx.id='sunnyFx';
    sunnyFx.className='sunny-fx';
    sunnyFx.innerHTML = '<div class="sun-ray"></div>';
    presenterEl.appendChild(sunnyFx);
  } else if(!powerOn && sunnyFx){
    sunnyFx.remove();
  }
  let thunderFx = document.getElementById('thunderFx');
  if(thunderOn && !thunderFx){
    thunderFx = document.createElement('div');
    thunderFx.id='thunderFx';
    thunderFx.className='storm-fx thunder-fx';
    thunderFx.innerHTML = '<div class="lightning-flash thunder-flash"></div>' + Array.from({length:40}).map(()=>`<div class="rain-drop thunder-drop" style="left:${Math.random()*100}%; animation-delay:${(Math.random()*1.2).toFixed(2)}s; animation-duration:${(0.35+Math.random()*0.3).toFixed(2)}s;"></div>`).join('');
    presenterEl.appendChild(thunderFx);
  } else if(!thunderOn && thunderFx){
    thunderFx.remove();
  }

  // ⛈ Storm — after reveal, show the 10 ATC-cleared players for 10 seconds
  let stormClearOverlay = document.getElementById('stormClearOverlay');
  const showStormClear = !!(state.stormClearedIds && state.stormRevealAt && (Date.now()-state.stormRevealAt) < 10000);
  if(showStormClear && !stormClearOverlay){
    stormClearOverlay = document.createElement('div');
    stormClearOverlay.id = 'stormClearOverlay';
    stormClearOverlay.className = 'storm-clear-overlay';
    presenterEl.appendChild(stormClearOverlay);
  }
  if(showStormClear){
    const rows = state.stormClearedIds.map((id,i)=>{
      const p = state.players[id];
      if(!p) return '';
      return `<div class="storm-clear-row"><span class="rank">#${i+1}</span>${avatarHTML(p.avatar,'1.1em','#FFFFFF')}<span class="nm">${escapeHtml(p.name)}</span></div>`;
    }).join('');
    stormClearOverlay.innerHTML = `<div class="storm-clear-title">${t('pres.stormClear',{n:state.stormClearedIds.length})}</div><div class="storm-clear-list">${rows || ('<div class="storm-clear-row">'+t('pres.stormNone')+'</div>')}</div>`;
  } else if(!showStormClear && stormClearOverlay){
    stormClearOverlay.remove();
  }

  // The question itself on the big screen: text, all four options and the countdown, in an
  // opaque panel over the map (a blurred glass panel is unreadable from the back of a room).
  // It stays up for 3s after the reveal so everyone sees the correct answer, then clears
  // itself on the next tick.
  const mapPanelEl = document.getElementById('mapPanel');
  const answerShowing = state.gameState==='reveal' && state.revealAt && (Date.now()-state.revealAt) < ANSWER_CARD_MS;
  // staged but not opened: the question is on the wall with the answers still hidden
  const previewing = state.gameState==='lobby' && qKnown && questionPreviewReady();
  const showPresQuestion = qKnown && (previewing || state.gameState==='question' || state.gameState==='locked' || answerShowing);
  let pqEl = document.getElementById('presQuestionOverlay');
  if(showPresQuestion && mapPanelEl){
    if(!pqEl){
      pqEl = document.createElement('div');
      pqEl.id = 'presQuestionOverlay';
      pqEl.className = 'pres-question-overlay';
      mapPanelEl.appendChild(pqEl);
    }
    const qd = QUESTIONS_BY_ID[state.currentQuestionIndex];
    const remain = secondsRemaining();
    const revealed = state.gameState==='reveal';
    const correctIdx = state.currentCorrectIndex;
    const wxTag = turbulent ? ' · 🌪 '+t('wx.turbTag') : (thunderOn ? ' · ⛈ '+t('wx.stormTag') : (powerOn ? ' · ☀️ '+t('wx.powerTag') : ''));
    pqEl.innerHTML = `
      <div class="pq-head">
        <div class="pq-eyebrow">${legLabel(state.currentQ)}${wxTag}</div>
        <div class="pq-timer${(!revealed && !previewing && remain!==null && remain<=URGENT_SECONDS)?' urgent':''}">${revealed ? '✓' : (previewing || remain===null ? '--' : remain)}</div>
      </div>
      <div class="pq-text">${escapeHtml(qd.q)}</div>
      ${previewing
        ? `<div class="pq-await">${t('pres.awaitAnswers')}</div>`
        : `<div class="pq-opts">
        ${qd.opts.map((o,i)=>`<div class="pq-opt${(revealed && i===correctIdx)?' correct':''}"><span class="k">${String.fromCharCode(65+i)}</span><span>${escapeHtml(o)}</span></div>`).join('')}
      </div>`}
      ${(revealed && correctIdx!==null && correctIdx!==undefined) ? `<div class="pq-answer-tag">${t('pres.correctIs',{letter:String.fromCharCode(65+correctIdx), text:escapeHtml(qd.opts[correctIdx])})}</div>` : ''}
    `;
  } else if(pqEl){
    pqEl.remove();
  }

  // Big "here comes turbulence" card between questions — see wxAnnounceFor(). Once the
  // host opens the question this disappears and the small weather pill up top carries on.
  const announce = wxAnnounceFor();
  let pwxEl = document.getElementById('presWxAnnounce');
  if(announce && mapPanelEl){
    if(!pwxEl){
      pwxEl = document.createElement('div');
      pwxEl.id = 'presWxAnnounce';
      pwxEl.className = 'pres-wx-announce';
      mapPanelEl.appendChild(pwxEl);
    }
    pwxEl.innerHTML = `<div class="wx-announce ${announce.cls}"><div class="ic">${announce.icon}</div><div class="tt">${announce.title}</div><div class="rl">${announce.rule}</div></div>`;
  } else if(pwxEl){
    pwxEl.remove();
  }

  const statusEl = document.getElementById('presQStatus');
  if(state.gameState==='lobby') statusEl.textContent = t('pres.waitOpen',{leg:legLabel(state.currentQ)});
  else if(state.gameState==='question') statusEl.textContent = t('pres.qOpen',{leg:legLabel(state.currentQ)}) + (turbulent?t('pres.qTurb'):'');
  else if(state.gameState==='locked') statusEl.textContent = t('pres.qLocked',{leg:legLabel(state.currentQ)});
  else if(state.gameState==='reveal') statusEl.textContent = (qKnown && state.currentCorrectIndex!==null && state.currentCorrectIndex!==undefined) ? t('pres.qRevealed',{leg:legLabel(state.currentQ), letter:String.fromCharCode(65+state.currentCorrectIndex)}) : t('pres.qRevealedPlain',{leg:legLabel(state.currentQ)});
  else if(state.gameState==='finished') statusEl.textContent = t('pres.raceDone');

  // winner overlay — only appears once the admin explicitly triggers it (Game Control ->
  // "Show Congratulations"), not automatically the instant the race finishes.
  let overlay = document.getElementById('winnerOverlay');
  if(state.gameState==='finished' && state.winnerId && state.congratsShown){
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id='winnerOverlay';
      overlay.className='winner-overlay';
      document.getElementById('view-presenter').appendChild(overlay);
      fireConfetti();
    }
    const winner = state.players[state.winnerId];
    const podium = rankedPlayers().slice(0,3);
    overlay.innerHTML = `
      <div class="trophy">🏆</div>
      <h1>${t('pres.congrats')}</h1>
      <div style="font-size:20px;">${avatarHTML(winner.avatar,'1.1em','#FFFFFF')} <span class="pname">${escapeHtml(winner.name)}</span> ${t('pres.winsRace')}</div>
      <div class="podium">
        ${podium[1]?`<div class="col c2"><div>${avatarHTML(podium[1].avatar,'1.3em','#FFFFFF')}</div><div class="bar">2</div><div class="podium-name">${escapeHtml(podium[1].name)}</div></div>`:''}
        ${podium[0]?`<div class="col c1"><div>${avatarHTML(podium[0].avatar,'1.3em','#FFFFFF')}</div><div class="bar">1</div><div class="podium-name">${escapeHtml(podium[0].name)}</div></div>`:''}
        ${podium[2]?`<div class="col c3"><div>${avatarHTML(podium[2].avatar,'1.3em','#FFFFFF')}</div><div class="bar">3</div><div class="podium-name">${escapeHtml(podium[2].name)}</div></div>`:''}
      </div>
      <button class="btn btn-primary" style="margin-top:34px;" onclick="resetGame()">${t('pres.playAgain')}</button>
    `;
  } else if(overlay){
    overlay.remove();
  }

  // award ceremony overlay (manually triggered by admin, independent of race finish)
  let awardOverlay = document.getElementById('awardOverlay');
  if(state.awardShown){
    if(!awardOverlay){
      awardOverlay = document.createElement('div');
      awardOverlay.id='awardOverlay';
      awardOverlay.className='winner-overlay';
      document.getElementById('view-presenter').appendChild(awardOverlay);
      fireConfettiLight();
    }
    // 1st takes the champion's cup on its own, at the top and biggest; 2nd/3rd/4th/5th line
    // up below with gold, silver and the two shared bronzes
    const podium = rankedPlayers().slice(0,FINISHERS_TO_END);
    const champion = podium[0];
    const medallists = podium.slice(1, FINISHERS_TO_END);
    const milestoneRows = ['HAN','SPC','SGN'].map(code=>{
      const pid = state.milestones[code];
      const p = pid ? state.players[pid] : null;
      const label = code==='SPC' ? t('pres.spc') : code;
      return `<div style="display:flex; align-items:center; gap:8px; justify-content:center; font-size:13.5px; margin-top:6px;">
        <span class="tag mono">${label}</span>
        <span>${p ? avatarHTML(p.avatar,'1em','#FFFFFF')+' '+escapeHtml(p.name) : '<span style="color:rgba(255,255,255,.45);">'+t('pres.notReached')+'</span>'}</span>
      </div>`;
    }).join('');
    awardOverlay.innerHTML = `
      <h1 style="font-size:30px; margin:0 0 18px;">${t('pres.award')}</h1>
      ${champion ? `
        <div class="champion-block">
          <div class="champion-cup">🏆</div>
          <div class="champion-eyebrow">${t('pres.champion')}</div>
          <div class="champion-name">${escapeHtml(champion.name)}</div>
          <div class="champion-sub">${avatarHTML(champion.avatar,'1.1em','#FFFFFF')} &nbsp;${t('pres.correctN',{n:champion.correctCount||0})} · ⏱ ${formatTime(champion.totalAnswerTime)}</div>
        </div>` : ''}
      <div class="medal-row">
        ${medallists.map((p,i)=>`
          <div class="medal-card">
            <div class="medal-ico">${RANK_TROPHY[i+1]}</div>
            <div class="medal-place">${t('pres.placeN',{n:ordinal(i+2)})}</div>
            <div class="medal-name">${escapeHtml(p.name)}</div>
            <div class="medal-sub">${avatarHTML(p.avatar,'1em','#FFFFFF')} &nbsp;⏱ ${formatTime(p.totalAnswerTime)}</div>
          </div>`).join('')}
      </div>
      <div style="margin-top:24px; text-align:center;">
        <div style="font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:rgba(255,255,255,.55); margin-bottom:4px;">${t('pres.milestoneTitle')}</div>
        ${milestoneRows}
      </div>
    `;
  } else if(awardOverlay){
    awardOverlay.remove();
  }
}
function fireConfettiLight(){
  if(typeof confetti !== 'function') return;
  confetti({particleCount:60, spread:100, origin:{y:0.3}, colors:['#D4AF37','#F0D678','#005BAC','#ffffff'], scalar:0.9});
}
function fireConfetti(){
  if(typeof confetti !== 'function') return;
  const duration = 3000;
  const end = Date.now()+duration;
  (function frame(){
    confetti({particleCount:5, angle:60, spread:70, origin:{x:0}, colors:['#D4AF37','#F0D678','#005BAC','#ffffff']});
    confetti({particleCount:5, angle:120, spread:70, origin:{x:1}, colors:['#D4AF37','#F0D678','#005BAC','#ffffff']});
    if(Date.now()<end) requestAnimationFrame(frame);
  })();
}

// Synthesized crowd applause — the app has no bundled audio asset (keeping it fully
// offline-capable, see README), so a burst of short filtered-noise "claps" stands in
// for a real recording. Swap in a <audio> element instead if a real sample is preferred.
let _audioCtx = null;
function getAudioCtx(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!_audioCtx) _audioCtx = new AC();
  if(_audioCtx.state==='suspended') _audioCtx.resume().catch(()=>{});
  return _audioCtx;
}
function playApplause(durationMs){
  const ctx = getAudioCtx();
  if(!ctx) return;
  durationMs = durationMs || 1600;
  const now = ctx.currentTime;
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.0001, now);
  master.gain.linearRampToValueAtTime(0.32, now+0.08);
  master.gain.linearRampToValueAtTime(0.0001, now + durationMs/1000);
  master.connect(ctx.destination);

  const clapCount = Math.round(durationMs/38);
  for(let i=0;i<clapCount;i++){
    const t = now + (i/clapCount) * (durationMs/1000) * (0.85 + Math.random()*0.3);
    const bufLen = Math.max(1, Math.floor(ctx.sampleRate*0.03));
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let j=0;j<bufLen;j++) data[j] = (Math.random()*2-1) * Math.pow(1-j/bufLen, 2);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1800 + Math.random()*2400;
    filter.Q.value = 0.7;
    const g = ctx.createGain();
    g.gain.value = 0.5 + Math.random()*0.5;
    src.connect(filter).connect(g).connect(master);
    src.start(t);
  }
}

  document.querySelectorAll('.admin-nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  ['control','answers','questions','players','leaderboard'].forEach(t=>{

  });

  document.getElementById('adminTabTitle').textContent = titles[tab];
  renderAdmin();
}

/* Opening a leg is two presses, so the room can read the question before the clock starts:

     press 1 (nothing staged yet) — pick the question and start the 10s weather card; once
       that clears, the question TEXT goes up on the wall and every phone, with no options
       and no clock. This is also what "Next question →" does automatically.
     press 2 — the four options appear and the countdown starts.

   The button relabels itself between the two (see renderAdmin), so it always says which
   of the two it is about to do. */
function adminStageQuestion(){
  if(state.gameState==='finished'){ toast(t('a.t.finished')); return false; }
  if(!ensureQuestionPicked()){ toast(t('a.t.noQuestions',{n:QUESTIONS.filter(isOrdinaryQuestion).length})); return false; }
  state.legAnnouncedAt = Date.now();
  return true;
}
function adminOpenQuestion(){
  if(state.gameState==='finished'){ toast(t('a.t.finished')); return; }
  // nothing staged for this leg yet -> stage it and stop; the next press starts the clock
  if(state.gameState==='lobby' && (state.currentQuestionIndex===null || state.currentQuestionIndex===undefined)){
    if(!adminStageQuestion()) return;
    saveState();
    toast(wxKindForLeg() ? 'Weather warning up — question follows in 10s' : 'Question appears in 2s (answers still hidden)');
    return;
  }
  if(!ensureQuestionPicked()){ toast(t('a.t.noQuestions',{n:QUESTIONS.filter(isOrdinaryQuestion).length})); return; }
  state.gameState = 'question';
  state.questionOpenedAt = Date.now();
  // Hard deadline enforced by the database rules against Firebase server time, so a late
  // answer is refused even if the admin forgets to press Close or the browser hangs.
  state.deadline = Date.now() + (TIMER_SECONDS + 3) * 1000;
  saveState();
  toast(legLabel(state.currentQ)+' — answers open, clock running');
}
function adminCloseQuestion(){
  if(state.gameState!=='question'){ toast(t('a.t.noOpen')); return; }
  state.gameState = 'locked';
  saveState();
  toast(t('a.t.answersLocked'));
}
function adminRevealAnswer(){
  if(state.gameState!=='locked' && state.gameState!=='question'){ toast(t('a.t.closeFirst')); return; }
  if(state.currentQuestionIndex===null || state.currentQuestionIndex===undefined){ toast(t('a.t.openFirst')); return; }
  // ---- idempotency guard: a leg can only ever be scored once ----
  state.revealedLegs = state.revealedLegs || {};
  if(state.revealedLegs[state.currentQ]){
    state.gameState = 'reveal';
    saveState();
    toast(t('a.t.already',{n:state.currentQ+1}));
    return;
  }

  /* ---- auto-lock: a pick that was never submitted still counts ----
     Tapping an option and then freezing (or the phone locking) used to score the same as
     not answering at all. The choice is already in the database the moment it's tapped, so
     the clock running out simply locks it in. They forfeit the speed tie-break: an
     unsubmitted pick is recorded at the full question length. */
  Object.values(state.players).forEach(p=>{
    const a = p.answers[state.currentQ];
    if(a && !a.submitted && a.choice!==null && a.choice!==undefined){
      a.submitted = true;
      a.autoLocked = true;
      if(typeof a.timeTaken!=='number') a.timeTaken = TIMER_SECONDS*1000;
    }
  });

  // ---- snapshot for one-step undo (see adminUndoReveal) ----
  state.undoSnapshot = {
    leg: state.currentQ,
    players: JSON.parse(JSON.stringify(state.players)),
    milestones: JSON.parse(JSON.stringify(state.milestones||{})),
    sgnTurbLeg: (state.sgnTurbLeg===undefined ? null : state.sgnTurbLeg),
    winnerId: state.winnerId,
    gameState: state.gameState,
    finishSeq: state.finishSeq||0,
  };

  state.gameState = 'reveal';
  state.revealAt = Date.now(); // presenter shows the correct answer for 3s from here
  const correctIdx = QUESTIONS_BY_ID[state.currentQuestionIndex].correct;
  state.currentCorrectIndex = correctIdx; // now safe for players/presenter to learn via game_state
  const turbulent = isTurbulenceLeg(state.currentQ);
  // Turbulence always outranks Power Question, so the two can never both apply.
  // Arming Power on a turbulence leg is blocked in adminTogglePowerQuestion; this is a backstop.
  const isPower = state.powerQuestionActive && !turbulent;
  // Storm is a fixed leg (STORM_LEG), which never coincides with a turbulence leg, and Power
  // Question can't be armed on it (blocked in adminTogglePowerQuestion) — this is a backstop.
  const storm = isStormLeg(state.currentQ) && !turbulent && !isPower;

  // find the fastest correct answerer for Power Question bonus
  let fastestId = null, fastestTime = Infinity;
  if(isPower){
    Object.values(state.players).forEach(p=>{
      const a = p.answers[state.currentQ];
      if(a && a.submitted && a.choice===correctIdx){
        const t = (typeof a.timeTaken==='number') ? a.timeTaken : Infinity;
        if(t < fastestTime){ fastestTime = t; fastestId = p.id; }
      }
    });
  }

  // Storm: only the 10 fastest correct answers on THIS question get ATC clearance (+1 leg).
  // Everyone else — wrong, slow, or unanswered — holds position (no penalty).
  let stormClearedIds = [];
  if(storm){
    stormClearedIds = Object.values(state.players)
      .map(p=>{
        const a = p.answers[state.currentQ];
        if(!(a && a.submitted && a.choice===correctIdx)) return null;
        return { id:p.id, t:(typeof a.timeTaken==='number' ? a.timeTaken : Infinity) };
      })
      .filter(Boolean)
      .sort((a,b)=>a.t-b.t)
      .slice(0,10)
      .map(x=>x.id);
  }

  Object.values(state.players).forEach(p=>{
    const a = p.answers[state.currentQ];
    const correct = !!(a && a.submitted && a.choice===correctIdx);
    // A help only counts if it was actually submitted. Arming Turbo and never pressing
    // Submit must not cost a leg — otherwise the player is penalised AND keeps the boost.
    const turboArmed = !!(a && a.submitted && a.turbo);
    const seatbeltArmed = !!(a && a.submitted && a.seatbelt);
    // Burn the one-time helps here rather than on the player's own device: progress is
    // admin-owned, so this is the only write that survives the player refreshing their phone.
    if(a && a.submitted){
      if(a.turbo) p.turboUsed = true;
      if(a.fifty) p.fiftyUsed = true;
      if(a.seatbelt) p.seatbeltUsed = true;
    }
    // Every leg costs everyone time — the single place totalAnswerTime is accumulated (see
    // the note in playerConfirmSubmit). Answering costs what you took; sitting the question
    // out costs the full clock, so not answering can never win the time tie-break.
    if(a && a.submitted){
      p.answeredCount = (p.answeredCount||0)+1;
      p.totalAnswerTime = (p.totalAnswerTime||0) + (typeof a.timeTaken==='number' ? a.timeTaken : TIMER_SECONDS*1000);
    } else {
      p.totalAnswerTime = (p.totalAnswerTime||0) + TIMER_SECONDS*1000;
    }
    if(correct){
      p.correctCount = (p.correctCount||0)+1;
      p.currentStreak = (p.currentStreak||0)+1;
      p.longestStreak = Math.max(p.longestStreak||0, p.currentStreak);
    } else {
      p.currentStreak = 0;
    }

    let delta;
    if(turbulent){
      // 🔒 Fasten Seatbelt is the turbulence shield: ride out a wrong answer without
      // being pushed back a leg. A correct answer already holds position anyway.
      delta = correct ? 0 : (seatbeltArmed ? 0 : -1);
    } else if(isPower){
      delta = correct ? (p.id===fastestId ? 2 : 1) : 0;
    } else if(storm){
      delta = stormClearedIds.includes(p.id) ? 1 : 0;
    } else if(turboArmed){
      delta = correct ? 2 : -1;
    } else {
      delta = correct ? 1 : 0;
    }

    p.position = Math.max(0, Math.min(p.position + delta, ROUTE.length-1));
    markMucReached(p);   // latches on the way up; never cleared on the way back down
    const landedCode = ROUTE[p.position].code;
    if(['HAN','SPC','SGN'].includes(landedCode) && !state.milestones[landedCode]){
      state.milestones[landedCode] = p.id;
    }
  });

  // One extra 🌪 Turbulence, armed the moment the first aircraft reaches SGN — the NEXT
  // round flies through it. Tested on position >= SGN rather than the SGN milestone,
  // because a Turbo jump (+2) can carry an aircraft straight past the stop without ever
  // landing on it. Rounds that already carry weather are skipped so nothing double-books.
  if(state.sgnTurbLeg===null || state.sgnTurbLeg===undefined){
    if(Object.values(state.players).some(p=>(p.position||0) >= SGN_LEG_INDEX)){
      let leg = state.currentQ + 1;
      while(isStormLeg(leg) || TURBULENCE_LEGS.includes(leg)) leg++;
      state.sgnTurbLeg = leg;
    }
  }

  if(storm){
    state.stormClearedIds = stormClearedIds;
    state.stormRevealAt = Date.now();
  }

  state.revealedLegs[state.currentQ] = true;
  state.legBrief = buildLegBrief(state.currentQ, correctIdx);

  // The race keeps running until FINISHERS_TO_END aircraft have landed on FINISH — hand out
  // finishRank in true arrival order (several can land on the same reveal thanks to
  // Turbo/Power/Storm, so break ties by score then total answer time) rather than
  // ending the whole race the instant the very first player lands.
  const newArrivals = Object.values(state.players).filter(p=>p.position===ROUTE.length-1 && !p.finishRank);
  if(newArrivals.length){
    newArrivals.sort((a,b)=>
      (b.correctCount||0) - (a.correctCount||0) ||
      (a.totalAnswerTime||0) - (b.totalAnswerTime||0)
    );
    newArrivals.forEach(p=>{ state.finishSeq = (state.finishSeq||0) + 1; p.finishRank = state.finishSeq; });
    // The very first landing gets the room's full attention: the map zooms into FINISH and
    // that one aircraft flies in on its own before anybody else is allowed to move.
    const champion = newArrivals.find(p=>p.finishRank===1);
    if(champion){ state.firstFinishAt = state.revealAt; state.firstFinishId = champion.id; }
  }
  const totalFinishers = Object.values(state.players).filter(p=>p.finishRank).length;
  if(totalFinishers >= FINISHERS_TO_END && state.gameState !== 'finished'){
    state.gameState = 'finished';
    state.winnerId = Object.values(state.players).find(p=>p.finishRank===1).id;
  }
  saveState();
  toast(newArrivals.length
    ? t('a.t.landed',{n:newArrivals.length, total:totalFinishers})
    : t('a.t.moved'));
}

/* One-step rollback of the last Reveal. The safety net for: wrong answer key,
   a disputed question, or opening the wrong leg by mistake. */
function adminUndoReveal(){
  const snap = state.undoSnapshot;
  if(!snap){ toast(t('a.t.nothingUndo')); return; }
  if(!confirm(t('a.t.confirmUndo',{n:snap.leg+1}))) return;
  state.players = JSON.parse(JSON.stringify(snap.players));
  state.milestones = JSON.parse(JSON.stringify(snap.milestones||{}));
  state.sgnTurbLeg = (snap.sgnTurbLeg===undefined ? null : snap.sgnTurbLeg);
  state.winnerId = snap.winnerId;
  state.finishSeq = snap.finishSeq||0;
  state.currentQ = snap.leg;
  state.gameState = 'locked'; // back to just-before-reveal, so it can be revealed again
  if(state.revealedLegs) delete state.revealedLegs[snap.leg];
  state.undoSnapshot = null;
  state.stormClearedIds = null;
  state.stormRevealAt = null;
  state.revealAt = null;
  state.legBrief = null;
  // if that reveal was the one that produced the first landing, the cinematic is undone too
  if(state.firstFinishId && !(state.players[state.firstFinishId] || {}).finishRank){
    state.firstFinishAt = null;
    state.firstFinishId = null;
  }
  state.congratsShown = false;
  saveState();
  toast(t('a.t.undone',{n:snap.leg+1}));
}
function adminNextQuestion(){
  if(state.gameState==='finished'){ toast(t('a.t.finished')); return; }
  // The map has a fixed number of legs, but with fewer than FINISHERS_TO_END aircraft landed there's no "last leg" —
  // the race keeps going into overtime rounds (see legLabel()) until 3 have reached FINISH.
  // armed but the leg was never scored -> hand the Power Question charge back
  if(state.powerQuestionActive && !(state.revealedLegs && state.revealedLegs[state.currentQ])){
    state.powerQuestionUsed = false;
  }
  state.currentQ += 1;
  state.gameState = 'lobby';
  state.questionOpenedAt = null;
  state.currentQuestionIndex = null;
  state.powerQuestionActive = false;
  state.stormClearedIds = null;
  state.stormRevealAt = null;
  state.revealAt = null;
  // stage the new leg straight away: any weather warning runs for 10s, then the question
  // text goes up with the answers still hidden until the admin opens them
  adminStageQuestion();
  saveState();
  toast(t('a.t.advanced',{leg:legLabel(state.currentQ)}));
}
function adminPrevQuestion(){
  if(state.gameState==='finished'){ toast(t('a.t.finished')); return; }
  if(state.currentQ <= 0){ toast(t('a.t.atFirst')); return; }
  if(!confirm(t('a.t.confirmPrev',{n:state.currentQ}))) return;
  // armed but the leg was never scored -> hand the Power Question charge back
  if(state.powerQuestionActive && !(state.revealedLegs && state.revealedLegs[state.currentQ])){
    state.powerQuestionUsed = false;
  }
  state.currentQ -= 1;
  state.gameState = 'lobby';
  state.questionOpenedAt = null;
  state.currentQuestionIndex = null;
  state.powerQuestionActive = false;
  state.stormClearedIds = null;
  state.stormRevealAt = null;
  state.revealAt = null;
  if(state.winnerId){ state.winnerId = null; }
  adminStageQuestion();
  saveState();
  toast(t('a.t.wentBack',{leg:legLabel(state.currentQ)}));
}
function adminTogglePowerQuestion(){
  if(state.gameState!=='lobby'){ toast(t('a.t.powerOnlyLobby')); return; }
  if(isTurbulenceLeg(state.currentQ)){ toast(t('a.t.powerTurb',{n:state.currentQ+1})); return; }
  if(isStormLeg(state.currentQ)){ toast(t('a.t.powerStorm',{n:state.currentQ+1})); return; }
  if(state.powerQuestionUsed && !state.powerQuestionActive){ toast(t('a.t.powerUsed')); return; }
  state.powerQuestionActive = !state.powerQuestionActive;
  // arming it is itself an announcement — restart the 10s warning window so the room sees it
  if(state.powerQuestionActive) state.legAnnouncedAt = Date.now();
  // Cancelling before the question opens gives the charge back, so a mis-click does not
  // burn the single Power Question for the whole game.
  state.powerQuestionUsed = state.powerQuestionActive;
  // Arming swaps in the held-back Sunshine question; cancelling drops it and re-stages an
  // ordinary one. Clearing currentQuestionIndex first lets ensureQuestionPicked() do both.
  if(!state.powerQuestionActive && state.currentQuestionIndex===SUNSHINE_QUESTION_ID){
    state.currentQuestionIndex = null;
    state.questionIndexByLeg[state.currentQ] = null;
  }
  ensureQuestionPicked();
  saveState();
  toast(state.powerQuestionActive ? t('a.t.powerOn') : t('a.t.powerOff'));
}
function resetGame(){
  // Hard gate while a race is live: this button wipes every registered player, and
  // during an event that is unrecoverable. Requires typing the word to confirm.
  const live = state.gameState!=='lobby' || Object.keys(state.players).length>0;
  if(live){
    const typed = prompt(t('a.t.resetConfirm',{n:Object.keys(state.players).length}));
    if(typed===null) return;
    if(typed.trim().toUpperCase()!=='RESET'){ toast(t('a.t.resetCancel')); return; }
  } else if(!confirm(t('a.t.resetAll'))) return;
  state = defaultState();
  resetPresenterCinematics();
  // saveState() only ever writes the admin's *current* players (there are none
  // left in `state.players` right after a reset), so old profiles/progress/answers
  // would otherwise linger in the database forever — wipe them explicitly.
  if(FB.mode==='online' && FB.role==='admin'){
    db.ref().update({
      ['rooms/'+ROOM+'/profiles']: null,
      ['rooms/'+ROOM+'/progress']: null,
      ['rooms/'+ROOM+'/answers']: null,
      ['rooms/'+ROOM+'/boosts']: null,
    }).catch(e=>console.warn('[sync] room wipe failed', e));
    _profiles = {}; _progress = {}; _answers = {}; _boosts = {};
  }
  saveState();
  toast(t('a.t.resetDone'));
}
// Cinematic trackers live outside `state` (they're purely local presenter-screen visual
// state, never synced), so a game reset has to clear them explicitly.
function resetPresenterCinematics(){
  lastLeaderId = null;
  cinematicOvertakeId = null;
  cinematicFallenId = null;
  leaderCinematicUntil = 0;
  lastLeaderLocationCode = null;
  finishFlourishIds = new Set();
  finishCinematicPlayed = false;
  _soloZoomOn = false;
  _finishCamHoldUntil = 0;
  presCamStop = null;          // a pin camera must not survive a reset
  _skyBumpedForLeg = null;
  Object.keys(_lastLitByPlayer).forEach(k=>delete _lastLitByPlayer[k]);
  Object.keys(_planeAt).forEach(k=>delete _planeAt[k]);
  Object.keys(_planeHdg).forEach(k=>delete _planeHdg[k]);
  Object.values(_planeTurnTimer).forEach(clearTimeout);
  Object.keys(_planeTurnTimer).forEach(k=>delete _planeTurnTimer[k]);
  const zoomWrap = document.getElementById('mapZoomWrap');
  if(zoomWrap) zoomWrap.style.transform = 'scale(1)';
  applyCamera();   // a reset drops any cinematic zoom back to the host's selected CAM
  const mapPanel = document.getElementById('mapPanel');
  if(mapPanel) mapPanel.classList.remove(...ALL_SCENE_CLASSES);
  const banner = document.getElementById('newLeaderBanner');
  if(banner) banner.remove();
  // a reset changes every story at once — don't make the wall wait for the wrap
  if(typeof refreshEventFeed === 'function') refreshEventFeed(true);
}

  state.awardShown = false;

function removePlayer(id){
  const p = state.players[id];
  if(!p) return;
  if(!confirm(t('a.t.confirmRemove',{name:p.name}))) return;
  delete state.players[id];
  delete _profiles[id];
  delete _progress[id];
  if(FB.mode==='online' && FB.role==='admin'){
    db.ref().update({
      ['rooms/'+ROOM+'/profiles/'+id]: null,
      ['rooms/'+ROOM+'/progress/'+id]: null,
    }).catch(e=>console.warn('[sync] player delete failed', e));
  }
  saveState();
  toast(t('a.t.removed',{name:p.name}));
}

/* Manual override — the universal escape hatch during a live event.
   Covers everything the rules cannot: a phone that died mid-question, someone who
   lost signal, a dispute settled on stage, a player who rejoined as a new entry. */
function adminNudgePlayer(id, delta){
  const p = state.players[id];
  if(!p) return;
  const before = p.position;
  p.position = Math.max(0, Math.min(p.position + delta, ROUTE.length-1));
  if(p.position===before){ toast(t('a.t.alreadyAt',{name:p.name, code:ROUTE[before].code})); return; }
  markMucReached(p);   // a manual nudge past MUC unlocks the helps just like a correct answer
  const landedCode = ROUTE[p.position].code;
  if(['HAN','SPC','SGN'].includes(landedCode) && !state.milestones[landedCode]){
    state.milestones[landedCode] = p.id;
  }
  saveState();
  toast(t('a.t.nudged',{name:p.name, from:ROUTE[before].code, to:ROUTE[p.position].code}));
}

// Which of a player's three one-time helps are still in hand — greyed once spent, dimmer
// still while their aircraft has not yet reached MUC and none of them have unlocked yet.
// Reads the reachedMuc latch, not the live position, so the dashboard agrees with the
// player's own phone after they get pushed back below MUC.
function helpTags(p){
  const unlocked = !!p.reachedMuc || (p.position||0) >= TURBO_MIN_LEG;
  const one = (icon, used, label)=>{
    const style = !unlocked ? 'opacity:.3;' : used ? 'opacity:.35; text-decoration:line-through;' : 'color:var(--vna-gold-light);';
    return `<span class="tag" style="${style}" title="${label}${used?' — used':(unlocked?' — ready':' — locked')}">${icon}</span>`;
  };
  return one(HELP_ICONS.fifty, p.fiftyUsed, '50:50') + ' ' + one(HELP_ICONS.turbo, p.turboUsed, 'Turbo Boost') + ' ' + one(HELP_ICONS.seatbelt, p.seatbeltUsed, 'Fasten Seatbelt');
}

    : t('a.notOpened');
  const turbulentNote = isTurbulenceLeg(state.currentQ) ? t('a.turbLeg') : (isStormLeg(state.currentQ) ? t('a.stormLeg') : '');
  document.getElementById('adminCurrentQ').textContent = t('a.legStatus',{leg:legLabel(state.currentQ), state:t('st.'+state.gameState), q:qLabel, wx:turbulentNote, left:questionsRemaining()});

  paintCountdowns(); // same clock as the players and the wall — see paintCountdowns()

  // Answer key — appears the moment a question is opened/picked, so the host always
  // knows the correct answer (and explanation, if one has been written) before revealing.
  const keyPanel = document.getElementById('adminAnswerKeyPanel');
  const keyBody = document.getElementById('adminAnswerKeyBody');
  if(state.currentQuestionIndex!==null && state.currentQuestionIndex!==undefined){
    const qd = QUESTIONS_BY_ID[state.currentQuestionIndex];
    keyPanel.classList.remove('hidden');
    keyBody.innerHTML = `
      <div style="font-size:15px; font-weight:600; margin-bottom:12px;">${escapeHtml(qd.q)}</div>

  // opening a leg is two presses (stage the question, then release the answers) — the

  if(openBtn){
    const staged = state.currentQuestionIndex!==null && state.currentQuestionIndex!==undefined;
    if(state.gameState==='lobby' && !staged){
      openBtn.textContent = t('a.showQ');
      openBtn.title = t('a.showQTip');
    } else if(state.gameState==='lobby'){
      openBtn.textContent = wxAnnounceActive() ? t('a.openAWaiting') : t('a.openA');
      openBtn.title = t('a.openATip');
    } else {
      openBtn.textContent = t('a.openA');
      openBtn.title = t('a.openATip');

    powerBtn.disabled = state.gameState!=='lobby' || powerBlocked;

/* ---------- utils ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

/* Guards every render call site that dereferences QUESTIONS_BY_ID[state.currentQuestionIndex]
   without a fresh existence check. state can arrive from localStorage (an old app version,
   old id numbering), a stale BroadcastChannel/storage event, or Firebase — any of those can
   carry a currentQuestionIndex this build's QUESTION_BANK doesn't have, which would otherwise
   crash every render function on `.q` of undefined. */
function sanitizeState(){
  if(state.currentQuestionIndex!=null && !QUESTIONS_BY_ID[state.currentQuestionIndex]){
    state.currentQuestionIndex = null;
  }
}
function renderAll(){
  sanitizeState();
  setSyncBadge();
  renderPlayer();
  renderPresenter();
  renderAdmin();
}

/* The answer is no longer revealed by hand — it reveals itself the moment the countdown
   reaches zero. Scoring writes are admin-only (see database.rules.json), so the admin
   client is the one that drives it and there is no race between clients. The key includes
   questionOpenedAt so reopening a leg re-arms the trigger. */
let _autoRevealFiredFor = null;
function tickAutoReveal(){
  if(FB.role!=='admin') return;
  // deliberately no pause check: there is no Pause button any more, and honouring a stale
  // synced paused:true would wedge the auto-reveal with no way to clear it
  if(state.gameState!=='question' || !state.questionOpenedAt) return;
  if(Date.now() - state.questionOpenedAt < TIMER_SECONDS*1000) return;
  const key = state.currentQ+':'+state.currentQuestionIndex+':'+state.questionOpenedAt;
  if(_autoRevealFiredFor === key) return;
  _autoRevealFiredFor = key;
  adminRevealAnswer();
}

/* live tick — repaints whichever screen is on so countdowns run and the timed presenter
   overlays (3s answer card, 10s Storm clearance list) expire without needing a state change */
setInterval(()=>{
  tickAutoReveal();
  if(!document.getElementById('view-player').classList.contains('hidden')) renderPlayer();
  if(!document.getElementById('view-presenter').classList.contains('hidden')) renderPresenter();
  // only the Game Control tab has live-ticking content; repainting the 200-row player and
  // leaderboard tables once a second would be pure waste
  if(!document.getElementById('view-admin').classList.contains('hidden') && currentTab==='control') renderAdmin();
}, 1000);

/* Fast clock-only tick. The 1s render loop above is too coarse to keep three separately
   scheduled screens showing the same number; this repaints just the countdown text so the
   phone, the wall and the dashboard never differ by more than a fifth of a second. */
setInterval(()=>{
  paintCountdowns();
  // the Turbo call-out lives for 3s, so it needs a finer tick than the 1s render loop to
  // appear promptly and clear on time
  if(!document.getElementById('view-presenter').classList.contains('hidden')) renderPresenterBoosts();
}, 200);

/* init route from hash, then bring up the sync layer */
(function init(){
  applyStaticI18n();   // paint every data-i18n string before the first render
  initEventFeed();     // start the bottom ticker rolling; it never stops for the whole race
  const v = location.hash.replace('#','');
  if(v==='admin'){ go('landing'); openAdminGate(); }
  else if(['player','presenter'].includes(v)) go(v);
  else go('landing');
  fbInit();
})();
</script>
</body>
</html>
